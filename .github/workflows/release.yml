name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6
        with:
          path: tests/.collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Syntax-check shell scripts
        run: |
          bash -n bin/*.sh tests/run_*.sh scripts/*.sh install.sh

      - name: Run local tests
        run: ./tests/run_local_tests.sh

      - name: Pack framework tarball
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          ./scripts/pack-framework.sh -o "dist/spa-framework-${VERSION}.tar.gz"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (created before this workflow)."
            exit 0
          fi
          NOTES_FILE="$(mktemp)"
          python3 scripts/changelog_notes.py "$VERSION" > "$NOTES_FILE"
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" \
            "dist/spa-framework-${VERSION}.tar.gz" install.sh
          echo "Created GitHub Release ${TAG} after tests passed."
