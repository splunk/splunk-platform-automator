name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: Local tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v4
        with:
          path: tests/.collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Syntax-check shell scripts
        run: |
          bash -n bin/*.sh tests/run_*.sh
          if compgen -G "scripts/*.sh" > /dev/null; then
            bash -n scripts/*.sh
          fi

      # CI is Python 3.11; nested f-string quotes are 3.12+ and crash spa import.
      - name: Syntax-check Python (3.11)
        run: python -m compileall -q lib ansible/plugins

      - name: Run local tests
        run: ./tests/run_local_tests.sh
