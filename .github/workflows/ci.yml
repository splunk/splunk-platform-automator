name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: Local tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: Syntax-check shell scripts
        run: |
          bash -n bin/*.sh tests/run_*.sh
          if compgen -G "scripts/*.sh" > /dev/null; then
            bash -n scripts/*.sh
          fi

      - name: Run local tests
        run: ./tests/run_local_tests.sh
