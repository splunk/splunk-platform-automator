name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - distribution

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Syntax-check shell scripts
        run: |
          bash -n bin/*.sh tests/run_*.sh install.sh
          if compgen -G "scripts/*.sh" > /dev/null; then
            bash -n scripts/*.sh
          fi

      # CI is Python 3.11; nested f-string quotes are 3.12+ and crash spa import.
      - name: Syntax-check Python (3.11)
        run: python -m compileall -q lib ansible/plugins

  local:
    name: ${{ matrix.name }}
    needs: syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI tests
            marker: local and cli
            run: ./tests/run_cli_tests.sh -n auto --durations=25
          - name: Ansible tests
            marker: local and ansible
            run: ./tests/run_ansible_tests.sh -n auto --durations=25
          - name: Unit tests
            marker: local and not cli and not ansible
            run: ./tests/run_unit_tests.sh -n auto --durations=25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6
        with:
          path: tests/.collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Run ${{ matrix.name }} (${{ matrix.marker }})
        run: ${{ matrix.run }}
