name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - distribution

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Syntax-check shell scripts
        run: |
          bash -n bin/*.sh tests/run_*.sh install.sh
          if compgen -G "scripts/*.sh" > /dev/null; then
            bash -n scripts/*.sh
          fi

      # CI is Python 3.11; nested f-string quotes are 3.12+ and crash spa import.
      - name: Syntax-check Python (3.11)
        run: python -m compileall -q lib ansible/plugins

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.186.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --severity ERROR \
            --error \
            --metrics=off \
            --sarif \
            --output semgrep.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  local:
    name: ${{ matrix.name }}
    needs: syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI help
            marker: local and cli and not cli_runtime
            run: SPA_CLI_MARKEXPR='local and cli and not cli_runtime' ./tests/run_cli_tests.sh -n auto --durations=25
          - name: CLI runtime
            marker: local and cli and cli_runtime
            run: SPA_CLI_MARKEXPR='local and cli and cli_runtime' ./tests/run_cli_tests.sh -n auto --durations=25
          - name: Unit tests
            marker: local and not cli and not ansible
            run: ./tests/run_unit_tests.sh -n auto --durations=25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6
        with:
          path: tests/.collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Run ${{ matrix.name }} (${{ matrix.marker }})
        run: ${{ matrix.run }}

  ansible:
    name: ${{ matrix.name }}
    needs: syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ansible app-scope
            python: "3.11"
            marker: local and ansible and app_scope and not app_scope_b
            run: SPA_ANSIBLE_MARKEXPR='local and ansible and app_scope and not app_scope_b' ./tests/run_ansible_tests.sh -n auto --durations=25
            cache_id: py311-app-scope
          - name: Ansible app-scope B
            python: "3.11"
            marker: local and ansible and app_scope_b
            run: SPA_ANSIBLE_MARKEXPR='local and ansible and app_scope_b' ./tests/run_ansible_tests.sh -n auto --durations=25
            cache_id: py311-app-scope-b
          - name: Ansible env-scaffold
            python: "3.11"
            marker: local and ansible and env_scaffold
            run: SPA_ANSIBLE_MARKEXPR='local and ansible and env_scaffold' ./tests/run_ansible_tests.sh -n auto --durations=25
            cache_id: py311-env-scaffold
          - name: Ansible remaining
            python: "3.11"
            marker: local and ansible and not app_scope and not app_scope_b and not env_scaffold
            run: SPA_ANSIBLE_MARKEXPR='local and ansible and not app_scope and not app_scope_b and not env_scaffold' ./tests/run_ansible_tests.sh -n auto --durations=25
            cache_id: py311-remaining
          - name: Ansible app-scope (3.15)
            python: "3.15"
            marker: local and ansible and app_scope and not app_scope_b
            run: SPA_ANSIBLE_MARKEXPR='local and ansible and app_scope and not app_scope_b' ./tests/run_ansible_tests.sh -n auto --durations=25
            cache_id: py315-app-scope
          - name: Ansible app-scope B (3.15)
            python: "3.15"
            marker: local and ansible and app_scope_b
            run: SPA_ANSIBLE_MARKEXPR='local and ansible and app_scope_b' ./tests/run_ansible_tests.sh -n auto --durations=25
            cache_id: py315-app-scope-b
          - name: Ansible env-scaffold (3.15)
            python: "3.15"
            marker: local and ansible and env_scaffold
            run: SPA_ANSIBLE_MARKEXPR='local and ansible and env_scaffold' ./tests/run_ansible_tests.sh -n auto --durations=25
            cache_id: py315-env-scaffold
          - name: Ansible remaining (3.15)
            python: "3.15"
            marker: local and ansible and not app_scope and not app_scope_b and not env_scaffold
            run: SPA_ANSIBLE_MARKEXPR='local and ansible and not app_scope and not app_scope_b and not env_scaffold' ./tests/run_ansible_tests.sh -n auto --durations=25
            cache_id: py315-remaining
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.15
        if: matrix.python == '3.15'
        id: py315
        continue-on-error: true
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: Set up Python 3.13
        if: matrix.python == '3.15' && steps.py315.outcome != 'success'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: Set up Python
        if: matrix.python != '3.15'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6
        with:
          path: tests/.collections
          key: ansible-collections-${{ runner.os }}-${{ matrix.cache_id }}-${{ hashFiles('requirements.yml') }}

      - name: Run ${{ matrix.name }} (${{ matrix.marker }})
        run: ${{ matrix.run }}
