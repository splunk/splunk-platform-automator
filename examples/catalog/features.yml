  - id: setting.apps_cli
    title: Apps management CLI
    kind: setting
    when_to_use: >-
      Find Splunkbase apps with spa apps search QUERY (technology keywords: unix, cisco asa).
      Optional --type app|addon and --kind ta|premium_itsi|itsi_content_library|itsi_content_pack_single|es_not_premium.
      An itsi query pins app_id 1841 first; es pins 263. Each hit is compact (app_id, folder name, title,
      type, SPA kind, version, short summary).
      spa apps snippet APP_ID prints a kind-specific apps[] YAML block (TA, premium ITSI 1841,
      content library 5391, single packs). spa apps download APP_ID --yes stores the archive;
      --extract safely expands normal folder-backed apps and removes the archive;
      --overwrite replaces an existing extracted folder.
      spa apps snippet APP_ID --local
      (or --source local) resolves the folder or archive already in apps_dir, folder first.
      For custom local apps, pass FOLDER_NAME instead of
      APP_ID. Download credentials come from splunk_app_deployment.splunkbase_username /
      splunkbase_password (lookup('env', 'NAME') is resolved) before SPLUNKBASE_USERNAME /
      SPLUNKBASE_PASSWORD. Search and Splunkbase-source snippet work without an env dir. Merge
      snippets by hand until spa config (#76).
    when_not_to_use: >-
      Do not pass app lists through spa init. Do not use ITE Work 5403 (same binary as ITSI;
      use 1841). spa apps does not write splunk_config.yml or deploy. premium_app: es is #60.
    suggest: false
    keys: []
    related: ["setting.apps", "setting.apps.premium.itsi"]
    merge: deep
    snippet: |
      # spa apps search QUERY
      # spa apps snippet APP_ID
      # spa apps download APP_ID --yes
      # Merge the printed apps[] item; spa config apply is #76.


