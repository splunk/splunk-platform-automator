---
# AWS lab baseline — splunk_config.yml skeleton (no topology hosts/apps)
# Copy terraform.aws + os + splunk_defaults; add splunk_hosts from an SVA example.
# Recommended OS (SPA preference): RHEL, Ubuntu LTS, Amazon Linux, Debian — latest AMI in region.
# Guided setup: docs/Splunk_Config_Guided_Setup.md
# Skill: skills/spa/spa-create-config/ (Cursor: .cursor/skills/ symlink)
plugin: splunk-platform-automator

general:
  url_locale: en-US

# RHEL 10 default — swap os/terraform blocks per aws-os-matrix for Ubuntu, Amazon Linux, or Debian
os:
  set_hostname: true
  packages:
    - acl
    - polkit
  disable_selinux: true

terraform:
  aws:
    region: "eu-central-1"
    ami_id: "ami-0443f7d10da53831f"  # RHEL 10 (eu-central-1) — verify via splunk_config_aws.py --latest-ami --os rhel
    ssh_username: "ec2-user"
    key_name: "aws_key"
    ssh_private_key_file: "~/.ssh/aws_key.pem"
    security_group_names: ["Splunk_Basic"]
    instance_type: "t3.medium"
    root_volume_size: 50
    root_volume_type: "gp3"
    tags:
      Env: "Splunk Lab"
      SPADirName: "{{ playbook_dir | dirname | basename }}"
      splunkit_data_classification: "public"
      splunkit_environment_type: "non-prd"

splunk_defaults:
  splunk_env_name: splk
  splunk_download:
    splunk: true
    splunkforwarder: true
  splunk_set_servername: true
  splunk_set_default_hostname: true
  splunk_loginpage_print_userpw: false
  splunk_ssl:
    web:
      enable: true
    inputs:
      enable: true
    outputs:
      enable: true
  splunk_volume_defaults:
    VolumeDataSize_Free_MB: 5000

# Add splunk_idxclusters, splunk_shclusters, and splunk_hosts from examples/
# e.g. examples/4idxc2site_sh.yml (M2), examples/cm_2idxc_sh_uf.yml (C1)
