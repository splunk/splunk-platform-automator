---
# Topology only — compose with: spa init --example idx_sh_uf --provider aws|virtualbox ENV
# SVA: D1
# Lab: Standalone indexer + search head + UF.
# Do not add virtualbox:, terraform:, os:, or apps here.
plugin: splunk-platform-automator


# Splunk default settings
splunk_defaults:
  # splunk_env_name: splk
  # splunk_version: '8.2.3'
  # splunk_architecture: amd64
  # splunk_admin_password: 'splunklab'
  # splunk_license_file: Splunk_Enterprise.lic
  # splunk_indexes:
  #   test1:
  #   test2_metrics:
  #     datatype: metric

# Splunk hosts with its settings
splunk_hosts:
  # Indexer
  - name: idx
    roles:
      - indexer

  # Search Head
  - name: sh
    roles:
      - search_head

   # Universal Forwarder
  - name: uf
    roles:
      - universal_forwarder
