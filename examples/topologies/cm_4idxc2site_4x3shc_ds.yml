---
# Topology only — compose with: spa init --example cm_4idxc2site_4x3shc_ds --provider aws|virtualbox ENV
# SVA: M13
# Lab: M3 plus a dedicated ES search head cluster on each site. No ES app.
# Do not add virtualbox:, terraform:, os:, or apps here.
plugin: splunk-platform-automator


# Splunk default settings
splunk_defaults:
  # splunk_env_name: splk
  # splunk_version: '8.2.3'
  # splunk_architecture: amd64
  splunk_admin_password: "{{ lookup('env', 'SPLUNK_ADMIN_PASSWORD') }}"
  # splunk_license_file: Splunk_Enterprise.lic
  # splunk_indexes:
  #   test1:
  #   test2_metrics:
  #     datatype: metric

# Indexer Cluster settings
splunk_idxclusters:
  - idxc_name: idxc1
    idxc_password: "{{ lookup('env', 'SPLUNK_IDXC_PASSWORD') }}"
    idxc_replication_port: 9887
    idxc_site_rf: 'origin:2, total:3'
    idxc_site_sf: 'origin:1, total:2'

# Search Head Cluster settings
splunk_shclusters:
  - shc_name: shc1
    shc_site: site1
    shc_password: "{{ lookup('env', 'SPLUNK_SHC_PASSWORD') }}"
    shc_replication_port: 9887
  - shc_name: shc2
    shc_site: site2
    shc_password: "{{ lookup('env', 'SPLUNK_SHC_PASSWORD') }}"
    shc_replication_port: 9887
  - shc_name: shc_es1
    shc_site: site1
    shc_password: "{{ lookup('env', 'SPLUNK_ES_SHC_PASSWORD') }}"
    shc_replication_port: 9887
  - shc_name: shc_es2
    shc_site: site2
    shc_password: "{{ lookup('env', 'SPLUNK_ES_SHC_PASSWORD') }}"
    shc_replication_port: 9887

# Splunk hosts with its settings
splunk_hosts:
  # Deployment server and deployer for site1
  - name: ds
    roles:
      - deployment_server
      - deployer
    shcluster: shc1

  # Deployer for site2
  - name: ds2
    roles:
      - deployer
    shcluster: shc2

  # Deployer for the site1 ES search head cluster
  - name: esds1
    roles:
      - deployer
    shcluster: shc_es1

  # Deployer for the site2 ES search head cluster
  - name: esds2
    roles:
      - deployer
    shcluster: shc_es2

  # Cluster Manager
  - name: cm
    roles:
      - cluster_manager
      - monitoring_console
      #- license_manager
    idxcluster: idxc1
    site: site0

  # Cluster Indexers (site1)
  - iter:
      prefix: idx
      numbers: 1..2
    roles:
      - indexer
    idxcluster: idxc1
    site: site1

  # Cluster Indexers (site2)
  - iter:
      prefix: idx
      numbers: 3..4
    roles:
      - indexer
    idxcluster: idxc1
    site: site2

  # Search heads (site1)
  - iter:
      prefix: sh
      numbers: 1..3
    roles:
      - search_head
    shcluster: shc1
    site: site1

  # Search heads (site2)
  - iter:
      prefix: sh
      numbers: 4..6
    roles:
      - search_head
    shcluster: shc2
    site: site2

  # Dedicated ES search heads (site1)
  - iter:
      prefix: es
      numbers: 1..3
    roles:
      - search_head
    shcluster: shc_es1
    site: site1

  # Dedicated ES search heads (site2)
  - iter:
      prefix: es
      numbers: 4..6
    roles:
      - search_head
    shcluster: shc_es2
    site: site2
