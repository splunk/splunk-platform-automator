---
# Topology only — compose with: spa init --example cm_2idxc_2x3shc_ds --provider aws|virtualbox ENV
# SVA: C13
# Lab: C3 plus a dedicated ES search head cluster. Lab RF/SF 2/2. No ES app.
# Do not add virtualbox:, terraform:, os:, or apps here.
plugin: splunk-platform-automator


# Splunk default settings
splunk_defaults:
  # splunk_env_name: splk
  # splunk_version: '8.2.3'
  # splunk_architecture: amd64
  splunk_admin_password: "{{ lookup('env', 'SPLUNK_ADMIN_PASSWORD') }}"
  # splunk_license_file: Splunk_Enterprise.lic
  # splunk_indexes:
  #   test1:
  #   test2_metrics:
  #     datatype: metric

# Indexer Cluster settings
splunk_idxclusters:
  - idxc_name: idxc1
    idxc_password: "{{ lookup('env', 'SPLUNK_IDXC_PASSWORD') }}"
    idxc_replication_port: 9887
    idxc_rf: 2
    idxc_sf: 2

# Search Head Cluster settings
splunk_shclusters:
  - shc_name: shc1
    shc_site: site0
    shc_password: "{{ lookup('env', 'SPLUNK_SHC_PASSWORD') }}"
    shc_replication_port: 9887
  - shc_name: shc_es
    shc_site: site0
    shc_password: "{{ lookup('env', 'SPLUNK_ES_SHC_PASSWORD') }}"
    shc_replication_port: 9887

# Splunk hosts with its settings
splunk_hosts:
  # Cluster Manager
  - name: cm
    roles:
      - cluster_manager
      - monitoring_console
      #- license_manager
    idxcluster: idxc1

  # Cluster Indexers
  - iter:
      prefix: idx
      numbers: 1..2
    roles:
      - indexer
    idxcluster: idxc1

  # Search Heads
  - iter:
      prefix: sh
      numbers: 1..3
    roles:
      - search_head
    shcluster: shc1

  # Dedicated ES search heads
  - iter:
      prefix: es
      numbers: 1..3
    roles:
      - search_head
    shcluster: shc_es

  # Deployment server and deployer
  - name: ds
    roles:
      - deployment_server
      - deployer
    shcluster: shc1

  # Deployer for the ES search head cluster
  - name: esds
    roles:
      - deployer
    shcluster: shc_es
