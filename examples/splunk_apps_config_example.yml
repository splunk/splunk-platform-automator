---
# Example Splunk App Deployment Configuration
# Add this section to your config/splunk_config.yml file

# Splunk App Deployment Configuration
splunk_app_deployment:
  # ===========================================
  # CREDENTIALS (Optional - defaults to environment variables)
  # ===========================================
  # By default, credentials are pulled from environment variables:
  #   - SPLUNKBASE_USERNAME
  #   - SPLUNKBASE_PASSWORD
  #
  # Export before running: 
  #   export SPLUNKBASE_USERNAME='your_email@example.com'
  #   export SPLUNKBASE_PASSWORD='your_password'
  #
  # You can override the defaults here if needed:
  # splunkbase_username: "{{ lookup('env', 'SPLUNKBASE_USERNAME') }}"
  # splunkbase_password: "{{ lookup('env', 'SPLUNKBASE_PASSWORD') }}"
  
  # Alternative: Use Ansible Vault (recommended for production)
  # splunkbase_username: "{{ vault_splunkbase_username }}"
  # splunkbase_password: "{{ vault_splunkbase_password }}"
  
  # ===========================================
  # LOCAL APP REPOSITORY (Optional - has default)
  # ===========================================
  # Default: "../apps" (relative to ansible directory)
  # Override if your apps are in a different location:
  # local_app_repo_path: "../app_repo"  # Path relative to ansible directory
  
  # ===========================================
  # OPERATIONAL SETTINGS (Optional - has defaults)
  # ===========================================
  # Top-level only. Implemented options:
  # temp_dir: "/tmp/splunk_apps"              # Download cache directory
  # backup_location: "{{ splunk_home }}/var/backup/apps"
  # restart_after_deployment: true
  # target_download: false                    # When true, each target downloads from Splunkbase
  # cache_downloads: true                     # When false, remove downloaded archive after extraction
  # update_mode: "merge"                      # "merge" (default) = overlay new files, keep existing extras (e.g. local/)
  #                                           # "clean" = remove old app then install fresh
  # download_timeout: 120
  # retry_count: 3
  # splunkbase_api_url: "https://splunkbase.splunk.com/api/v1"
  #
  # Example overrides:
  # temp_dir: "/data/splunk_app_cache"
  # backup_location: "/backup/splunk/apps"
  # update_mode: "merge"                      # Global: preserve local/ customizations across updates
  # download_timeout: 300
  
  # ===========================================
  # APP DEFINITIONS
  # ===========================================
  apps:
    # -------------------------------------------
    # Example 1: Splunk Add-on from Splunkbase (Auto-calculated location)
    # -------------------------------------------
    - name: "Splunk_TA_nix"
      source: splunkbase
      app_id: 833  # Find this in the Splunkbase URL
      version: "latest"  # Optional - defaults to "latest" if not specified
      state: installed    # Optional - defaults to "installed" (can be "installed" or "absent")
      target_roles:
        - search_head
        - indexer
        - heavy_forwarder
      # target_path: auto  # Default - automatically calculated
      # For search_heads with SHC: goes to deployer etc/shcluster/apps
      # For indexers with cluster: goes to cluster_manager etc/manager-apps
      # For any role with deployment_server: goes to deployment_server etc/deployment-apps
      # Otherwise: goes to host directly etc/apps
      restart_required: true
    
    # -------------------------------------------
    # Example 2: Search App from Splunkbase
    # -------------------------------------------
    - name: "Splunk_Security_Essentials"
      source: splunkbase
      app_id: 3435
      version: "3.7.0"  # Pinned to specific version
      target_roles:
        - search_head
      target_path: "etc/apps"
      restart_required: true
    
    # -------------------------------------------
    # Example 3: ML Toolkit (Auto-deployed to SHC)
    # -------------------------------------------
    - name: "Splunk_ML_Toolkit"
      source: splunkbase
      app_id: 2890
      version: "5.4.2"
      target_roles:
        - search_head  # Automatically goes to deployer if SHC exists
      # target_path: auto  # Will calculate: etc/shcluster/apps on deployer
      restart_required: false
    
    # -------------------------------------------
    # Example 4: Universal Forwarder App (via Deployment Server)
    # -------------------------------------------
    - name: "Splunk_TA_nix"
      source: splunkbase
      app_id: 833
      target_roles:
        - universal_forwarder
      serverclass: "linux_forwarders"   # Optional: custom serverclass (default: app_<appname>)
      sc_whitelist: ["*"]               # Optional: serverclass whitelist (e.g. ["uf1", "uf2"] or ["*"])
      # sc_blacklist: ["*.dev.*"]      # Optional: exclude clients; written as blacklist.0, blacklist.1, ...
      restart_required: true
    
    # -------------------------------------------
    # Example 5: Custom Local App
    # -------------------------------------------
    - name: "my_custom_search_app"
      source: local
      path: "my_custom_search_app"  # Directory name in app_repo
      target_roles:
        - search_head
      target_path: "etc/apps"
      update_mode: "merge"          # Keep local/ customizations across updates
      restart_required: true
    
    # -------------------------------------------
    # Example 6: Base Configuration App (Deployment Server)
    # -------------------------------------------
    - name: "org_all_search_base"
      source: local
      path: "org_all_search_base"       # Directory under local_app_repo_path
      target_roles:
        - deployment_server
      target_path: "etc/deployment-apps"
      serverclass: "all_forwarders"
      sc_whitelist: ["*"]
      restart_required: false
    
    # -------------------------------------------
    # Example 7: Indexer Cluster Bundle (Auto or Manual)
    # -------------------------------------------
    - name: "org_cluster_indexer_base"
      source: local
      path: "org_cluster_indexer_base"
      target_roles:
        - indexer  # Auto: goes to cluster_manager etc/manager-apps
      # target_path: auto  # OR manual override:
      # target_path: "etc/manager-apps"
      restart_required: false
    
    # -------------------------------------------
    # Example 8: Pinned Version
    # -------------------------------------------
    - name: "Splunk_TA_windows"
      source: splunkbase
      app_id: 742
      version: "8.8.2"
      state: installed
      target_roles:
        - search_head
      target_path: "etc/apps"
      restart_required: true

    # -------------------------------------------
    # Example 9: Premium App – Splunk IT Service Intelligence (ITSI)
    # -------------------------------------------
    # ITSI is delivered as a single archive; the role extracts and deploys per role (CM, LM, Deployer, SH).
    # No target_roles: deployment targets are determined by the premium_app role. Use hosts_whitelist
    # OR shc_whitelist when you have multiple SHs/SHCs (required if both standalone SH and SHC exist).
    - name: "Splunk IT Service Intelligence"
      source: splunkbase
      app_id: 1841
      version: "latest"                   # Or pin e.g. "4.21.0"
      state: installed
      premium_app: itsi
      # Optional: deploy only to a dedicated ITSI search head cluster (must match splunk_shclusters)
      shc_whitelist: ["shc_itsi"]
      # Optional: or use hosts_whitelist for a single standalone search head, e.g. hosts_whitelist: [standalone_sh]
      # Optional ITSI options:
      # itsi_index_home_path: "volume:primary"
      # itsi_index_cold_path: "volume:cold"
      # itsi_notification_disable: ["remedy", "victorops"]
    
    # -------------------------------------------
    # Example 10: Remove an App (State Management)
    # -------------------------------------------
    - name: "deprecated_app"
      source: splunkbase  # source required even for removal
      app_id: 999
      state: absent  # Remove this app
      target_roles:
        - search_head
        - indexer
      # When state=absent: app directory is removed; Splunk restarted if configured. Idempotent if app already missing.

    # -------------------------------------------
    # Example 11: Minimal App Definition (Uses Defaults)
    # -------------------------------------------
    - name: "Splunk_TA_aws"
      source: splunkbase
      app_id: 1876
      target_roles:
        - search_head
      # version: "latest" (default)
      # state: installed (default)

    # -------------------------------------------
    # Example 12: ITSI Content Pack (per-app structure only)
    # -------------------------------------------
    # Deploys to the same search heads (and ITSI targets) as the ITSI app. Requires an ITSI app
    # entry with state: installed. No target_roles or premium_app on the content pack entry.
    # Options (content_pack_install, content_pack_api, customizations) are only per content_pack_apps item.
    # Top-level name is the library folder; list additional pack folders in content_pack_apps only.
    # run_playbook_after_restart convention: ancustom/<app_name>_configure.yml
    - name: DA-ITSI-ContentLibrary
      itsi_content_pack: true
      state: installed
      version: "2.4.0"
      source: local
      path: "splunk-app-for-content-packs_240.spl"
      install_all_apps: false
      content_pack_apps:
        - name: DA-ITSI-CP-monitoring-alerting
          content_pack_install: true
          content_pack_api:
            install_all: true
            enabled: true   # set true to enable; default false
            saved_search_action: "disable"
            backfill: false
            resolution: "overwrite"
            # prefix: ""    # optional; default ""
          customizations:
            run_playbook_after_restart: "ansible/apps_playbooks/DA-ITSI-CP-monitoring-alerting_configure.yml"
            extra_vars:
              generic_alerts_index: generic_alerts
        - name: DA-ITSI-CP-splunk-observability
          content_pack_install: true
          content_pack_api:
            install_all: true
            enabled: true   # set true to enable; default false
            saved_search_action: "disable"
            backfill: false
            resolution: "overwrite"
            # prefix: ""    # optional; default ""
          customizations:
            run_playbook_after_restart: "ansible/apps_playbooks/DA-ITSI-CP-splunk-observability_configure.yml"
            extra_vars: {}

  # ===========================================
  # HOST-SPECIFIC APPS (Reserved – not in current implementation)
  # ===========================================
  # Per-host app overrides are not implemented. Use target_roles and filters
  # (hosts_whitelist, shc_whitelist, sc_whitelist, etc.) in the apps list instead.
  # See docs/App_Deployment_Target_Filters.md and docs/App_Deployment_Guide.md.

# ===========================================
# TARGET LOCATIONS REFERENCE
# ===========================================
# etc/apps                    - Standard apps location
# etc/deployment-apps         - Deployment Server apps
# etc/shcluster/apps         - Search Head Cluster apps (on Deployer)
# etc/manager-apps           - Indexer Cluster apps (on Cluster Manager)
# etc/master-apps            - Legacy name for manager-apps

# ===========================================
# SPLUNKBASE APP ID REFERENCE
# ===========================================
# Find app IDs in Splunkbase URLs:
# https://splunkbase.splunk.com/app/833/   <- 833 is the app_id
#
# Common Apps:
# - Splunk_TA_nix: 833
# - Splunk_TA_windows: 742
# - Splunk_TA_aws: 1876
# - Splunk DB Connect: 2686
# - ML Toolkit: 2890
# - Splunk Security Essentials: 3435
# - Splunk Enterprise Security: 263
# - Splunk IT Service Intelligence: 1841

# ===========================================
# TARGET ROLES REFERENCE
# ===========================================
# Available roles from your configuration:
# - search_head
# - indexer
# - cluster_manager
# - deployment_server
# - deployer
# - heavy_forwarder
# - universal_forwarder
# - license_manager
# - monitoring_console
