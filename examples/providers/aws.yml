---
# Provider only — compose with: spa init --example TOPOLOGY --provider aws ENV
# terraform.aws knobs only. OS packages, polkit, and ssh_username live in the feature catalog.
plugin: splunk-platform-automator
terraform:
  aws:
    region: "eu-central-1"
    ami_id: "ami-0443f7d10da53831f"
    key_name: "aws_key"
    ssh_private_key_file: "~/.ssh/aws_key.pem"
    security_group_names: ["Splunk_Basic"]
    instance_type: "t3.medium"
    root_volume_size: 50
    root_volume_type: "gp3"
    tags:
      Env: "Splunk Lab"
      SPADirName: "{{ spa_env_dir | basename }}"
      splunkit_data_classification: "public"
      splunkit_environment_type: "non-prd"
