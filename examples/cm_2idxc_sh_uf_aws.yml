---
# splunk_config.yml — C1 on AWS Terraform (CM + 2 IDXC + SH + UF)
# Copy via: ./bin/init_spa_dir.sh --example cm_2idxc_sh_uf_aws.yml ~/labs/my-lab
# VirtualBox variant: examples/cm_2idxc_sh_uf.yml
plugin: splunk-platform-automator

general:
  url_locale: en-US

os:
  set_hostname: true
  packages:
    - acl
    - polkit
  disable_selinux: true

terraform:
  aws:
    region: "eu-central-1"
    ami_id: "ami-0443f7d10da53831f"  # RHEL 10 (eu-central-1) — verify via splunk_config_aws.py --latest-ami --os rhel
    ssh_username: "ec2-user"
    key_name: "aws_key"
    ssh_private_key_file: "~/.ssh/aws_key.pem"
    security_group_names: ["Splunk_Basic"]
    instance_type: "t3.medium"
    root_volume_size: 50
    root_volume_type: "gp3"
    tags:
      Env: "Splunk Lab"
      SPADirName: "{{ spa_lab_dir | default(playbook_dir | dirname) | basename }}"
      splunkit_data_classification: "public"
      splunkit_environment_type: "non-prd"

splunk_defaults:
  splunk_env_name: splk
  splunk_download:
    splunk: true
    splunkforwarder: true
  splunk_set_servername: true
  splunk_set_default_hostname: true
  splunk_loginpage_print_userpw: false
  splunk_ssl:
    web:
      enable: true
    inputs:
      enable: true
    outputs:
      enable: true
  splunk_volume_defaults:
    VolumeDataSize_Free_MB: 5000

splunk_idxclusters:
  - idxc_name: idxc1
    idxc_password: splunkidxc
    idxc_replication_port: 9887
    idxc_rf: 2
    idxc_sf: 2

splunk_hosts:
  - name: cm
    roles:
      - cluster_manager
      - deployment_server
      - monitoring_console
    idxcluster: idxc1

  - iter:
      prefix: idx
      numbers: 1..2
    roles:
      - indexer
    idxcluster: idxc1

  - name: sh
    roles:
      - search_head

  - name: uf
    roles:
      - universal_forwarder
