---
# Localhost contract for issue #88. The secret is injected with lookup('env')
# so this file never contains a credential value.
- name: Credential output contract
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    splunk_home: "{{ lookup('env', 'SPA_FAKE_SPLUNK_HOME') }}"
    splunk_user: "{{ lookup('env', 'SPA_FAKE_USER') }}"
    splunk_group: "{{ lookup('env', 'SPA_FAKE_GROUP') }}"
    splunk_admin_password: "{{ lookup('env', 'SPA_SENTINEL') }}"
    spa_splunk_cli_become: false
  tasks:
    - name: Run splunk through the auth-file helper
      ansible.builtin.include_role:
        name: splunk_common
        tasks_from: run_splunk_cli.yml
      vars:
        spa_splunk_cli_become: false
        spa_splunk_cli_args:
          - version
        spa_splunk_cli_register_as: cli_out

    - name: Censor a command that would print the sentinel
      ansible.builtin.command:
        argv:
          - printf
          - "%s"
          - "{{ lookup('env', 'SPA_SENTINEL') }}"
      no_log: true
