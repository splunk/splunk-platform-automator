[pytest]
markers =
    incremental: mark tests as incremental (sequential, fail-fast)
    always_run: mark tests to always run even if previous incremental tests failed
    xdist_group: mark tests to run on the same worker
    local: tests that do not require AWS or a live Splunk deployment
    aws: tests that require AWS provisioning or deployed infrastructure
    itsi: ITSI content pack related tests (optional filter)
testpaths = tests
python_files = test_*.py
