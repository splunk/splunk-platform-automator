# Minimal config for app deployment playbook tests.
# Use inventory = localhost, so no inventory file is loaded and extra vars (-e @file) are the only source of splunk_app_deployment.
# Paths are relative to the current working directory (project root) when the test runs.
[defaults]
inventory = localhost,
roles_path = ./ansible/roles
host_key_checking = false
local_tmp = ../../.ansible_tmp
