# Invalid: duplicate app deployment (used by tests that expect schema validation to raise).
#
# Schema flags duplicates in two cases (not only target_roles):
#
# 1) Same (name, deployment_target, target_roles, filters) = same target hosts and directory.
#    Customizations (e.g. local_configs) do not change destination.
#
# 2) Two rows that actually get a DS serverclass and share the effective serverclass
#    (explicit serverclass or default app_<name>). Topology decides DS use: clustered
#    indexer/SH copies do not collide with a UF serverclass. Standalone search_head
#    plus universal_forwarder with a deployment_server host do (both are DS clients).
#
# This config triggers (2) when validated against ds + standalone SH + UF hosts.
# The second entry adds customizations to show that customizations do not avoid the duplicate.
splunk_app_deployment:
  apps:
    - name: Splunk_TA_nix
      source: splunkbase
      app_id: "833"
      version: "latest"
      deployment_target: auto
      target_roles:
        - search_head
        - indexer

    - name: Splunk_TA_nix
      source: splunkbase
      app_id: "833"
      version: "latest"
      deployment_target: auto
      target_roles:
        - universal_forwarder
      customizations:
        local_configs:
          inputs.conf:
            "script://./bin/df_metric.sh":
              disabled: 0
              index: itsi_im_metrics
