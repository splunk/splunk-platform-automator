---
# Scenario: sh_filters
# Two deployers (ds→shc1, ds2→shc2); standalone sh; three apps: MySHC1App→shc1, MySHC2App→shc2, MySingleSHApp→standalone sh only (hosts_whitelist: [sh]).
# Verifies: deployer gets SHC apps only (ds→MySHC1App/targets sh11,sh12,sh13; ds2→MySHC2App/targets sh21,sh22,sh23); DS gets only MySingleSHApp for sh.
plugin: splunk-platform-automator

splunk_shclusters:
  - shc_name: shc1
    shc_site: site0
    shc_password: splunkshc
    shc_replication_port: 9887

  - shc_name: shc2
    shc_site: site0
    shc_password: splunkshc
    shc_replication_port: 9888

splunk_hosts:
  - name: ds
    roles:
      - deployment_server
      - deployer
    shcluster: shc1

  - name: ds2
    roles:
      - deployer
    shcluster: shc2

  - name: sh
    roles:
      - search_head

  - iter:
      prefix: sh1
      numbers: 1..3
    roles:
      - search_head
    shcluster: shc1

  - iter:
      prefix: sh2
      numbers: 1..3
    roles:
      - search_head
    shcluster: shc2

  - name: idx
    roles:
      - indexer

  - name: uf
    roles:
      - universal_forwarder

splunk_app_deployment:
  apps:
    - name: MySHC1App
      source: local
      target_roles:
        - search_head
      shc_whitelist: [shc1]

    - name: MySHC2App
      source: local
      target_roles:
        - search_head
      shc_whitelist: [shc2]

    - name: MySingleSHApp
      source: local
      target_roles:
        - search_head
      hosts_whitelist: [sh]
