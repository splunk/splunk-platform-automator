---
# Scenario: es_shc
# Deployer + dedicated SHC (sh1, sh2, sh3) + sibling standalone sh. ES with shc_whitelist: [shc1].
# Verifies: ES on deployer targeting SHC members only; not on the sibling standalone SH.
plugin: splunk-platform-automator

splunk_defaults:
  splunk_admin_password: "{{ lookup('env', 'SPLUNK_ADMIN_PASSWORD') }}"
  splunk_license_file: [Splunk_Enterprise.lic]

splunk_shclusters:
  - shc_name: shc1
    shc_site: site0
    shc_password: splunkshc
    shc_replication_port: 9887

splunk_hosts:
  - name: ds
    roles:
      - deployment_server
      - deployer
      - license_manager
    shcluster: shc1

  - iter:
      prefix: sh
      numbers: 1..3
    roles:
      - search_head
    shcluster: shc1

  - name: sh
    roles:
      - search_head

  - name: idx
    roles:
      - indexer

  - name: uf
    roles:
      - universal_forwarder

splunk_app_deployment:
  apps:
    - name: "Splunk Enterprise Security"
      source: splunkbase
      app_id: 263
      premium_app: es
      shc_whitelist: [shc1]
