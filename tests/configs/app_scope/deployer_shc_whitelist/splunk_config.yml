---
# Scenario: deployer_shc_whitelist
# Two deployers (ds→shc1, ds2→shc2); MyApp→shc1 only, MyOtherApp→shc2 only via shc_whitelist.
# Verifies: each deployer gets only its SHC's app and targets the correct SHC members.
plugin: splunk-platform-automator

splunk_shclusters:
  - shc_name: shc1
    shc_site: site0
    shc_password: splunkshc
    shc_replication_port: 9887

  - shc_name: shc2
    shc_site: site0
    shc_password: splunkshc
    shc_replication_port: 9888

splunk_hosts:
  - name: ds
    roles:
      - deployer
    shcluster: shc1

  - name: ds2
    roles:
      - deployer
    shcluster: shc2

  - iter:
      prefix: sh
      numbers: 1..3
    roles:
      - search_head
    shcluster: shc1

  - iter:
      prefix: sh
      numbers: 4..6
    roles:
      - search_head
    shcluster: shc2

splunk_app_deployment:
  apps:
    - name: MyApp
      source: local
      target_roles:
        - search_head
      shc_whitelist: [shc1]

    - name: MyOtherApp
      source: local
      target_roles:
        - search_head
      shc_whitelist: [shc2]
