---
# spa-run:
#   schema: 1
#   summary: Disable Splunk Web.
#   description: Disables Splunk Web on targeted hosts (stops the web UI).
#   category: operations
#   risk: mutating
#   requires_provisioned: true
#   examples:
#     - spa run splunk_web_disable --hosts indexer
- name: Disable splunkweb
  hosts: all,!role_universal_forwarder,!role_universal_forwarder_windows
  become: true
  become_user: root

  tasks:
    - name: Call disable_splunkwebfrom role splunk_common
      ansible.builtin.include_role:
        name: splunk_software
        tasks_from: disable_splunkweb.yml
