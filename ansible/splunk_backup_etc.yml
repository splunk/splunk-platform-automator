---
# spa-run:
#   schema: 1
#   summary: Back up $SPLUNK_HOME/etc.
#   description: Copies Splunk etc configuration to the configured backup location.
#   category: operations
#   risk: mutating
#   requires_provisioned: true
#   examples:
#     - spa run splunk_backup_etc --hosts sh1
- name: Backup splunk config
  hosts:
    - role_cluster_manager
    - role_deployer
    - role_deployment_server
    - role_heavy_forwarder
    - role_indexer
    - role_license_manager
    - role_monitoring_console
    - role_search_head
    - role_universal_forwarder
  become: true
  become_user: root

  tasks:
    - name: Call backup_splunk_etc splunk from role splunk_software
      ansible.builtin.include_role:
        name: splunk_software
        tasks_from: backup_splunk_etc
