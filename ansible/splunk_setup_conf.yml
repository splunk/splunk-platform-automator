---
# spa-run:
#   schema: 1
#   summary: Apply Splunk conf settings (pipeline step).
#   description: Writes Splunk configuration as part of deploy_site. Prefer spa deploy for a full site.
#   category: deployment
#   risk: mutating
#   requires_provisioned: true
#   examples:
#     - spa run splunk_setup_conf
# This playbook add/updates splunk config file settings

- name: Run splunk_conf role
  hosts: all:!role_universal_forwarder_windows
  become: true
  become_user: root

  tasks:
    - name: Call splunk_conf role
      ansible.builtin.include_role:
        name: splunk_conf
      when:
        - splunk_conf is defined
        - splunk_conf is mapping
