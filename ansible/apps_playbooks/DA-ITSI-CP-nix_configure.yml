---
# spa-app:
#   schema: 1
#   name: DA-ITSI-CP-nix
#   kind: itsi_content_pack_single
#   hook: run_playbook_after_restart
#   summary: Wire Unix content pack services after API install
#
# Framework vars: app_path, app_name (from post-restart context)
# Prerequisites: Splunk_TA_nix
# Standalone: spa run splunk_apps_playbook_run --apps-playbook DA-ITSI-CP-nix_configure --hosts ROLE --yes


- name: "Get Service Content"
  ansible.builtin.uri:
    url: "https://localhost:8089/servicesNS/nobody/SA-ITOA/itoa_interface/service/{{ item | urlencode }}"
    user: admin
    password: "{{ splunk_admin_password }}"
    method: GET
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
  loop:
    - da-itsi-cp-nix-sample-unix-and-linux-server-health
  register: services_objects
  when: app_path is defined

- name: "Enable Services"
  ansible.builtin.uri:
    url: "https://localhost:8089/servicesNS/nobody/SA-ITOA/itoa_interface/service/{{ item.json._key | urlencode }}"
    user: admin
    password: "{{ splunk_admin_password }}"
    method: POST
    headers:
      Content-Type: application/json
    body: "{{ item.json | combine({'enabled': 1}) }}"
    body_format: json
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
  loop: "{{ services_objects.results | default([]) }}"
  loop_control:
    label: "{{ item.json._key | default(item.json.title | default('service')) }}"
  when:
    - app_path is defined
    - services_objects is defined
    - item.json is defined
