---
# spa-run:
#   schema: 1
#   summary: Call a Splunk REST endpoint on selected hosts.
#   description: Issues an authenticated REST request against splunkd on the targeted hosts.
#   category: operations
#   risk: mutating
#   requires:
#     - At least one host via --hosts
#   inputs:
#     - name: splunk_software_rest_endpoint
#       kind: extra-var
#       required: true
#       description: REST path under splunkd.
#     - name: splunk_software_rest_method
#       kind: extra-var
#       required: false
#       description: HTTP method (default GET).
#   examples:
#     - spa run splunk_rest --hosts idx1 -- -e "splunk_software_rest_endpoint=/services"

- name: Run Splunk command
  hosts:
    - role_cluster_manager
    - role_deployer
    - role_deployment_server
    - role_heavy_forwarder
    - role_indexer
    - role_license_manager
    - role_monitoring_console
    - role_search_head
    - role_universal_forwarder
  become: true
  become_user: root

  tasks:
    - name: Call splunk_rest from role splunk_software
      ansible.builtin.include_role:
        name: splunk_software
        tasks_from: splunk_rest
      vars:
        splunk_software_rest_output_show: true
        splunk_software_rest_output_mode: json
