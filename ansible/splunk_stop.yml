---
# spa-run:
#   schema: 1
#   summary: Stop splunkd on selected hosts.
#   description: Stops the Splunk service on the targeted inventory hosts.
#   category: operations
#   risk: mutating
#   requires_provisioned: true
#   examples:
#     - spa run splunk_stop --hosts idx1
- name: Stop splunk
  hosts:
    - role_cluster_manager
    - role_deployer
    - role_deployment_server
    - role_heavy_forwarder
    - role_indexer
    - role_license_manager
    - role_monitoring_console
    - role_search_head
    - role_universal_forwarder
  become: true
  become_user: root

  tasks:
    - name: Call stop splunk from role splunk_common
      ansible.builtin.include_role:
        name: splunk_software
        tasks_from: stop_splunk
