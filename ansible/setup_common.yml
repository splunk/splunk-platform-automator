---
# spa-run:
#   schema: 1
#   summary: Apply common OS settings (pipeline step).
#   description: Configures shared host settings as part of deploy_site.
#   category: deployment
#   risk: mutating
#   examples:
#     - spa run setup_common
# This playbook configures common settings

- name: Apply common configurations
  hosts: all:!role_universal_forwarder_windows
  become: true
  become_user: root
  roles:
    - common
