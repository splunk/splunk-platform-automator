---
# This playbook saves a copy of the serverclass.conf on the ansible host under
# $SPA_LAB_DIR/saved_base_config_apps (see spa_saved_baseconfig_apps_dir).

- name: Create hostname and system/local dir on ansible host
  tags:
    - splunk
    - splunk_baseconfig
    - deployment_server
    - serverclass
    - save_baseconfig
    - save_serverclass
  ansible.builtin.file:
    path: "{{ spa_saved_baseconfig_apps_dir }}/{{ inventory_hostname }}/{{ splunk_install_dir }}/splunk/etc/system/local/"
    state: directory
  become: false
  delegate_to: localhost

- name: Save serverclass file to ansible host
  tags:
    - splunk
    - splunk_baseconfig
    - deployment_server
    - serverclass
    - save_baseconfig
    - save_serverclass
  synchronize:
    src: "{{ splunk_install_dir }}/splunk/etc/system/local/serverclass.conf"
    dest: "{{ spa_saved_baseconfig_apps_dir }}/{{ splunk_deployment_server|first }}/{{ splunk_install_dir }}/splunk/etc/system/local/"
    rsync_path: "{{ become_method|default('sudo') }} -u {{splunk_user}} rsync"
    mode: pull
  become: false
