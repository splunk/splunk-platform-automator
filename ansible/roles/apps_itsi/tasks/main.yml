---
# ITSI premium pack: deploy one .spl/.tgz to cluster manager, license manager, and search heads
# Supports source: splunkbase (app_id 1841) or local. Index paths default to splunk_volume_defaults.
# Depends on splunk_common for splunk_home, splunk_user, splunk_service_name and "Restart splunk" handler.
# Optional: app_item.itsi_version, itsi_index_home_path, itsi_index_cold_path, itsi_notification_disable,
#           app_sh_name (single SH host), app_shc_name (SHC name for dedicated ITSI SHC)

- name: "Set app_path and restart flag so splunk_common 'Restart splunk' handler runs when notified"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    app_path: "{{ splunk_home }}/etc/apps"
    restart_splunk_direct_etc_apps: true

- name: "Set ITSI paths and archive source (local) or cache dir (splunkbase)"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    apps_itsi_splunk_home: "{{ splunk_home }}"
    apps_itsi_version_resolved: "{{ app_item.itsi_version | default(itsi_version) }}"
    apps_itsi_resolved_version: "{{ app_item.itsi_version | default(itsi_version) }}"
    # Default index volume from framework (baseconfig_app org_all_indexes / splunk_volume_defaults)
    apps_itsi_home_path: "{{ app_item.itsi_index_home_path | default('volume:' + (splunk_volume_defaults.homePath | default('primary'))) }}"
    apps_itsi_cold_path: "{{ app_item.itsi_index_cold_path | default('volume:' + (splunk_volume_defaults.coldPath | default('primary'))) }}"
    apps_itsi_notification_disable: "{{ app_item.itsi_notification_disable | default(itsi_notification_disable | default([])) }}"
    apps_itsi_cache_dir: "{{ splunk_app_deployment.temp_dir | default(splunk_app_deployment_defaults.temp_dir) }}/ITSI"
    apps_itsi_repo_path: "{{ splunk_app_deployment.local_app_repo_path | default(splunk_app_deployment_defaults.local_app_repo_path) }}"
    apps_itsi_default_filename: "splunk-it-service-intelligence_{{ (app_item.itsi_version | default(itsi_version)) | string | replace('.', '') }}.spl"

- name: "Set ITSI archive path for local source"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    apps_itsi_spl_path: "{{ _local_path }}"
  vars:
    _local_path: "{{ app_item.local_path | default(app_item.path if (app_item.path is defined and app_item.path is search('^/')) else (apps_itsi_repo_path + '/' + (app_item.path | default(apps_itsi_default_filename)))) }}"
  when: (app_item.source | default('local')) != 'splunkbase'

- name: "Set Splunkbase download vars and download ITSI from Splunkbase (common)"
  tags:
    - splunk
    - splunk_apps
    - itsi
  when: (app_item.source | default('local')) == 'splunkbase'
  block:
    - name: "Set Splunkbase download vars for ITSI"
      ansible.builtin.set_fact:
        splunkbase_app_id: "{{ app_item.app_id | default(itsi_splunkbase_app_id) | default(1841) }}"
        splunkbase_version: "{{ app_item.version | default('latest') }}"
        splunkbase_cache_dir: "{{ apps_itsi_cache_dir }}"
        splunkbase_dest_slug: "itsi"
        splunkbase_fail_msg_app_name: "ITSI"
    - name: "Download app from Splunkbase (common)"
      ansible.builtin.include_role:
        name: apps_common
        tasks_from: download_splunkbase_archive.yml
    - name: "Capture ITSI download path and version on localhost for propagation"
      ansible.builtin.set_fact:
        itsi_download_archive_path: "{{ splunkbase_archive_path }}"
        itsi_download_resolved_version: "{{ splunkbase_resolved_version }}"
      register: _itsi_download_result
      delegate_to: localhost
      run_once: true

- name: "Set ITSI resolved version and archive path from common download"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    apps_itsi_resolved_version: "{{ _resolved }}"
    apps_itsi_spl_path: "{{ _archive_path }}"
  vars:
    _resolved: "{{ splunkbase_resolved_version if (splunk_app_deployment.target_download | default(false)) else (((_itsi_download_result | default({})).ansible_facts | default({})).itsi_download_resolved_version | default('')) }}"
    _archive_path: "{{ splunkbase_archive_path if (splunk_app_deployment.target_download | default(false)) else (((_itsi_download_result | default({})).ansible_facts | default({})).itsi_download_archive_path | default('')) }}"
  when: (app_item.source | default('local')) == 'splunkbase'

# When source is local, verify archive exists (path already set above)
- name: "Check ITSI archive exists (local)"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.stat:
    path: "{{ apps_itsi_spl_path }}"
  register: apps_itsi_spl_file
  delegate_to: localhost
  become: false
  when: (app_item.source | default('local')) != 'splunkbase'

- name: "Fail if ITSI archive not found (local)"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.fail:
    msg: "ITSI archive not found: {{ apps_itsi_spl_path }}"
  when:
    - (app_item.source | default('local')) != 'splunkbase'
    - not apps_itsi_spl_file.stat.exists

- name: "Set app conf cache vars for ITSI"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    app_conf_archive_path: "{{ apps_itsi_spl_path }}"
    app_conf_cache_dir: "{{ apps_itsi_cache_dir }}"
    app_conf_cache_subdir: "itsi_app_confs"
    app_conf_resolved_version: "{{ apps_itsi_resolved_version }}"

# Restrict cache to LM/CM app list only when this host is not also deployer, search head, or standalone indexer.
# When LM/CM/deployer/SH/indexer share a host, we must build expected_versions for all apps so each role's version check has full data.
- name: "Set app conf apps needed for this host (target_download, LM/CM only, skip when also deployer, search head, or standalone indexer)"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    app_conf_app_names_needed: "{{ itsi_lm_apps if inventory_hostname in (groups['role_license_manager'] | default([])) else itsi_cm_apps }}"
  when:
    - splunk_app_deployment.target_download | default(false)
    - inventory_hostname in (groups['role_license_manager'] | default([])) or inventory_hostname in (groups['role_cluster_manager'] | default([]))
    - not (inventory_hostname in (groups['role_deployer'] | default([])))
    - not (inventory_hostname in (groups['role_search_head'] | default([])))
    - not (inventory_hostname in (groups['role_indexer'] | default([])) and ((group_names | select('match', '^idxcluster_') | list | length) == 0))

- name: "Ensure app conf cache and capture result for propagation (controller)"
  when: not (splunk_app_deployment.target_download | default(false))
  block:
    - name: "Ensure app conf cache and expected versions (common)"
      ansible.builtin.include_role:
        name: apps_common
        tasks_from: app_conf_cache.yml
    - name: "Capture app conf cache result on localhost for propagation"
      ansible.builtin.set_fact:
        itsi_app_conf_expected_versions: "{{ app_conf_expected_versions }}"
        itsi_app_conf_app_names: "{{ app_conf_app_names }}"
      register: _itsi_app_conf_result
      delegate_to: localhost
      run_once: true
  delegate_to: localhost
  run_once: true

- name: "Ensure app conf cache and expected versions (common, target_download)"
  ansible.builtin.include_role:
    name: apps_common
    tasks_from: app_conf_cache.yml
  when: splunk_app_deployment.target_download | default(false)

- name: "Set ITSI expected versions and app names from common cache"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    apps_itsi_expected_versions: "{{ _exp_versions }}"
    itsi_app_conf_app_names: "{{ _app_names }}"
  vars:
    _exp_versions: "{{ app_conf_expected_versions if (splunk_app_deployment.target_download | default(false)) else (((_itsi_app_conf_result | default({})).ansible_facts | default({})).itsi_app_conf_expected_versions | default({})) }}"
    _app_names: "{{ app_conf_app_names if (splunk_app_deployment.target_download | default(false)) else (((_itsi_app_conf_result | default({})).ansible_facts | default({})).itsi_app_conf_app_names | default([])) }}"

- name: "Run ITSI deployment for cluster manager (manager-apps)"
  ansible.builtin.include_tasks: itsi_install_indexer.yml
  vars:
    apps_itsi_indexer_apps_base: "etc/manager-apps"
    apps_itsi_indexer_notify: "{{ 'Apply indexer cluster bundle' if (group_names | select('match', '^idxcluster_') | list | length > 0) else 'Restart splunk' }}"
  when: inventory_hostname in (groups.role_cluster_manager | default([]))

- name: "Run ITSI deployment for standalone indexer (etc/apps)"
  ansible.builtin.include_tasks: itsi_install_indexer.yml
  vars:
    apps_itsi_indexer_apps_base: "etc/apps"
    apps_itsi_indexer_notify: "Restart splunk"
  when: >-
    inventory_hostname in (groups.role_indexer | default([]))
    and (group_names | select('match', '^idxcluster_') | list | length) == 0
    and not (inventory_hostname in (groups.role_search_head | default([])))

- name: "Run ITSI deployment for license manager"
  ansible.builtin.include_tasks: itsi_install_license_manager.yml
  when: >-
    inventory_hostname in (groups.role_license_manager | default([]))
    and not (inventory_hostname in (groups.role_search_head | default([])))

- name: "Run ITSI deployment for deployer (shcluster/apps)"
  ansible.builtin.include_tasks: itsi_install_search_head.yml
  vars:
    apps_itsi_sh_apps_base: "etc/shcluster/apps"
    apps_itsi_sh_notify: "{{ 'Push shcluster bundle' if (group_names | select('match', '^shcluster_') | list | length > 0) else 'Restart splunk' }}"
  when: inventory_hostname in (groups.role_deployer | default([]))

- name: "Run ITSI deployment for search head (etc/apps, all or filtered by app_sh_name / app_shc_name)"
  ansible.builtin.include_tasks: itsi_install_search_head.yml
  vars:
    apps_itsi_sh_apps_base: "etc/apps"
    apps_itsi_sh_notify: "Restart splunk"
  when: >-
    inventory_hostname in (groups.role_search_head | default([]))
    and (
      (app_item.app_sh_name is not defined and app_item.app_shc_name is not defined)
      or (app_item.app_sh_name is defined and inventory_hostname == app_item.app_sh_name)
      or (app_item.app_shc_name is defined and inventory_hostname in (groups['shcluster_' + app_item.app_shc_name] | default([])))
    )

# When Splunkbase and cache_downloads=false, remove archive and itsi_app_confs (used for version check and/or install).
# Run regardless of whether we actually installed, since we always download for version check.
- name: "Remove ITSI archive (controller, cache_downloads=false)"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.file:
    path: "{{ apps_itsi_spl_path }}"
    state: absent
  delegate_to: localhost
  run_once: true
  become: false
  when:
    - (app_item.source | default('local')) == 'splunkbase'
    - not (splunk_app_deployment.target_download | default(false))
    - not (splunk_app_deployment.cache_downloads | default(true))

- name: "Remove ITSI app conf cache version folder (controller, cache_downloads=false)"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.file:
    path: "{{ apps_itsi_cache_dir }}/itsi_app_confs/{{ apps_itsi_resolved_version }}"
    state: absent
  delegate_to: localhost
  run_once: true
  become: false
  when:
    - (app_item.source | default('local')) == 'splunkbase'
    - not (splunk_app_deployment.target_download | default(false))
    - not (splunk_app_deployment.cache_downloads | default(true))

- name: "Remove ITSI archive (target, cache_downloads=false)"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.file:
    path: "{{ apps_itsi_spl_path }}"
    state: absent
  when:
    - (app_item.source | default('local')) == 'splunkbase'
    - splunk_app_deployment.target_download | default(false)
    - not (splunk_app_deployment.cache_downloads | default(true))

- name: "Remove ITSI app conf cache version folder (target, cache_downloads=false)"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.file:
    path: "{{ apps_itsi_cache_dir }}/itsi_app_confs/{{ apps_itsi_resolved_version }}"
    state: absent
  when:
    - (app_item.source | default('local')) == 'splunkbase'
    - splunk_app_deployment.target_download | default(false)
    - not (splunk_app_deployment.cache_downloads | default(true))

# When included from apps_direct (process_direct_app), set update_needed so "Set app_path..." and "Notify Splunk restart" run.
- name: "Set update_needed for direct deployment handler notification"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    update_needed: "{{ apps_itsi_update_needed | default(false) }}"
  when: app_state | default('installed') == 'installed'
