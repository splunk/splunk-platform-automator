---
# Remove ITSI apps from deployer (shcluster/apps) or search head (etc/apps).
# Caller must set: apps_itsi_sh_remove_base (e.g. etc/shcluster/apps or etc/apps),
#   apps_itsi_sh_remove_notify ('Push shcluster bundle' or 'Restart splunk').
# Optional: apps_itsi_sh_remove_file_when (scope filter; default true). Caller applies filtered set so this is typically true.

- name: "Set app_path and restart flag for Restart splunk handler when removing from etc/apps"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    app_path: "{{ splunk_home }}/etc/apps"
    restart_splunk_direct_etc_apps: true
  when: apps_itsi_sh_remove_notify == 'Restart splunk'

- name: "Resolve archive and build ITSI app list for removal"
  ansible.builtin.include_tasks: itsi_remove_common.yml

- name: "Remove ITSI apps from {{ apps_itsi_sh_remove_base }}"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.file:
    path: "{{ splunk_home }}/{{ apps_itsi_sh_remove_base }}/{{ item }}"
    state: absent
  loop: "{{ itsi_sh_apps_from_archive }}"
  loop_control:
    label: "{{ item }}"
  notify: "{{ apps_itsi_sh_remove_notify }}"
  when: apps_itsi_sh_remove_file_when | default(true)
