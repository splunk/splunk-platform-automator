---
# Resolve on-disk app folder names from the ITSI .spl/.tgz archive (controller app conf cache).
# Expects: verify_app_item
# Sets: _itsi_archive_app_names

- name: "Set ITSI archive path for verify (local source)"
  tags:
    - splunk
    - splunk_apps
    - itsi
    - verify
  ansible.builtin.set_fact:
    _itsi_verify_archive_path: >-
      {{ verify_app_item.local_path
         | default(verify_app_item.path if (verify_app_item.path is defined and verify_app_item.path is search('^/'))
         else (_verify_local_app_repo_path | default(splunk_app_deployment.local_app_repo_path | default(playbook_dir + '/../../apps'))
         ~ '/' ~ (verify_app_item.path | default('splunk-it-service-intelligence_' ~ ((verify_app_item.version | default('latest')) | string | replace('.', '')) ~ '.spl')))) }}
    _itsi_verify_resolved_version: "{{ verify_app_item.version | default('latest') }}"
  when: (verify_app_item.source | default('local')) != 'splunkbase'

- name: "Resolve ITSI Splunkbase archive for verify"
  tags:
    - splunk
    - splunk_apps
    - itsi
    - verify
  when: (verify_app_item.source | default('local')) == 'splunkbase'
  block:
    - name: "Set Splunkbase vars for ITSI verify archive resolution"
      ansible.builtin.set_fact:
        splunkbase_app_id: "{{ verify_app_item.app_id | default(itsi_splunkbase_app_id) | default(1841) }}"
        splunkbase_version: "{{ verify_app_item.version | default('latest') }}"
        splunkbase_cache_dir: "{{ splunk_app_deployment.temp_dir | default(splunk_app_deployment_defaults.temp_dir) }}/ITSI"
        splunkbase_dest_slug: "itsi"
        splunkbase_fail_msg_app_name: "{{ verify_app_item.name }}"
        app_item: "{{ verify_app_item }}"

    - name: "Download ITSI archive for verify (common)"
      ansible.builtin.include_role:
        name: apps_common
        tasks_from: download_splunkbase_archive.yml

    - name: "Capture ITSI verify archive path and version on localhost for propagation"
      ansible.builtin.set_fact:
        _itsi_verify_archive_path: "{{ splunkbase_archive_path }}"
        _itsi_verify_resolved_version: "{{ splunkbase_resolved_version }}"
      register: _itsi_verify_download_result
      delegate_to: localhost
      run_once: true

- name: "Set ITSI verify archive path and version from common download"
  tags:
    - splunk
    - splunk_apps
    - itsi
    - verify
  ansible.builtin.set_fact:
    _itsi_verify_archive_path: "{{ _archive_path }}"
    _itsi_verify_resolved_version: "{{ _resolved }}"
  vars:
    _resolved: >-
      {{ splunkbase_resolved_version if (splunk_app_deployment.target_download | default(false))
      else (((_itsi_verify_download_result | default({})).ansible_facts | default({})).get('_itsi_verify_resolved_version', '')) }}
    _archive_path: >-
      {{ splunkbase_archive_path if (splunk_app_deployment.target_download | default(false))
      else (((_itsi_verify_download_result | default({})).ansible_facts | default({})).get('_itsi_verify_archive_path', '')) }}
  when: (verify_app_item.source | default('local')) == 'splunkbase'

- name: "Build ITSI app conf cache for verify"
  tags:
    - splunk
    - splunk_apps
    - itsi
    - verify
  ansible.builtin.set_fact:
    app_conf_archive_path: "{{ _itsi_verify_archive_path }}"
    app_conf_cache_dir: "{{ splunk_app_deployment.temp_dir | default(splunk_app_deployment_defaults.temp_dir) }}/ITSI"
    app_conf_cache_subdir: "itsi_app_confs"
    app_conf_resolved_version: "{{ _itsi_verify_resolved_version }}"
    app_item: "{{ verify_app_item }}"

- name: "Ensure ITSI app conf cache and capture archive app names (controller)"
  when: not (splunk_app_deployment.target_download | default(false))
  block:
    - name: "Ensure ITSI app conf cache for verify (common)"
      ansible.builtin.include_role:
        name: apps_common
        tasks_from: app_conf_cache.yml

    - name: "Capture ITSI archive app names for verify on localhost"
      ansible.builtin.set_fact:
        _itsi_archive_app_names: "{{ app_conf_app_names | default([]) }}"
      register: _itsi_verify_app_conf_result
      delegate_to: localhost
      run_once: true

- name: "Ensure ITSI app conf cache for verify (target_download)"
  ansible.builtin.include_role:
    name: apps_common
    tasks_from: app_conf_cache.yml
  when: splunk_app_deployment.target_download | default(false)

- name: "Set ITSI archive app names for verify (target_download)"
  tags:
    - splunk
    - splunk_apps
    - itsi
    - verify
  ansible.builtin.set_fact:
    _itsi_archive_app_names: "{{ app_conf_app_names | default([]) }}"
  when: splunk_app_deployment.target_download | default(false)

- name: "Propagate ITSI archive app names for verify (controller path)"
  tags:
    - splunk
    - splunk_apps
    - itsi
    - verify
  ansible.builtin.set_fact:
    _itsi_archive_app_names: >-
      {{ (((_itsi_verify_app_conf_result | default({})).ansible_facts | default({})).get('_itsi_archive_app_names', [])) }}
  when: not (splunk_app_deployment.target_download | default(false))
