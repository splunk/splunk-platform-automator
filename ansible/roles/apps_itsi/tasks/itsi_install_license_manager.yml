---
# Extract ITSI license/access apps to etc/apps on license manager
# Runs only on role_license_manager. Notifies "Restart splunk" so the license
# server loads SA-ITSI-Licensechecker, then flushes that handler before later
# content-pack API work. The Restart splunk handler when-clause requires
# restart_splunk_direct_etc_apps or app_path == splunk_home/etc/apps; set those
# immediately before flush so a later app's app_path cannot skip the restart.

- name: "Set ITSI version check apps and base for license manager"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    apps_itsi_version_check_apps: "{{ itsi_lm_apps }}"
    apps_itsi_version_check_base: "{{ apps_itsi_splunk_home }}/etc/apps"

- name: "Check existing ITSI version on license manager (all apps)"
  ansible.builtin.include_tasks: itsi_version_check.yml

- name: "Remove old ITSI license app directories before install (clean mode)"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.file:
    path: "{{ apps_itsi_splunk_home }}/etc/apps/{{ item }}"
    state: absent
  loop: "{{ itsi_lm_apps }}"
  become: true
  when:
    - apps_itsi_update_needed | default(true)
    - _app_update_mode | default('merge') == 'clean'

- name: "Build extra_opts for ITSI license apps unarchive"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    itsi_lm_extra_opts: "{{ ['--dereference'] + itsi_lm_apps }}"
  when: apps_itsi_update_needed | default(true)

- name: "Transfer and unarchive ITSI license apps to etc/apps"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.unarchive:
    src: "{{ apps_itsi_spl_path }}"
    dest: "{{ apps_itsi_splunk_home }}/etc/apps"
    remote_src: "{{ (splunk_app_deployment.target_download | default(false)) and (app_item.source | default('splunkbase')) == 'splunkbase' }}"
    owner: "{{ splunk_user | default('splunk') }}"
    group: "{{ splunk_group | default('splunk') }}"
    extra_opts: "{{ itsi_lm_extra_opts }}"
  notify: "Restart splunk"
  become: true
  become_user: "{{ splunk_user | default('splunk') }}"
  when: apps_itsi_update_needed | default(true)

- name: "Set app_path and restart flag so license manager Restart splunk handler runs"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    app_path: "{{ splunk_home }}/etc/apps"
    restart_splunk_direct_etc_apps: true
  when: apps_itsi_update_needed | default(true)

- name: "Flush handlers so license manager restarts after ITSI license apps"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.meta: flush_handlers
  when: apps_itsi_update_needed | default(true)

- name: "Wait for splunkd port after license manager restart"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.include_role:
    name: splunk_common
    tasks_from: wait_for_splunkd_port
  when: apps_itsi_update_needed | default(true)

- name: "Wait for splunkd full service after license manager restart"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.include_role:
    name: splunk_common
    tasks_from: wait_for_splunkd_full
  when: apps_itsi_update_needed | default(true)
