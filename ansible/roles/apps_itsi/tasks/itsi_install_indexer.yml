---
# Deploy ITSI indexer apps (itsi_cm_apps) to a given apps base path (cluster manager or standalone indexer).
# Caller must set before include: apps_itsi_indexer_apps_base (e.g. etc/manager-apps or etc/apps),
#   apps_itsi_indexer_notify (handler name: 'Apply indexer cluster bundle' or 'Restart splunk').

- name: "Set ITSI version check apps and base for indexer (CM or standalone)"
  tags:
    - splunk
    - splunk_apps
    - itsi
  ansible.builtin.set_fact:
    apps_itsi_version_check_apps: "{{ itsi_cm_apps }}"
    apps_itsi_version_check_base: "{{ apps_itsi_splunk_home }}/{{ apps_itsi_indexer_apps_base }}"

- name: "Check existing ITSI version on indexer"
  ansible.builtin.include_tasks: itsi_version_check.yml

- name: "Deploy and configure ITSI on indexer"
  when: apps_itsi_update_needed | default(true)
  block:
    - name: "Build extra_opts for ITSI indexer unarchive"
      tags:
        - splunk
        - splunk_apps
        - itsi
      ansible.builtin.set_fact:
        itsi_indexer_extra_opts: "{{ ['--dereference'] + itsi_cm_apps }}"

    - name: "Upload and unarchive ITSI indexer apps to {{ apps_itsi_indexer_apps_base }}"
      tags:
        - splunk
        - splunk_apps
        - itsi
      ansible.builtin.unarchive:
        src: "{{ apps_itsi_spl_path }}"
        dest: "{{ apps_itsi_splunk_home }}/{{ apps_itsi_indexer_apps_base }}"
        remote_src: "{{ splunk_app_deployment.target_download | default(false) }}"
        owner: "{{ splunk_user | default('splunk') }}"
        group: "{{ splunk_group | default('splunk') }}"
        extra_opts: "{{ itsi_indexer_extra_opts }}"
      notify: "{{ apps_itsi_indexer_notify }}"
      become: true
      become_user: "{{ splunk_user | default('splunk') }}"

    - name: "Create local directories for ITSI indexer apps"
      tags:
        - splunk
        - splunk_apps
        - itsi
      ansible.builtin.file:
        state: directory
        path: "{{ apps_itsi_splunk_home }}/{{ apps_itsi_indexer_apps_base }}/{{ item }}/local"
        owner: "{{ splunk_user | default('splunk') }}"
        group: "{{ splunk_group | default('splunk') }}"
      loop: "{{ itsi_cm_apps }}"

    - name: "Copy indexes.conf to local for ITSI indexer apps"
      tags:
        - splunk
        - splunk_apps
        - itsi
      ansible.builtin.copy:
        remote_src: true
        src: "{{ apps_itsi_splunk_home }}/{{ apps_itsi_indexer_apps_base }}/{{ item }}/default/indexes.conf"
        dest: "{{ apps_itsi_splunk_home }}/{{ apps_itsi_indexer_apps_base }}/{{ item }}/local/"
        owner: "{{ splunk_user | default('splunk') }}"
        group: "{{ splunk_group | default('splunk') }}"
      loop: "{{ itsi_cm_apps }}"
      notify: "{{ apps_itsi_indexer_notify }}"

    - name: "Set volume in homePath for ITSI indexes"
      tags:
        - splunk
        - splunk_apps
        - itsi
      ansible.builtin.replace:
        path: "{{ apps_itsi_splunk_home }}/{{ apps_itsi_indexer_apps_base }}/{{ item }}/local/indexes.conf"
        regexp: '^(homePath\s+=\s+)[^\/]+\/'
        replace: '\1{{ apps_itsi_home_path }}/'
      loop: "{{ itsi_cm_apps }}"
      notify: "{{ apps_itsi_indexer_notify }}"

    - name: "Set volume in coldPath for ITSI indexes"
      tags:
        - splunk
        - splunk_apps
        - itsi
      ansible.builtin.replace:
        path: "{{ apps_itsi_splunk_home }}/{{ apps_itsi_indexer_apps_base }}/{{ item }}/local/indexes.conf"
        regexp: '^(coldPath\s+=\s+)[^\/]+\/'
        replace: '\1{{ apps_itsi_cold_path }}/'
      loop: "{{ itsi_cm_apps }}"
      notify: "{{ apps_itsi_indexer_notify }}"
