---
# Remove spa_es_indexes from cluster manager or standalone indexer.
# Caller must set: apps_es_indexer_remove_base, apps_es_indexer_remove_notify.
# Removal never touches index data.

- name: "Set app_path and restart flag for Restart splunk handler when removing spa_es_indexes from etc/apps"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    app_path: "{{ splunk_home }}/etc/apps"
    restart_splunk_direct_etc_apps: true
  when: apps_es_indexer_remove_notify == 'Restart splunk'

- name: "Remove spa_es_indexes from {{ apps_es_indexer_remove_base }}"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.file:
    path: "{{ splunk_home }}/{{ apps_es_indexer_remove_base }}/{{ es_indexes_app }}"
    state: absent
  notify: "{{ apps_es_indexer_remove_notify }}"
