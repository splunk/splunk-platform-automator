---
# ES premium app: download/cache the .spl, then install via splunk install app + essinstall
# on search heads and the SHC deployer. Indexers get spa_es_indexes only (not bundled TA-*).
# Depends on splunk_common for splunk_home, splunk_user, splunk_service_name and handlers.
# Optional: app_item.version, es_index_home_path, es_index_cold_path, ssl_enablement,
#           hosts_whitelist / shc_whitelist for search head targeting.

- name: "Set app_path and restart flag so splunk_common 'Restart splunk' handler runs when notified"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    app_path: "{{ splunk_home }}/etc/apps"
    restart_splunk_direct_etc_apps: true

- name: "Set ES search head apps base (shared)"
  ansible.builtin.include_tasks: es_set_sh_apps_base.yml

- name: "Set ES paths and archive source (local) or cache dir (splunkbase)"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    apps_es_splunk_home: "{{ splunk_home }}"
    apps_es_version_resolved: "{{ app_item.version | default('latest') }}"
    apps_es_resolved_version: "{{ app_item.version | default('latest') }}"
    apps_es_home_path: "{{ app_item.es_index_home_path | default('volume:' + (splunk_volume_defaults.homePath | default('primary'))) }}"
    apps_es_cold_path: "{{ app_item.es_index_cold_path | default('volume:' + (splunk_volume_defaults.coldPath | default('primary'))) }}"
    apps_es_cache_dir: "{{ splunk_app_deployment.temp_dir | default(splunk_app_deployment_defaults.temp_dir) }}/ES"
    apps_es_repo_path: "{{ splunk_app_deployment.local_app_repo_path | default(splunk_app_deployment_defaults.local_app_repo_path) }}"
    apps_es_default_filename: "splunk-enterprise-security_{{ (app_item.version | default('latest')) | string | replace('.', '') }}.spl"

- name: "Set update_mode for ES"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    _app_update_mode: "{{ app_item.update_mode | default(splunk_app_deployment.update_mode | default(splunk_app_deployment_defaults.update_mode | default('merge'))) }}"

- name: "Set ES archive path for local source"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    apps_es_spl_path: "{{ _local_path }}"
  vars:
    _local_path: "{{ app_item.local_path | default(app_item.path if (app_item.path is defined and app_item.path is search('^/')) else (apps_es_repo_path + '/' + (app_item.path | default(apps_es_default_filename)))) }}"
  when: (app_item.source | default('splunkbase')) != 'splunkbase'

- name: "Set Splunkbase download vars and download ES from Splunkbase (common)"
  tags:
    - splunk
    - splunk_apps
    - es
  when: (app_item.source | default('splunkbase')) == 'splunkbase'
  block:
    - name: "Set Splunkbase download vars for ES"
      ansible.builtin.set_fact:
        splunkbase_app_id: "{{ app_item.app_id | default(es_splunkbase_app_id) | default(263) }}"
        splunkbase_version: "{{ app_item.version | default('latest') }}"
        splunkbase_cache_dir: "{{ apps_es_cache_dir }}"
        splunkbase_dest_slug: "es"
        splunkbase_fail_msg_app_name: "ES"
    - name: "Download app from Splunkbase (common)"
      ansible.builtin.include_role:
        name: apps_common
        tasks_from: download_splunkbase_archive.yml
    - name: "Capture ES download path and version on localhost for propagation"
      ansible.builtin.set_fact:
        es_download_archive_path: "{{ splunkbase_archive_path }}"
        es_download_resolved_version: "{{ splunkbase_resolved_version }}"
      register: _es_download_result
      delegate_to: localhost
      run_once: true

- name: "Set ES resolved version and archive path from common download"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    apps_es_resolved_version: "{{ _resolved }}"
    apps_es_spl_path: "{{ _archive_path }}"
  vars:
    _resolved: "{{ splunkbase_resolved_version if (splunk_app_deployment.target_download | default(false)) else (((_es_download_result | default({})).ansible_facts | default({})).es_download_resolved_version | default('')) }}"
    _archive_path: "{{ splunkbase_archive_path if (splunk_app_deployment.target_download | default(false)) else (((_es_download_result | default({})).ansible_facts | default({})).es_download_archive_path | default('')) }}"
  when: (app_item.source | default('splunkbase')) == 'splunkbase'

- name: "Check ES archive exists (local)"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.stat:
    path: "{{ apps_es_spl_path }}"
  register: apps_es_spl_file
  delegate_to: localhost
  become: false
  when: (app_item.source | default('splunkbase')) != 'splunkbase'

- name: "Fail if ES archive not found (local)"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.fail:
    msg: "ES archive not found: {{ apps_es_spl_path }}"
  when:
    - (app_item.source | default('splunkbase')) != 'splunkbase'
    - not apps_es_spl_file.stat.exists

- name: "Set app conf cache vars for ES"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    app_conf_archive_path: "{{ apps_es_spl_path }}"
    app_conf_cache_dir: "{{ apps_es_cache_dir }}"
    app_conf_cache_subdir: "es_app_confs"
    app_conf_resolved_version: "{{ apps_es_resolved_version }}"

- name: "Set skip app conf cache when target host needs only SPA-owned or no archive apps"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    _es_skip_app_conf_cache: >-
      {{
        (splunk_app_deployment.target_download | default(false))
        and (
          inventory_hostname in (groups['role_license_manager'] | default([]))
          or inventory_hostname in (groups['role_cluster_manager'] | default([]))
        )
        and not (inventory_hostname in (groups['role_deployer'] | default([])))
        and not (inventory_hostname in (groups['role_search_head'] | default([])))
        and not (
          inventory_hostname in (groups['role_indexer'] | default([]))
          and ((group_names | select('match', '^idxcluster_') | list | length) == 0)
        )
        and (
          inventory_hostname not in (groups['role_license_manager'] | default([]))
          or ((es_lm_apps | default([])) | length == 0)
        )
      }}

- name: "Set app conf apps needed for this host (target_download, LM/CM only, skip when also deployer, search head, or standalone indexer)"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    app_conf_app_names_needed: "{{ es_lm_apps }}"
  when:
    - not _es_skip_app_conf_cache
    - splunk_app_deployment.target_download | default(false)
    - inventory_hostname in (groups['role_license_manager'] | default([]))
    - (es_lm_apps | default([]) | length) > 0
    - not (inventory_hostname in (groups['role_deployer'] | default([])))
    - not (inventory_hostname in (groups['role_search_head'] | default([])))
    - not (inventory_hostname in (groups['role_indexer'] | default([])) and ((group_names | select('match', '^idxcluster_') | list | length) == 0))

- name: "Ensure app conf cache and capture result for propagation (controller)"
  when: not (splunk_app_deployment.target_download | default(false))
  block:
    - name: "Ensure app conf cache and expected versions (common)"
      ansible.builtin.include_role:
        name: apps_common
        tasks_from: app_conf_cache.yml
    - name: "Capture app conf cache result on localhost for propagation"
      ansible.builtin.set_fact:
        es_app_conf_expected_versions: "{{ app_conf_expected_versions }}"
        es_app_conf_app_names: "{{ app_conf_app_names }}"
      register: _es_app_conf_result
      delegate_to: localhost
      run_once: true
  delegate_to: localhost
  run_once: true

- name: "Ensure app conf cache and expected versions (common, target_download)"
  ansible.builtin.include_role:
    name: apps_common
    tasks_from: app_conf_cache.yml
  when:
    - splunk_app_deployment.target_download | default(false)
    - not _es_skip_app_conf_cache

- name: "Set ES expected versions and app names from common cache"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    apps_es_expected_versions: "{{ _exp_versions }}"
  vars:
    _exp_versions: "{{ app_conf_expected_versions if (splunk_app_deployment.target_download | default(false)) else (((_es_app_conf_result | default({})).ansible_facts | default({})).es_app_conf_expected_versions | default({})) }}"
  when: not _es_skip_app_conf_cache

- name: "Set empty ES expected versions when app conf cache skipped"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    apps_es_expected_versions: {}
  when: _es_skip_app_conf_cache

- name: "Set ES ssl_enablement from app key or Splunk Web SSL"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    apps_es_ssl_enablement_effective: "{{ _explicit if (_explicit | length > 0) else (_strict_or_ignore) }}"
  vars:
    _explicit: "{{ (app_item.ssl_enablement | default('') | string | trim | lower) }}"
    _strict_or_ignore: "{{ 'strict' if (splunk_ssl.web.enable | default(false) | bool) else 'ignore' }}"

- name: "Run ES deployment for cluster manager (manager-apps)"
  ansible.builtin.include_tasks: es_install_indexer.yml
  vars:
    apps_es_indexer_apps_base: "etc/manager-apps"
    apps_es_indexer_notify: "{{ 'Apply indexer cluster bundle' if (group_names | select('match', '^idxcluster_') | list | length > 0) else 'Restart splunk' }}"
  when: inventory_hostname in (groups.role_cluster_manager | default([]))

- name: "Run ES deployment for standalone indexer (etc/apps)"
  ansible.builtin.include_tasks: es_install_indexer.yml
  vars:
    apps_es_indexer_apps_base: "etc/apps"
    apps_es_indexer_notify: "Restart splunk"
  when: >-
    inventory_hostname in (groups.role_indexer | default([]))
    and (group_names | select('match', '^idxcluster_') | list | length) == 0
    and not (inventory_hostname in (groups.role_search_head | default([])))

- name: "Run ES deployment for license manager"
  ansible.builtin.include_tasks: es_install_license_manager.yml
  when: >-
    inventory_hostname in (groups.role_license_manager | default([]))
    and not (inventory_hostname in (groups.role_search_head | default([])))

- name: "Run ES deployment for deployer (shcluster/apps)"
  ansible.builtin.include_tasks: es_install_deployer.yml
  when: >-
    inventory_hostname in (groups.role_deployer | default([]))
    and not (apps_es_direct_install | default(false))

- name: "Run ES deployment for search head (etc/apps)"
  ansible.builtin.include_tasks: es_install_search_head.yml
  when: inventory_hostname in (groups.role_search_head | default([]))

- name: "Remove ES archive (controller, cache_downloads=false)"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.file:
    path: "{{ apps_es_spl_path }}"
    state: absent
  delegate_to: localhost
  run_once: true
  become: false
  when:
    - (app_item.source | default('splunkbase')) == 'splunkbase'
    - not (splunk_app_deployment.target_download | default(false))
    - not (splunk_app_deployment.cache_downloads | default(true))

- name: "Remove ES app conf cache version folder (controller, cache_downloads=false)"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.file:
    path: "{{ apps_es_cache_dir }}/es_app_confs/{{ apps_es_resolved_version }}"
    state: absent
  delegate_to: localhost
  run_once: true
  become: false
  when:
    - (app_item.source | default('splunkbase')) == 'splunkbase'
    - not (splunk_app_deployment.target_download | default(false))
    - not (splunk_app_deployment.cache_downloads | default(true))

- name: "Remove ES archive (target, cache_downloads=false)"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.file:
    path: "{{ apps_es_spl_path }}"
    state: absent
  when:
    - (app_item.source | default('splunkbase')) == 'splunkbase'
    - splunk_app_deployment.target_download | default(false)
    - not (splunk_app_deployment.cache_downloads | default(true))

- name: "Remove ES app conf cache version folder (target, cache_downloads=false)"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.file:
    path: "{{ apps_es_cache_dir }}/es_app_confs/{{ apps_es_resolved_version }}"
    state: absent
  when:
    - (app_item.source | default('splunkbase')) == 'splunkbase'
    - splunk_app_deployment.target_download | default(false)
    - not (splunk_app_deployment.cache_downloads | default(true))

- name: "Set update_needed for direct deployment handler notification"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    update_needed: "{{ apps_es_update_needed | default(false) }}"
  when: app_state | default('installed') == 'installed'
