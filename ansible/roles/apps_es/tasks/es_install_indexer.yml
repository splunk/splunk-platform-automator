---
# Write spa_es_indexes from indexes.conf in the bundle's SA-/DA- apps.
# Overlay volume paths. Do not unarchive bundled TA-* onto indexers.
# Caller must set: apps_es_indexer_apps_base (etc/manager-apps or etc/apps),
#   apps_es_indexer_notify ('Apply indexer cluster bundle' or 'Restart splunk').

- name: "Set ES version check apps and base for indexer (CM or standalone)"
  tags:
    - splunk
    - splunk_apps
    - es
  ansible.builtin.set_fact:
    apps_es_version_check_apps: "{{ [es_indexes_app] }}"
    apps_es_version_check_base: "{{ apps_es_splunk_home }}/{{ apps_es_indexer_apps_base }}"

- name: "Check existing ES indexes app version on indexer"
  ansible.builtin.include_tasks: es_version_check.yml

- name: "Build and install spa_es_indexes from SA-/DA- indexes.conf"
  when: apps_es_update_needed | default(true)
  block:
    - name: "Set app_path and restart flag when writing spa_es_indexes to etc/apps"
      tags:
        - splunk
        - splunk_apps
        - es
      ansible.builtin.set_fact:
        app_path: "{{ splunk_home }}/etc/apps"
        restart_splunk_direct_etc_apps: true
      when: apps_es_indexer_notify == 'Restart splunk'

    - name: "Set spa_es_indexes build dirs"
      tags:
        - splunk
        - splunk_apps
        - es
      ansible.builtin.set_fact:
        apps_es_indexes_work: "{{ apps_es_cache_dir }}/{{ es_indexes_app }}_{{ apps_es_resolved_version }}"

    - name: "Ensure spa_es_indexes work dir"
      tags:
        - splunk
        - splunk_apps
        - es
      ansible.builtin.file:
        path: "{{ apps_es_indexes_work }}/extracted"
        state: directory
        mode: "0755"
      delegate_to: "{{ omit if ((splunk_app_deployment.target_download | default(false)) and ((app_item.source | default('splunkbase')) == 'splunkbase')) else 'localhost' }}"
      run_once: "{{ not ((splunk_app_deployment.target_download | default(false)) and ((app_item.source | default('splunkbase')) == 'splunkbase')) }}"
      become: false

    - name: "List SA-/DA- indexes.conf paths in ES archive (skip TA-*)"
      tags:
        - splunk
        - splunk_apps
        - es
      ansible.builtin.shell:
        cmd: "tar tzf '{{ apps_es_spl_path }}' | grep -E '(^|/)(SA-|DA-)[^/]+/default/indexes\\.conf$' || true"
      register: _es_indexes_conf_list
      changed_when: false
      delegate_to: "{{ omit if ((splunk_app_deployment.target_download | default(false)) and ((app_item.source | default('splunkbase')) == 'splunkbase')) else 'localhost' }}"
      run_once: "{{ not ((splunk_app_deployment.target_download | default(false)) and ((app_item.source | default('splunkbase')) == 'splunkbase')) }}"
      become: false

    - name: "Fail if ES archive has no SA-/DA- indexes.conf"
      tags:
        - splunk
        - splunk_apps
        - es
      ansible.builtin.fail:
        msg: "ES archive has no SA-/DA- default/indexes.conf to build spa_es_indexes from: {{ apps_es_spl_path }}"
      when: (_es_indexes_conf_list.stdout_lines | default([]) | length) == 0

    - name: "Extract SA-/DA- indexes.conf from ES archive"
      tags:
        - splunk
        - splunk_apps
        - es
      ansible.builtin.shell:
        cmd: "tar -xzf '{{ apps_es_spl_path }}' -C '{{ apps_es_indexes_work }}/extracted' {{ _es_indexes_conf_list.stdout_lines | map('quote') | join(' ') }}"
      args:
        creates: "{{ apps_es_indexes_work }}/extracted/{{ (_es_indexes_conf_list.stdout_lines | default([None]) | first) }}"
      delegate_to: "{{ omit if ((splunk_app_deployment.target_download | default(false)) and ((app_item.source | default('splunkbase')) == 'splunkbase')) else 'localhost' }}"
      run_once: "{{ not ((splunk_app_deployment.target_download | default(false)) and ((app_item.source | default('splunkbase')) == 'splunkbase')) }}"
      become: false

    - name: "Merge SA-/DA- indexes.conf into spa_es_indexes and overlay volume paths"
      tags:
        - splunk
        - splunk_apps
        - es
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          dest="{{ apps_es_indexes_work }}/{{ es_indexes_app }}/default"
          mkdir -p "$dest"
          : > "$dest/indexes.conf"
          while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            echo "# from ${rel}" >> "$dest/indexes.conf"
            cat "{{ apps_es_indexes_work }}/extracted/${rel}" >> "$dest/indexes.conf"
            echo >> "$dest/indexes.conf"
          done <<'EOF'
          {{ _es_indexes_conf_list.stdout }}
          EOF
          python3 - <<'PY'
          from pathlib import Path
          path = Path("{{ apps_es_indexes_work }}/{{ es_indexes_app }}/default/indexes.conf")
          home = "{{ apps_es_home_path }}"
          cold = "{{ apps_es_cold_path }}"
          out = []
          for line in path.read_text(encoding="utf-8", errors="replace").splitlines(True):
              stripped = line.lstrip()
              if stripped.startswith("homePath") and "=" in stripped:
                  prefix, _, rest = line.partition("=")
                  rest = rest.lstrip()
                  slash = rest.find("/")
                  if slash >= 0:
                      line = prefix + "= " + home + rest[slash:]
                      if not line.endswith("\n"):
                          line += "\n"
              elif stripped.startswith("coldPath") and "=" in stripped:
                  prefix, _, rest = line.partition("=")
                  rest = rest.lstrip()
                  slash = rest.find("/")
                  if slash >= 0:
                      line = prefix + "= " + cold + rest[slash:]
                      if not line.endswith("\n"):
                          line += "\n"
              out.append(line)
          path.write_text("".join(out), encoding="utf-8")
          PY
          cat > "{{ apps_es_indexes_work }}/{{ es_indexes_app }}/default/app.conf" <<EOF
          [install]
          state = enabled

          [package]
          id = {{ es_indexes_app }}

          [launcher]
          version = {{ apps_es_resolved_version }}

          [ui]
          is_visible = 0
          label = SPA ES index definitions
          EOF
      delegate_to: "{{ omit if ((splunk_app_deployment.target_download | default(false)) and ((app_item.source | default('splunkbase')) == 'splunkbase')) else 'localhost' }}"
      run_once: "{{ not ((splunk_app_deployment.target_download | default(false)) and ((app_item.source | default('splunkbase')) == 'splunkbase')) }}"
      become: false

    - name: "Ensure spa_es_indexes dest dir on indexer"
      tags:
        - splunk
        - splunk_apps
        - es
      ansible.builtin.file:
        path: "{{ apps_es_splunk_home }}/{{ apps_es_indexer_apps_base }}/{{ es_indexes_app }}/default"
        state: directory
        owner: "{{ splunk_user | default('splunk') }}"
        group: "{{ splunk_group | default('splunk') }}"
        mode: "0755"
      become: true

    - name: "Install spa_es_indexes onto {{ apps_es_indexer_apps_base }}"
      tags:
        - splunk
        - splunk_apps
        - es
      ansible.builtin.copy:
        src: "{{ apps_es_indexes_work }}/{{ es_indexes_app }}/"
        dest: "{{ apps_es_splunk_home }}/{{ apps_es_indexer_apps_base }}/{{ es_indexes_app }}/"
        owner: "{{ splunk_user | default('splunk') }}"
        group: "{{ splunk_group | default('splunk') }}"
        remote_src: "{{ (splunk_app_deployment.target_download | default(false)) and ((app_item.source | default('splunkbase')) == 'splunkbase') }}"
      become: true
      notify: "{{ apps_es_indexer_notify }}"
