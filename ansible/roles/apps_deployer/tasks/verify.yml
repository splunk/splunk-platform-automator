---
# Verify Deployer Apps
# Checks if apps are deployed to shcluster/apps directory correctly

- name: Initialize verification results
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.set_fact:
    deployer_verification_results: []
    deployer_apps_expected: []
    deployer_apps_found: []
    deployer_mismatches: []
    _verify_allowed_fs_names: []
    _itsi_verify_allowed_fs_names: []
    _cp_verify_allowed_fs_names: []

- name: "Build list of ITSI app configs (for content pack same target as ITSI)"
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.set_fact:
    _itsi_apps_list: "{{ _itsi_apps_list | default([]) + [item] }}"
  loop: "{{ splunk_app_deployment.apps | default([]) }}"
  when: (item | default({})).get('premium_app', '') == 'itsi'
  loop_control:
    label: "{{ (item | default({})).get('name', '?') }}"

- name: Filter apps for deployer distribution
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.set_fact:
    deployer_apps_expected: "{{ deployer_apps_expected + [item] }}"
  loop: "{{ splunk_app_deployment.apps | default([]) }}"
  vars:
    _itsi_cp: "{{ (item | default({})).get('premium_app') == 'itsi' or (item | default({})).get('itsi_content_pack') | default(false) }}"
    _norm_roles: "{{ (item | default({})).get('itsi_content_pack') | default(false) | ternary(['search_head'], ['search_head', 'indexer', 'license_manager']) }}"
    _app_item: "{{ _itsi_cp | ternary((item | default({}) | combine({'target_roles': _norm_roles, 'deployment_target': 'auto'})), item) }}"
    _effective_hosts_whitelist: "{{ (item | default({})).get('itsi_content_pack') and ((_itsi_apps_list | default([]) | first | default({})).get('hosts_whitelist', []) | default([])) or ((item | default({})).get('hosts_whitelist', []) | default([])) }}"
    _effective_shc_w: "{{ (item | default({})).get('itsi_content_pack') and ((_itsi_apps_list | default([]) | first | default({})).get('shc_whitelist', []) | default([])) or ((item | default({})).get('shc_whitelist', []) | default([])) }}"
    _effective_shc_b: "{{ (item | default({})).get('itsi_content_pack') and ((_itsi_apps_list | default([]) | first | default({})).get('shc_blacklist', []) | default([])) or ((item | default({})).get('shc_blacklist', []) | default([])) }}"
    _shc_member_hosts: "{{ (groups['role_search_head'] | default([])) | intersect((groups | dict2items | selectattr('key', 'match', '^shcluster_') | map(attribute='value') | flatten) | list) | list }}"
    _shc_names: "{{ (groups | dict2items | selectattr('key', 'match', '^shcluster_') | map(attribute='key') | list) | map('regex_replace', '^shcluster_', '') | list }}"
    _shc_effectively_targeted: "{{ _effective_shc_w if (_effective_shc_w | length > 0) else (_shc_names | reject('in', _effective_shc_b) | list) }}"
    _this_deployer_shc_names: "{{ (group_names | select('match', '^shcluster_') | list) | map('regex_replace', '^shcluster_', '') | list }}"
    _eligible_for_deployer: >-
      {{
        (
          (_app_item | default({})).get('deployment_target', 'auto') != 'direct'
          and ((_app_item | default({})).get('target_roles', []) | intersect(['search_head']) | length > 0)
          and (
            (_effective_hosts_whitelist | default([]) | length == 0)
            or ((_effective_hosts_whitelist | default([])) | intersect(_shc_member_hosts) | length > 0)
          )
          and (
            not ((_effective_shc_w | length > 0) or (_effective_shc_b | length > 0))
            or (_shc_effectively_targeted | length > 0)
          )
          and ((_shc_effectively_targeted | intersect(_this_deployer_shc_names) | length) > 0)
        ) | bool
      }}
  when: _eligible_for_deployer | bool
  loop_control:
    label: "{{ (item | default({})).get('name', '?') }} — {{ 'eligible' if (_eligible_for_deployer | bool) else 'not eligible' }}"

- name: Normalize deployer_apps_expected for verify filters (optional keys)
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.set_fact:
    deployer_apps_expected_norm: "{{ deployer_apps_expected_norm | default([]) + [{'premium_app': '', 'itsi_content_pack': false} | combine(item)] }}"
  loop: "{{ deployer_apps_expected }}"
  loop_control:
    label: "{{ item.name | default('?') }}"
  when: deployer_apps_expected | length > 0

- name: Apply normalized deployer_apps_expected for verify
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.set_fact:
    deployer_apps_expected: "{{ deployer_apps_expected_norm | default([]) }}"
  when: deployer_apps_expected | length > 0

- name: Check shcluster/apps directory exists
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.stat:
    path: "{{ splunk_home }}/etc/shcluster/apps"
  register: shcluster_apps_dir
  become: true

- name: List actual apps in shcluster/apps
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.find:
    paths: "{{ splunk_home }}/etc/shcluster/apps"
    file_type: directory
    recurse: no
  register: actual_apps
  when: shcluster_apps_dir.stat.exists
  become: true

- name: Extract app names from filesystem
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.set_fact:
    deployer_apps_found: "{{ actual_apps.files | map(attribute='path') | map('basename') | list }}"
  when: shcluster_apps_dir.stat.exists and actual_apps.files is defined

- name: Verify each expected standard app
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.include_tasks: verify_single_app.yml
  loop: >-
    {{
      deployer_apps_expected
      | rejectattr('premium_app', 'equalto', 'itsi')
      | rejectattr('itsi_content_pack', 'equalto', true)
      | list
    }}
  loop_control:
    loop_var: verify_app_item
    label: "{{ verify_app_item.name }}"
  vars:
    verify_base_path: "{{ splunk_home }}/etc/shcluster/apps"
    verify_app_full_path: "{{ verify_app_item.target_path | default(verify_base_path ~ '/' ~ verify_app_item.name) }}"

- name: Verify each expected ITSI premium app
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.include_role:
    name: apps_itsi
    tasks_from: verify_premium_app.yml
  loop: "{{ deployer_apps_expected | selectattr('premium_app', 'equalto', 'itsi') | list }}"
  loop_control:
    loop_var: verify_app_item
    label: "{{ verify_app_item.name }}"
  vars:
    verify_base_path: "{{ splunk_home }}/etc/shcluster/apps"
    verify_mismatches_var: deployer_mismatches

- name: Verify each expected ITSI content pack
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.include_role:
    name: apps_itsi_content_pack
    tasks_from: verify_app_dirs.yml
  loop: >-
    {{
      deployer_apps_expected
      | selectattr('itsi_content_pack', 'defined')
      | selectattr('itsi_content_pack')
      | list
    }}
  loop_control:
    loop_var: verify_app_item
    label: "{{ verify_app_item.name }}"
  vars:
    verify_base_path: "{{ splunk_home }}/etc/shcluster/apps"
    verify_mismatches_var: deployer_mismatches

- name: Add standard deployer app names to allowed verify list
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.set_fact:
    _verify_allowed_fs_names: >-
      {{ (_verify_allowed_fs_names | default([]) + (deployer_apps_expected
         | rejectattr('premium_app', 'equalto', 'itsi')
         | rejectattr('itsi_content_pack', 'equalto', true)
         | map(attribute='name') | list)) | unique | list }}

- name: Add ITSI/content pack on-disk dirs to allowed verify list
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.set_fact:
    _verify_allowed_fs_names: >-
      {{ (_verify_allowed_fs_names | default([]) + (_itsi_verify_allowed_fs_names | default([])) + (_cp_verify_allowed_fs_names | default([]))) | unique | list }}
  when: deployer_apps_expected | length > 0

- name: Check for unexpected apps
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.set_fact:
    deployer_mismatches: "{{ deployer_mismatches + [{'app': item, 'issue': 'UNEXPECTED: App exists but not in config', 'severity': 'warning'}] }}"
  loop: "{{ deployer_apps_found }}"
  when:
    - deployer_apps_found | length > 0
    - item not in (_verify_allowed_fs_names | default([]))
    - not (item is match('^_.*'))
    - not (item is match('^' + splunk_app_prefix + '_.*'))

- name: Build issues list for display
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.set_fact:
    deployer_issues_display: "{{ deployer_issues_display | default([]) + ['  - ' + item.app + ': ' + item.issue] }}"
  loop: "{{ deployer_mismatches }}"
  when: deployer_mismatches | length > 0

- name: Display verification results
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.debug:
    msg: "{{ ['=========================================', 'DEPLOYER VERIFICATION: ' + inventory_hostname, '=========================================', 'Expected apps: ' + (deployer_apps_expected | map(attribute='name') | list | join(', ') if deployer_apps_expected | length > 0 else '(none)'), 'Found apps: ' + (deployer_apps_found | join(', ') if deployer_apps_found | length > 0 else '(none)'), 'Mismatches: ' + (deployer_mismatches | length | string)] + (['Issues found:'] + deployer_issues_display if deployer_mismatches | length > 0 else ['  ✓ All apps deployed correctly']) + ['========================================='] }}"

- name: Fail if mismatches found and fail_on_mismatch is true
  tags:
    - splunk
    - splunk_apps
    - deployer
    - verify
  ansible.builtin.fail:
    msg: "Deployer app verification failed: {{ deployer_mismatches | length }} mismatch(es) found"
  when:
    - fail_on_mismatch | default(false) | bool
    - deployer_mismatches | length > 0
