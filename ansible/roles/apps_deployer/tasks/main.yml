---
# Deployer Apps - Runs on deployer hosts
# Calculates and deploys apps that should be distributed via deployer
# Note: apps_common dependency handles config merging

- name: Initialize deployer apps list
  tags:
    - splunk
    - splunk_apps
    - deployer
  ansible.builtin.set_fact:
    deployer_apps: []

# Content packs inherit filter vars from ITSI in process_deployer_app; we need the ITSI app config(s) for that.
- name: "Build list of ITSI app configs (for content pack same target as ITSI)"
  tags:
    - splunk
    - splunk_apps
    - deployer
  ansible.builtin.set_fact:
    _itsi_apps_list: "{{ _itsi_apps_list | default([]) + [item] }}"
  loop: "{{ splunk_app_deployment.apps | default([]) }}"
  when: (item | default({})).get('premium_app', '') == 'itsi'
  loop_control:
    label: "{{ (item | default({})).get('name', '?') }}"

# ITSI and content packs normalized: ITSI target_roles [search_head, indexer, license_manager], content packs target_roles [search_head]; both deployment_target auto. Same add rule as normal apps. Scope is decided in process_deployer_app via shared filter (hosts_whitelist etc.).
# Do not add ITSI/CP to deployer when app targets only standalone SH (e.g. hosts_whitelist: ['sh']) so install goes via direct to single sh, not to SHC.
- name: Filter apps for deployer distribution
  tags:
    - splunk
    - splunk_apps
    - deployer
  ansible.builtin.set_fact:
    deployer_apps: "{{ deployer_apps + [item] }}"
  loop: "{{ splunk_app_deployment.apps | default([]) }}"
  vars:
    _itsi_cp: "{{ (item | default({})).get('premium_app') == 'itsi' or (item | default({})).get('itsi_content_pack') | default(false) }}"
    _norm_roles: "{{ (item | default({})).get('itsi_content_pack') | default(false) | ternary(['search_head'], ['search_head', 'indexer', 'license_manager']) }}"
    _app_item: "{{ _itsi_cp | ternary((item | default({}) | combine({'target_roles': _norm_roles, 'deployment_target': 'auto'})), item) }}"
    _shc_member_hosts: "{{ (groups['role_search_head'] | default([])) | intersect((groups | dict2items | selectattr('key', 'match', '^shcluster_') | map(attribute='value') | flatten) | list) | list }}"
  when:
    - (_app_item | default({})).get('deployment_target', 'auto') != 'direct'
    - (_app_item | default({})).get('target_roles', []) | intersect(['search_head']) | length > 0
    # ITSI/CP: only add when app targets at least one SHC member (no hosts_whitelist, or whitelist includes an SHC member)
    - (not _itsi_cp) or ((item | default({})).get('hosts_whitelist', []) | default([]) | length == 0) or (((item | default({})).get('hosts_whitelist', []) | default([])) | intersect(_shc_member_hosts) | length > 0)

- name: Set first SHC member for post-restart playbooks (shared, from apps_common)
  ansible.builtin.include_role:
    name: apps_common
    tasks_from: set_shc_first_member.yml
  when: deployer_apps | length > 0

- name: Debug deployer apps
  tags:
    - splunk
    - splunk_apps
    - deployer
  ansible.builtin.debug:
    msg:
      - "========================================="
      - "DEPLOYER: {{ inventory_hostname }}"
      - "========================================="
      - "Total apps for deployer distribution: {{ deployer_apps | length }}"
      - "Apps: {{ deployer_apps | map(attribute='name') | list | join(', ') if deployer_apps | length > 0 else '(none)' }}"
      - "========================================="
    verbosity: 0

# Ensure ITSI is installed before content packs; remove content packs before ITSI.
# Build install/absent lists via loop so items without 'state' key use .get('state','installed').
- name: "Build deployer install list (state != absent)"
  tags:
    - splunk
    - splunk_apps
    - deployer
  ansible.builtin.set_fact:
    _dep_inst: "{{ _dep_inst | default([]) + [item] }}"
  loop: "{{ deployer_apps }}"
  when:
    - deployer_apps | length > 0
    - (item | default({})).get('state', 'installed') != 'absent'
  loop_control:
    label: "{{ (item | default({})).get('name', '?') }}"

- name: "Build deployer absent list (state == absent)"
  tags:
    - splunk
    - splunk_apps
    - deployer
  ansible.builtin.set_fact:
    _dep_abs: "{{ _dep_abs | default([]) + [item] }}"
  loop: "{{ deployer_apps }}"
  when:
    - deployer_apps | length > 0
    - (item | default({})).get('state', 'installed') == 'absent'
  loop_control:
    label: "{{ (item | default({})).get('name', '?') }}"

# Normalize lists so every item has premium_app and itsi_content_pack (selectattr/rejectattr fail on missing keys).
- name: "Normalize deployer install list for sort"
  tags:
    - splunk
    - splunk_apps
    - deployer
  ansible.builtin.set_fact:
    _dep_inst_n: "{{ _dep_inst_n | default([]) + [{'premium_app': '', 'itsi_content_pack': false} | combine(item)] }}"
  loop: "{{ _dep_inst | default([]) }}"
  when: deployer_apps | length > 0

- name: "Normalize deployer absent list for sort"
  tags:
    - splunk
    - splunk_apps
    - deployer
  ansible.builtin.set_fact:
    _dep_abs_n: "{{ _dep_abs_n | default([]) + [{'premium_app': '', 'itsi_content_pack': false} | combine(item)] }}"
  loop: "{{ _dep_abs | default([]) }}"
  when: deployer_apps | length > 0

# Inline sort using normalized lists so _dep_inst_n/_dep_abs_n have default keys and selectattr does not fail.
- name: "Sort deployer apps (install: ITSI then CP then rest; remove: CP then ITSI then rest)"
  tags:
    - splunk
    - splunk_apps
    - deployer
  ansible.builtin.set_fact:
    deployer_apps: >-
      {{ (_dep_inst_n | default([]) | selectattr('premium_app', 'equalto', 'itsi') | list)
      + (_dep_inst_n | default([]) | rejectattr('premium_app', 'equalto', 'itsi') | selectattr('itsi_content_pack') | list)
      + (_dep_inst_n | default([]) | rejectattr('premium_app', 'equalto', 'itsi') | rejectattr('itsi_content_pack') | list)
      + (_dep_abs_n | default([]) | selectattr('itsi_content_pack') | list)
      + (_dep_abs_n | default([]) | selectattr('premium_app', 'equalto', 'itsi') | list)
      + (_dep_abs_n | default([]) | rejectattr('premium_app', 'equalto', 'itsi') | rejectattr('itsi_content_pack') | list) }}
  when: deployer_apps | length > 0

- name: Process deployer apps
  tags:
    - splunk
    - splunk_apps
    - deployer
  block:
    - name: Process each deployer app
      ansible.builtin.include_tasks: "process_deployer_app.yml"
      loop: "{{ deployer_apps }}"
      loop_control:
        loop_var: _loop_app_item
        label: "{{ _loop_app_item.name }}"
  when: deployer_apps | length > 0

- name: Deployer apps complete
  tags:
    - splunk
    - splunk_apps
    - deployer
  ansible.builtin.debug:
    msg: "Deployer app processing complete on {{ inventory_hostname }}"
