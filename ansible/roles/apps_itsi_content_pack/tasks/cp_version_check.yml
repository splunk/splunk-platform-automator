---
# Compare content pack app versions on target to expected versions from app conf cache.
# Expects: cp_version_check_apps (list), cp_version_check_base (path), cp_expected_versions (dict from cache).

- name: "Filter expected versions to apps needed for content pack"
  tags:
    - splunk
    - splunk_apps
    - itsi_content_pack
  ansible.builtin.set_fact:
    cp_expected_versions_filtered: "{{ dict(cp_version_check_apps | zip(cp_version_check_apps | map('extract', cp_expected_versions | default({})) | map('default', '') | list)) }}"

- name: "Get version from [launcher] or [id] or first version= in target app.conf (content pack)"
  tags:
    - splunk
    - splunk_apps
    - itsi_content_pack
  ansible.builtin.shell:
    cmd: |
      f="{{ cp_version_check_base }}/{{ item }}/default/app.conf"
      v=$(sed -n '/\[launcher\]/,/^\[/p' "$f" 2>/dev/null | grep -E '^\s*version\s*=' | head -1 | sed -E 's/^[^=]*=\s*//')
      if [ -z "$v" ]; then
        v=$(sed -n '/\[id\]/,/^\[/p' "$f" 2>/dev/null | grep -E '^\s*version\s*=' | head -1 | sed -E 's/^[^=]*=\s*//')
      fi
      if [ -z "$v" ]; then
        v=$(grep -E '^\s*version\s*=' "$f" 2>/dev/null | head -1 | sed -E 's/^[^=]*=\s*//')
      fi
      printf '%s' "$v"
  loop: "{{ cp_version_check_apps }}"
  register: cp_version_check_versions
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ splunk_user | default('splunk') }}"

- name: "Build current content pack versions dict"
  tags:
    - splunk
    - splunk_apps
    - itsi_content_pack
  ansible.builtin.set_fact:
    cp_current_versions: "{{ cp_current_versions | default({}) | combine({ item.item: (item.stdout | default('') | trim) }) }}"
  loop: "{{ cp_version_check_versions.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}: {{ item.stdout | default('') | trim }}"
  when:
    - not (item.failed | default(false))
    - item.stdout is defined
    - (item.stdout | default('') | trim) != ''

- name: "Set cp_current_versions when no apps installed"
  tags:
    - splunk
    - splunk_apps
    - itsi_content_pack
  ansible.builtin.set_fact:
    cp_current_versions: {}
  when: (cp_version_check_versions.results | default([]) | selectattr('stdout', 'defined') | map(attribute='stdout') | map('trim') | select | list | length) == 0

- name: "Determine if content pack update needed (any app missing or version differs)"
  tags:
    - splunk
    - splunk_apps
    - itsi_content_pack
  ansible.builtin.set_fact:
    cp_update_needed: "{{ _no_expected or _current_ne_expected }}"
  vars:
    _exp: "{{ cp_expected_versions_filtered | default({}) }}"
    _cur: "{{ cp_current_versions | default({}) }}"
    _apps: "{{ cp_version_check_apps }}"
    _no_expected: "{{ _exp | length == 0 }}"
    _cur_list: "{{ _apps | map('extract', _cur) | map('default', '__missing__') | list }}"
    _exp_list: "{{ _apps | map('extract', _exp) | map('default', '') | list }}"
    _current_ne_expected: "{{ _cur_list != _exp_list }}"

- name: "Build content pack version status lines"
  tags:
    - splunk
    - splunk_apps
    - itsi_content_pack
  ansible.builtin.set_fact:
    _cp_status_lines: "{{ (_cp_status_lines | default(['Apps:'])) + ['- ' ~ item ~ \", Current: '\" ~ (cp_current_versions | default({})).get(item, '') ~ \"', Expected: '\" ~ (cp_expected_versions_filtered | default({})).get(item, '') ~ \"'.\"] }}"
  loop: "{{ cp_version_check_apps | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: (cp_version_check_apps | default([]) | length) > 0

- name: "Content pack version status"
  tags:
    - splunk
    - splunk_apps
    - itsi_content_pack
  ansible.builtin.debug:
    msg: "{{ (_cp_status_lines | default(['Apps:'])) + ['Update needed: ' ~ (cp_update_needed | string)] }}"

- name: "Fail if any content pack app name not found in archive"
  tags:
    - splunk
    - splunk_apps
    - itsi_content_pack
  ansible.builtin.fail:
    msg: >-
      Content pack app(s) not found in archive (wrong name in content_pack_apps config):
      {{ _cp_unknown_apps | join(', ') }}.
      Available apps in archive: {{ (cp_expected_versions | default({})).keys() | sort | join(', ') }}
  vars:
    _cp_unknown_apps: "{{ cp_version_check_apps | default([]) | reject('in', (cp_expected_versions | default({})).keys()) | list }}"
  when:
    - (cp_expected_versions | default({})) | length > 0
    - (_cp_unknown_apps | length) > 0
