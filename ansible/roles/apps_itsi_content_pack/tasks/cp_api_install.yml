---
# Post-restart task: install content pack via ITSI API.
# Included from deploy_splunk_apps.yml Step 5 when content_pack_install is true.
# Expects: app_name, customization_extra_vars (version, install_all, saved_search_action, backfill, resolution).
# Only runs POST install when the content pack is not already installed (GET check).
# When running on an SHC member, wait for SHC to be in good shape (service_ready_flag=1 and rolling_restart_flag=0) before calling the API.

- name: "Wait for SHC service_ready_flag and rolling_restart_flag before content pack API (post-restart on SHC member)"
  when: group_names | select('match', '^shcluster_') | list | length > 0
  block:
    - name: "Poll SHC status until service_ready_flag=1 and rolling_restart_flag=0 (post-restart)"
      ansible.builtin.uri:
        url: "https://{{ ansible_host | default(inventory_hostname) }}:8089/services/shcluster/status?output_mode=json"
        user: admin
        password: "{{ splunk_admin_password }}"
        method: GET
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: cp_api_shc_status
      until: >-
        ((cp_api_shc_status.json | default({}) | json_query('entry[0].content.captain.service_ready_flag') | default(false)) | bool)
        and ((cp_api_shc_status.json | default({}) | json_query('entry[0].content.captain.rolling_restart_flag') | default(1)) == 0)
      retries: 30
      delay: 10
      ignore_errors: true

    - name: "Fail if SHC not ready before content pack API (post-restart)"
      ansible.builtin.fail:
        msg: "Search Head Cluster did not become ready (service_ready_flag=1 and rolling_restart_flag=0) before content pack API."
      when: >-
        not (((cp_api_shc_status.json | default({}) | json_query('entry[0].content.captain.service_ready_flag') | default(false)) | bool)
        and ((cp_api_shc_status.json | default({}) | json_query('entry[0].content.captain.rolling_restart_flag') | default(1)) == 0))

- name: "Check if content pack already installed"
  ansible.builtin.uri:
    url: "https://{{ ansible_host | default(inventory_hostname) }}:8089/servicesNS/nobody/SA-ITOA/itoa_interface/content_pack/{{ app_name }}/{{ customization_extra_vars.version | default('1.0') }}"
    user: admin
    password: "{{ splunk_admin_password }}"
    method: GET
    force_basic_auth: true
    validate_certs: false
  register: cp_status
  failed_when: false
  changed_when: false

- name: "Install content pack via ITSI API (POST) (post-restart)"
  ansible.builtin.uri:
    url: "https://{{ ansible_host | default(inventory_hostname) }}:8089/servicesNS/nobody/SA-ITOA/itoa_interface/content_pack/{{ app_name }}/{{ customization_extra_vars.version | default('1.0') }}/install"
    user: admin
    password: "{{ splunk_admin_password }}"
    method: POST
    force_basic_auth: true
    validate_certs: false
    headers:
      Content-Type: application/json
    body_format: json
    body:
      content: {}
      install_all: "{{ customization_extra_vars.install_all | default(true) }}"
      saved_search_action: "{{ customization_extra_vars.saved_search_action | default('disable') }}"
      backfill: "{{ customization_extra_vars.backfill | default(false) }}"
      resolution: "{{ customization_extra_vars.resolution | default('overwrite') }}"
  when: >-
    cp_status is failed or
    ((cp_status.json | default({})).installed_versions | default([]) | first | default('')) != (customization_extra_vars.version | default('1.0'))
  changed_when: true
