---
# Remove ITSI content pack: remove app dirs from etc/apps or etc/shcluster/apps, notify restart/push.
# Top-level name is the on-disk library folder (multi-app) or pack folder (single-app).
# Expects app_item, app_state == 'absent'.

- name: "Set ITSI content pack removal vars from app_item"
  tags:
    - splunk
    - splunk_apps
    - itsi_content_pack
  ansible.builtin.set_fact:
    cp_splunk_home: "{{ splunk_home }}"
    cp_apps_base: "{{ apps_itsi_sh_apps_base }}"
    cp_notify: "{{ apps_itsi_sh_notify }}"
    cp_unarchive_here: "{{ (apps_itsi_sh_apps_base == 'etc/shcluster/apps') or (inventory_hostname in (groups['role_search_head'] | default([])) and ((group_names | select('match', '^shcluster_') | list | length) == 0)) }}"
    cp_content_pack_apps: "{{ app_item.content_pack_apps | default([]) }}"
    cp_install_all_apps: "{{ app_item.install_all_apps | default(false) | bool }}"
    cp_single_app_mode: "{{ not (app_item.install_all_apps | default(false) | bool) and ((app_item.content_pack_apps | default([]) | length) == 0) }}"

- name: "Build content pack remove list (name + content_pack_apps names)"
  tags:
    - splunk
    - splunk_apps
    - itsi_content_pack
  ansible.builtin.set_fact:
    cp_remove_list: "{{ _cp_remove_names | unique | list }}"
  vars:
    _cp_remove_names: "{{ [app_item.name] if cp_single_app_mode else ([app_item.name] + (cp_content_pack_apps | map(attribute='name') | list)) }}"
  when: not cp_install_all_apps

- name: "Resolve archive and build content pack app list for removal"
  ansible.builtin.include_tasks: cp_remove_common.yml
  when: cp_install_all_apps

- name: "Set app_path and restart flag for content pack removal"
  tags:
    - splunk
    - splunk_apps
    - itsi_content_pack
  ansible.builtin.set_fact:
    app_path: "{{ cp_splunk_home }}/etc/apps"
    restart_splunk_direct_etc_apps: true
  when: cp_notify == 'Restart splunk'

- name: "Remove content pack app dirs from {{ cp_apps_base }}"
  tags:
    - splunk
    - splunk_apps
    - itsi_content_pack
  ansible.builtin.file:
    path: "{{ cp_splunk_home }}/{{ cp_apps_base }}/{{ item }}"
    state: absent
  loop: "{{ cp_remove_list | default([]) }}"
  loop_control:
    label: "{{ item }}"
  notify: "{{ cp_notify }}"
  when:
    - cp_unarchive_here
    - (cp_remove_list | default([]) | length) > 0
