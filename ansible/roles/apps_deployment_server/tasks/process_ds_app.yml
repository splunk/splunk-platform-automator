---
# Process a single deployment server app
#
# Serverclass whitelist/blacklist:
# - If sc_whitelist (sc_* lists) is defined: use sc_whitelist and sc_blacklist directly for
#   serverclass; no whitelist calculation is done (sc_* overwrites calculation).
# - If sc_whitelist is not defined: compute serverclass whitelist from target_roles and
#   hosts_*/idxc_*/shc_* filters (only for deployment server clients). sc_blacklist can still be set.
# - hosts_whitelist/hosts_blacklist (and idxc_*, shc_*) are used only to calculate the whitelist
#   when sc_whitelist is not set; they apply to DS clients only.

- name: "Set defaults for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    app_state: "{{ app_item.state | default('installed') }}"
    app_version: "{{ app_item.version | default('latest') }}"
    serverclass_name: "{{ app_item.serverclass | default('app_' + app_item.name) }}"

# --- Base set for DS: target_roles minus idxcluster/shcluster (DS clients only). Only when sc_* not used. ---
- name: "Compute base whitelist for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _app_ds_base: >-
      {{
        app_item.target_roles | default([])
        | map('regex_replace', '^(.*)$', 'role_\1')
        | map('extract', groups)
        | flatten
        | reject('in', (groups | select('match', '^idxcluster_') | list | map('extract', groups) | flatten | list))
        | reject('in', (groups | select('match', '^shcluster_') | list | map('extract', groups) | flatten | list))
        | unique
        | list
      }}
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined

# --- Apply idxc/shc/hosts filters to computed set (only when sc_whitelist not defined; DS clients only). ---
- name: "Initialize filtered set for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _app_ds_filtered: "{{ _app_ds_base | default([]) }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined

# Build union of IDXC members for whitelist filter
- name: "Build IDXC whitelist union for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _idxc_whitelist_union: "{{ _idxc_whitelist_union | default([]) + (groups['idxcluster_' ~ item] | default([])) }}"
  loop: "{{ app_item.idxc_whitelist | default([]) }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined
    - app_item.idxc_whitelist is defined
    - app_item.idxc_whitelist | length > 0

- name: "Apply idxc_whitelist filter for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _app_ds_filtered: "{{ (_app_ds_filtered | default(_app_ds_base)) | intersect(_idxc_whitelist_union | default([]) | unique) | list }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined
    - app_item.idxc_whitelist is defined
    - app_item.idxc_whitelist | length > 0

# Build union of IDXC members for blacklist filter
- name: "Build IDXC blacklist union for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _idxc_blacklist_union: "{{ _idxc_blacklist_union | default([]) + (groups['idxcluster_' ~ item] | default([])) }}"
  loop: "{{ app_item.idxc_blacklist | default([]) }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined
    - app_item.idxc_blacklist is defined
    - app_item.idxc_blacklist | length > 0

- name: "Apply idxc_blacklist filter for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _app_ds_filtered: "{{ (_app_ds_filtered | default(_app_ds_base)) | reject('in', _idxc_blacklist_union | default([]) | unique) | list }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined
    - app_item.idxc_blacklist is defined
    - app_item.idxc_blacklist | length > 0

# --- shc_whitelist: app targets only SHC members; DS does not serve SHC, so remove all search heads from DS set ---
- name: "Exclude search heads from DS when shc_whitelist set for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _app_ds_filtered: "{{ (_app_ds_filtered | default(_app_ds_base)) | reject('in', (groups['role_search_head'] | default([]))) | list }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined
    - app_item.shc_whitelist is defined
    - (app_item.shc_whitelist or []) | length > 0

# --- hosts_whitelist/hosts_blacklist apply only to search heads (relevant role) ---
- name: "Set DS standalone search head list for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _ds_standalone_sh: "{{ groups['role_search_head'] | default([]) | reject('in', (groups | select('match', '^shcluster_') | list | map('extract', groups) | flatten) | list) | list }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined
    - (app_item.hosts_whitelist is defined and app_item.hosts_whitelist | length > 0) or (app_item.hosts_blacklist is defined and app_item.hosts_blacklist | length > 0)

- name: "Split DS filtered set into SH and non-SH for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _app_ds_sh: "{{ (_app_ds_filtered | default(_app_ds_base)) | intersect(_ds_standalone_sh) | list }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined
    - (app_item.hosts_whitelist is defined and app_item.hosts_whitelist | length > 0) or (app_item.hosts_blacklist is defined and app_item.hosts_blacklist | length > 0)

- name: "Set DS non-SH subset for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _app_ds_non_sh: "{{ (_app_ds_filtered | default(_app_ds_base)) | reject('in', _app_ds_sh | default([])) | list }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined
    - (app_item.hosts_whitelist is defined and app_item.hosts_whitelist | length > 0) or (app_item.hosts_blacklist is defined and app_item.hosts_blacklist | length > 0)

- name: "Apply hosts_whitelist filter (search heads only) for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _app_ds_sh_filtered: "{{ (_app_ds_sh | default([])) | intersect(app_item.hosts_whitelist | default([])) | list }}"
    _app_ds_filtered: "{{ (_app_ds_non_sh | default([])) + ((_app_ds_sh | default([])) | intersect(app_item.hosts_whitelist | default([]))) | unique | list }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined
    - app_item.hosts_whitelist is defined
    - app_item.hosts_whitelist | length > 0

- name: "Apply hosts_blacklist filter (search heads only) for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _app_ds_filtered: "{{ (_app_ds_non_sh | default([])) + ((_app_ds_sh_filtered | default(_app_ds_sh) | default([])) | reject('in', app_item.hosts_blacklist | default([]))) | unique | list }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined
    - app_item.hosts_blacklist is defined
    - app_item.hosts_blacklist | length > 0

# --- Serverclass: use sc_* directly (overwrite calculation) or use calculated whitelist + sc_blacklist ---
- name: "Set serverclass whitelist from sc_whitelist for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    app_whitelist_hosts: "{{ app_item.sc_whitelist | default([]) }}"
    app_blacklist_hosts: "{{ app_item.sc_blacklist | default([]) }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is defined
    - app_item.sc_whitelist | length > 0

- name: "Set serverclass whitelist from calculated set for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    app_whitelist_hosts: "{{ _app_ds_filtered | default(_app_ds_base) | default([]) }}"
    app_blacklist_hosts: "{{ app_item.sc_blacklist | default([]) }}"
  when:
    - app_state == 'installed'
    - app_item.sc_whitelist is not defined

- name: "Empty whitelist for removal of {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    app_whitelist_hosts: []
    app_blacklist_hosts: []
  when: app_state == 'absent'

- name: "Debug {{ app_item.name }} deployment"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.debug:
    msg:
      - "App: {{ app_item.name }}"
      - "State: {{ app_state }}"
      - "Version: {{ app_version }}"
      - "Serverclass: {{ serverclass_name }}"
      - "Whitelist: {{ app_whitelist_hosts | join(', ') if app_whitelist_hosts | length > 0 else '(empty)' }}"
    verbosity: 0

# Install app so the deployment-apps directory exists for this serverclass. Run when we have clients (whitelist)
# or when this entry uses a distinct serverclass/target_path (same app name, different deployment folder).
- name: "Install {{ app_item.name }}"
  ansible.builtin.include_tasks: "install_app.yml"
  when:
    - app_state == 'installed'
    - >-
      (app_whitelist_hosts | default([]) | length > 0)
      or (app_item.serverclass is defined and app_item.serverclass | trim | length > 0)
      or (app_item.target_path is defined and app_item.target_path | trim | length > 0)

- name: "Apply customizations for {{ app_item.name }}"
  ansible.builtin.include_role:
    name: apps_common
    tasks_from: apply_customizations.yml
  vars:
    app_path: "{{ app_item.target_path | default(splunk_install_dir | default('/opt') ~ '/' ~ splunk_install_app | default('splunk') ~ '/etc/deployment-apps/' ~ app_item.name) }}"
  when:
    - app_state == 'installed'
    - (app_whitelist_hosts | default([])) | length > 0
    - app_item.customizations is defined

- name: "Notify reload deploy-server when app or customizations changed"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.command: /bin/true
  notify: Reload deploy-server
  changed_when: update_needed | default(false)
  when: update_needed | default(false)

- name: "Set target path for removal of {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    app_name: "{{ app_item.name }}"
    app_target_path: "{{ app_item.target_path | default(splunk_install_dir | default('/opt') ~ '/' ~ splunk_install_app | default('splunk') ~ '/etc/deployment-apps/' ~ app_item.name) }}"
  when: app_state == 'absent'

- name: "Remove {{ app_item.name }}"
  ansible.builtin.include_tasks: "remove_app.yml"
  when: app_state == 'absent'

# When target_path is set, the app is under a different directory name; serverclass must reference that name.
- name: "Set serverclass app name for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    serverclass_app_name: "{{ (_ds_deploy_path | default(splunk_install_dir | default('/opt') ~ '/' ~ splunk_install_app | default('splunk') ~ '/etc/deployment-apps/' ~ app_item.name)).split('/') | last }}"
  vars:
    _ds_deploy_path: "{{ app_item.target_path | default(splunk_install_dir | default('/opt') ~ '/' ~ splunk_install_app | default('splunk') ~ '/etc/deployment-apps/' ~ app_item.name) }}"
  when:
    - (app_whitelist_hosts | default([])) | length > 0 or app_state == 'absent'

- name: "Configure serverclass for {{ app_item.name }}"
  ansible.builtin.include_tasks: "configure_serverclass.yml"
  vars:
    app_name: "{{ serverclass_app_name | default(app_item.name) }}"
  when:
    - (app_whitelist_hosts | default([])) | length > 0 or app_state == 'absent'
