---
# Verify a single app deployment
# Variables expected:
#   - verify_app_item: The app configuration
#   - verify_app_full_path: Full path to app (uses app_item.target_path override if set)
# Expected whitelist is computed like process_ds_app: base set, idxc/hosts filters (no SHC filters; DS does not manage SHC members), then sc_whitelist; sc_blacklist is written to serverclass as blacklist.0, blacklist.1, etc. Effective targets = whitelist minus blacklist.

- name: "Check if {{ verify_app_item.name }} exists"
  tags:
    - splunk
    - splunk_apps
    - verify
  ansible.builtin.stat:
    path: "{{ verify_app_full_path }}"
  register: app_check
  become: true

# Expected whitelist when sc_whitelist is set
- name: "Compute expected whitelist for {{ verify_app_item.name }} (sc_whitelist)"
  tags:
    - splunk
    - splunk_apps
    - verify
  ansible.builtin.set_fact:
    verify_expected_whitelist_hosts: "{{ (verify_app_item.sc_whitelist | default([])) | reject('in', verify_app_item.sc_blacklist | default([])) | list }}"
  when:
    - verify_app_item.state | default('installed') != 'absent'
    - verify_app_item.sc_whitelist is defined
    - verify_app_item.sc_whitelist | length > 0

# Base set (target_roles minus idxcluster/shcluster) when sc_whitelist not set
- name: "Compute expected whitelist base for {{ verify_app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - verify
  ansible.builtin.set_fact:
    _verify_ds_base: >-
      {{
        verify_app_item.target_roles | default([])
        | map('regex_replace', '^(.*)$', 'role_\1')
        | map('extract', groups)
        | flatten
        | reject('in', (groups | select('match', '^idxcluster_') | list | map('extract', groups) | flatten | list))
        | reject('in', (groups | select('match', '^shcluster_') | list | map('extract', groups) | flatten | list))
        | unique
        | list
      }}
  when:
    - verify_app_item.state | default('installed') != 'absent'
    - verify_app_item.sc_whitelist is not defined

- name: "Initialize expected filtered set for {{ verify_app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - verify
  ansible.builtin.set_fact:
    _verify_ds_filtered: "{{ _verify_ds_base | default([]) }}"
  when:
    - verify_app_item.state | default('installed') != 'absent'
    - verify_app_item.sc_whitelist is not defined

# Apply same filters as process_ds_app (idxc, hosts; no SHC)
- name: "Build verify IDXC whitelist union for {{ verify_app_item.name }}"
  ansible.builtin.set_fact:
    _verify_idxc_w: "{{ _verify_idxc_w | default([]) + (groups['idxcluster_' ~ item] | default([])) }}"
  loop: "{{ verify_app_item.idxc_whitelist | default([]) }}"
  when:
    - verify_app_item.state | default('installed') != 'absent'
    - verify_app_item.sc_whitelist is not defined
    - verify_app_item.idxc_whitelist is defined
    - verify_app_item.idxc_whitelist | length > 0

- name: "Apply verify idxc_whitelist for {{ verify_app_item.name }}"
  ansible.builtin.set_fact:
    _verify_ds_filtered: "{{ (_verify_ds_filtered | default(_verify_ds_base)) | intersect(_verify_idxc_w | default([]) | unique) | list }}"
  when:
    - verify_app_item.state | default('installed') != 'absent'
    - verify_app_item.sc_whitelist is not defined
    - verify_app_item.idxc_whitelist is defined
    - verify_app_item.idxc_whitelist | length > 0

- name: "Build verify IDXC blacklist union for {{ verify_app_item.name }}"
  ansible.builtin.set_fact:
    _verify_idxc_b: "{{ _verify_idxc_b | default([]) + (groups['idxcluster_' ~ item] | default([])) }}"
  loop: "{{ verify_app_item.idxc_blacklist | default([]) }}"
  when:
    - verify_app_item.state | default('installed') != 'absent'
    - verify_app_item.sc_whitelist is not defined
    - verify_app_item.idxc_blacklist is defined
    - verify_app_item.idxc_blacklist | length > 0

- name: "Apply verify idxc_blacklist for {{ verify_app_item.name }}"
  ansible.builtin.set_fact:
    _verify_ds_filtered: "{{ (_verify_ds_filtered | default(_verify_ds_base)) | reject('in', _verify_idxc_b | default([]) | unique) | list }}"
  when:
    - verify_app_item.state | default('installed') != 'absent'
    - verify_app_item.sc_whitelist is not defined
    - verify_app_item.idxc_blacklist is defined
    - verify_app_item.idxc_blacklist | length > 0

# --- hosts_whitelist/hosts_blacklist apply only to search heads (relevant role) ---
- name: "Split verify filtered set into SH and non-SH for {{ verify_app_item.name }}"
  ansible.builtin.set_fact:
    _verify_standalone_sh: "{{ groups['role_search_head'] | default([]) | reject('in', (groups | select('match', '^shcluster_') | list | map('extract', groups) | flatten) | list) | list }}"
    _verify_ds_sh: "{{ (_verify_ds_filtered | default(_verify_ds_base)) | intersect(_verify_standalone_sh) | list }}"
  when:
    - verify_app_item.state | default('installed') != 'absent'
    - verify_app_item.sc_whitelist is not defined
    - (verify_app_item.hosts_whitelist is defined and verify_app_item.hosts_whitelist | length > 0) or (verify_app_item.hosts_blacklist is defined and verify_app_item.hosts_blacklist | length > 0)

- name: "Set verify non-SH subset for {{ verify_app_item.name }}"
  ansible.builtin.set_fact:
    _verify_ds_non_sh: "{{ (_verify_ds_filtered | default(_verify_ds_base)) | reject('in', _verify_ds_sh | default([])) | list }}"
  when:
    - verify_app_item.state | default('installed') != 'absent'
    - verify_app_item.sc_whitelist is not defined
    - (verify_app_item.hosts_whitelist is defined and verify_app_item.hosts_whitelist | length > 0) or (verify_app_item.hosts_blacklist is defined and verify_app_item.hosts_blacklist | length > 0)

- name: "Apply verify hosts_whitelist (search heads only) for {{ verify_app_item.name }}"
  ansible.builtin.set_fact:
    _verify_ds_sh_filtered: "{{ (_verify_ds_sh | default([])) | intersect(verify_app_item.hosts_whitelist | default([])) | list }}"
    _verify_ds_filtered: "{{ (_verify_ds_non_sh | default([])) + (_verify_ds_sh_filtered) | unique | list }}"
  when:
    - verify_app_item.state | default('installed') != 'absent'
    - verify_app_item.sc_whitelist is not defined
    - verify_app_item.hosts_whitelist is defined
    - verify_app_item.hosts_whitelist | length > 0

- name: "Apply verify hosts_blacklist (search heads only) for {{ verify_app_item.name }}"
  ansible.builtin.set_fact:
    _verify_ds_sh_filtered: "{{ (_verify_ds_sh_filtered | default(_verify_ds_sh) | default([])) | reject('in', verify_app_item.hosts_blacklist | default([])) | list }}"
    _verify_ds_filtered: "{{ (_verify_ds_non_sh | default([])) + (_verify_ds_sh_filtered) | unique | list }}"
  when:
    - verify_app_item.state | default('installed') != 'absent'
    - verify_app_item.sc_whitelist is not defined
    - verify_app_item.hosts_blacklist is defined
    - verify_app_item.hosts_blacklist | length > 0

- name: "Set expected whitelist from filtered set for {{ verify_app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - verify
  ansible.builtin.set_fact:
    verify_expected_whitelist_hosts: "{{ (_verify_ds_filtered | default(_verify_ds_base) | default([])) | reject('in', verify_app_item.sc_blacklist | default([])) | list }}"
  when:
    - verify_app_item.state | default('installed') != 'absent'
    - verify_app_item.sc_whitelist is not defined

- name: "Verify {{ verify_app_item.name }} presence/absence"
  tags:
    - splunk
    - splunk_apps
    - verify
  ansible.builtin.set_fact:
    ds_mismatches: "{{ ds_mismatches + [mismatch_entry] }}"
  vars:
    app_state: "{{ verify_app_item.state | default('installed') }}"
    should_exist: "{{ app_state != 'absent' }}"
    actually_exists: "{{ app_check.stat.exists }}"
    missing_hosts_suffix: "{{ ' (expected hosts: ' + (verify_expected_whitelist_hosts | default([]) | join(', ')) + ')' if (should_exist and not actually_exists and (verify_expected_whitelist_hosts | default([]) | length > 0)) else '' }}"
    mismatch_entry:
      app: "{{ verify_app_item.name }}"
      issue: "{{ ('MISSING: App should be installed but not found' if (should_exist and not actually_exists) else 'UNEXPECTED: App should be absent but is installed') + (missing_hosts_suffix | default('')) }}"
      severity: "error"
      expected_state: "{{ app_state }}"
      actual_state: "{{ 'installed' if actually_exists else 'absent' }}"
  when: should_exist != actually_exists

# --- Version drift check: compare installed version against expected (Splunkbase API / local source) ---
- name: "Check version for {{ verify_app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - verify
  ansible.builtin.include_role:
    name: apps_common
    tasks_from: check_version.yml
  vars:
    app_name: "{{ verify_app_item.name }}"
    app_item: "{{ verify_app_item }}"
    app_version: "{{ verify_app_item.version | default('latest') }}"
    app_cache_dir: "{{ splunk_app_deployment.temp_dir | default('/tmp/splunk_apps') }}/{{ verify_app_item.name }}"
    splunk_home: "{{ splunk_install_dir | default('/opt') }}/{{ splunk_install_app | default('splunk') }}"
    verify_target_path: "{{ verify_app_full_path }}"
    verify_version_location: "etc/deployment-apps/"
    verify_version_task_label: "Deployment server verification"
  when:
    - app_check.stat.exists
    - verify_app_item.state | default('installed') != 'absent'
    - _splunkbase_credentials_available | default(true) | bool or verify_app_item.source | default('') != 'splunkbase'

- name: "Record version drift for {{ verify_app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - verify
  ansible.builtin.set_fact:
    ds_mismatches: "{{ ds_mismatches + [version_mismatch_entry] }}"
  vars:
    version_mismatch_entry:
      app: "{{ verify_app_item.name }}"
      issue: "VERSION DRIFT: installed='{{ current_version | default('?') }}', expected='{{ resolved_version | default('?') }}'"
      severity: "warning"
      expected_state: "installed"
      actual_state: "installed"
  when:
    - app_check.stat.exists
    - verify_app_item.state | default('installed') != 'absent'
    - update_needed | default(false) | bool
