---
# Deployment Server Apps - Runs on deployment_server hosts
# Calculates and deploys apps that should be distributed via deployment server
# Note: apps_common dependency handles config merging

- name: Initialize deployment server apps list
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    ds_apps: []

- name: Set fact for standalone search heads (not in any SHC)
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    _ds_standalone_sh_list: "{{ (groups['role_search_head'] | default([])) | reject('in', (groups | default({}) | dict2items | selectattr('key', 'match', '^shcluster_') | map(attribute='value') | flatten) | default([]) | list) | list }}"

- name: Filter apps for deployment server distribution
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    ds_apps: "{{ ds_apps + [item] }}"
  loop: "{{ splunk_app_deployment.apps | default([]) }}"
  when:
    - item.target_roles is defined
    - item.deployment_target | default('auto') != 'direct'
    # ITSI and content packs never go via deployment_server; they use direct/deployer (switch to direct when calculation would be DS).
    - (item.premium_app | default('')) != 'itsi'
    - not (item.itsi_content_pack | default(false))
    # Apps that target only indexer and/or cluster_manager go via cluster manager (manager-apps), not DS.
    - (item.target_roles | default([]) | difference(['indexer', 'cluster_manager']) | list | length) > 0
    # Apps that target only search_head must not go via DS when all search heads are in an SHC (they go via deployer only).
    - (item.target_roles | default([]) | difference(['search_head']) | list | length > 0) or (_ds_standalone_sh_list | default([]) | length > 0)
    # Apps with shc_whitelist or shc_blacklist target SHC members only and go via deployer; do not add them to DS.
    - (item.target_roles | default([]) | intersect(['search_head']) | length == 0) or ((item.shc_whitelist | default([]) | length == 0) and (item.shc_blacklist | default([]) | length == 0))

- name: Debug deployment server apps
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.debug:
    msg:
      - "========================================="
      - "DEPLOYMENT SERVER: {{ inventory_hostname }}"
      - "========================================="
      - "Total apps for DS distribution: {{ ds_apps | length }}"
      - "Apps: {{ ds_apps | map(attribute='name') | list | join(', ') if ds_apps | length > 0 else '(none)' }}"
      - "========================================="
    verbosity: 0

- name: Initialize DS scope debug list (debug only)
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.set_fact:
    ds_app_scope_debug: []
  when: debug_app_scope | default(false) | bool

- name: Process deployment server apps
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  block:
    - name: Process each deployment server app
      ansible.builtin.include_tasks: "process_ds_app.yml"
      loop: "{{ ds_apps }}"
      loop_control:
        loop_var: app_item
        label: "{{ app_item.name }}"
  when: ds_apps | length > 0

- name: Deployment server apps complete
  tags:
    - splunk
    - splunk_apps
    - deployment_server
  ansible.builtin.debug:
    msg: "Deployment server app processing complete on {{ inventory_hostname }}"
