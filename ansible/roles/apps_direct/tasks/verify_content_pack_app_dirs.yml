---
# Verify all on-disk app dirs for one multi-app ITSI content pack entry on direct deployment.
# Expects: verify_app_item, verify_base_path
# Optional: verify_mismatches_var (defaults to direct_mismatches)

- name: "Verify ITSI content pack directories for {{ verify_app_item.name }}"
  ansible.builtin.include_role:
    name: apps_itsi_content_pack
    tasks_from: verify_app_dirs.yml
