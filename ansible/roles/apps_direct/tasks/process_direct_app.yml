---
# Process a single direct deployment app
# ITSI and content packs are normalized: ITSI target_roles [search_head, indexer, license_manager], content packs target_roles [search_head]; both deployment_target auto. Same calculation as normal apps (deployment_server path excluded in apps_deployment_server).

- name: "Set app_item from loop (avoid loop_var collision)"
  ansible.builtin.set_fact:
    app_item: "{{ _loop_app_item }}"

# Content pack: assign ITSI filter vars so the same calculation code deploys to the same target as ITSI.
- name: "Apply ITSI filter vars to content pack app (same target as ITSI)"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    app_item: "{{ (app_item | default({})) | combine(_cp_itsi_filters) }}"
  when: (app_item | default({})).get('itsi_content_pack', false)
  vars:
    _itsi_cfg: "{{ (_itsi_apps_list | default([]) | first) | default({}) }}"
    _cp_itsi_filters: "{{ {'hosts_whitelist': (_itsi_cfg | default({})).get('hosts_whitelist', []), 'shc_whitelist': (_itsi_cfg | default({})).get('shc_whitelist', []), 'hosts_blacklist': (_itsi_cfg | default({})).get('hosts_blacklist', []), 'shc_blacklist': (_itsi_cfg | default({})).get('shc_blacklist', []), 'idxc_whitelist': (_itsi_cfg | default({})).get('idxc_whitelist', []), 'idxc_blacklist': (_itsi_cfg | default({})).get('idxc_blacklist', [])} }}"

# ITSI/content pack: hardcode target_roles and deployment_target auto so the same direct-base and filter calculation as normal apps is used. Content packs: search_head only; ITSI: search_head, indexer, license_manager.
- name: "Normalize ITSI/content pack to target_roles and deployment_target auto for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    app_item: "{{ (app_item | default({})) | combine({'target_roles': _cp_norm_roles, 'deployment_target': 'auto'}) }}"
  vars:
    _cp_norm_roles: "{{ (app_item | default({})).get('itsi_content_pack', false) | ternary(['search_head'], ['search_head', 'indexer', 'license_manager']) }}"
  when: (app_item | default({})).get('premium_app', '') == 'itsi' or (app_item | default({})).get('itsi_content_pack', false)

# --- Direct base set: hosts that get this app via direct (before filters) ---
# deployment_target direct: only standalone hosts (not SHC/IDXC). deployment_target auto: same formula (role hosts minus IDXC/SHC).
# Exclude only SHC member search heads from base (not deployer/license_manager in shcluster_* group).
- name: "Compute direct base (deployment_target direct) for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    _app_dir_base: "{{ ((groups | default({}) | dict2items | selectattr('key', 'in', _role_keys) | map(attribute='value') | flatten) | reject('in', _dir_idxc_all) | reject('in', _dir_shc_members) | unique) | list }}"
  vars:
    _role_keys: "{{ ((app_item | default({})).get('target_roles', []) | map('regex_replace', '^(.*)$', 'role_\\1') | list) | intersect((groups | default({}) | dict2items | map(attribute='key') | list)) }}"
    _dir_idxc_all: "{{ (groups | dict2items | selectattr('key', 'match', '^idxcluster_') | map(attribute='value') | flatten) | list }}"
    _dir_shc_members: "{{ (groups['role_search_head'] | default([])) | intersect((groups | dict2items | selectattr('key', 'match', '^shcluster_') | map(attribute='value') | flatten) | list) | list }}"
  when:
    - ((app_item | default({})).get('premium_app', '') | length) == 0
    - (app_item | default({})).get('target_roles') is defined
    - (app_item | default({})).get('deployment_target', 'auto') == 'direct'

# Same base formula as direct; used for auto (and ITSI/CP normalized to auto).
- name: "Compute direct base (deployment_target auto, incl. ITSI/CP normalized) for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    _app_dir_base: "{{ ((groups | default({}) | dict2items | selectattr('key', 'in', _role_keys) | map(attribute='value') | flatten) | reject('in', _dir_idxc_all) | reject('in', _dir_shc_members) | unique) | list }}"
  vars:
    _role_keys: "{{ ((app_item | default({})).get('target_roles', []) | map('regex_replace', '^(.*)$', 'role_\\1') | list) | intersect((groups | default({}) | dict2items | map(attribute='key') | list)) }}"
    _dir_idxc_all: "{{ (groups | dict2items | selectattr('key', 'match', '^idxcluster_') | map(attribute='value') | flatten) | list }}"
    _dir_shc_members: "{{ (groups['role_search_head'] | default([])) | intersect((groups | dict2items | selectattr('key', 'match', '^shcluster_') | map(attribute='value') | flatten) | list) | list }}"
  when:
    - (app_item | default({})).get('target_roles') is defined
    - (app_item | default({})).get('deployment_target', 'auto') != 'direct'

- name: "Set empty direct base when no match for {{ app_item.name }}"
  ansible.builtin.set_fact:
    _app_dir_base: []
  when: _app_dir_base is not defined

- name: "Initialize direct filtered set for {{ app_item.name }}"
  ansible.builtin.set_fact:
    _app_dir_filtered: "{{ _app_dir_base | default([]) }}"

# --- Split by role: hosts filters apply only to search heads; idxc only to non-SH ---
- name: "Set standalone search head list for {{ app_item.name }}"
  ansible.builtin.set_fact:
    _standalone_sh_list: "{{ groups['role_search_head'] | default([]) | reject('in', (groups | default({}) | dict2items | selectattr('key', 'match', '^shcluster_') | map(attribute='value') | flatten) | list) | list }}"

- name: "Set direct search-head subset for {{ app_item.name }} (hosts/shc filters apply only to this)"
  ansible.builtin.set_fact:
    _app_dir_direct_sh: "{{ ((_app_dir_base | default([])) | intersect(_standalone_sh_list)) | list }}"

- name: "Set direct non–search-head subset for {{ app_item.name }}"
  ansible.builtin.set_fact:
    _app_dir_direct_non_sh: "{{ (_app_dir_base | default([])) | reject('in', (groups['role_search_head'] | default([]))) | list }}"

- name: "Split non-SH into indexers and non-indexers for {{ app_item.name }} (idxc filters apply only to indexers; license_manager etc. stay in scope)"
  ansible.builtin.set_fact:
    _app_dir_direct_indexers: "{{ (_app_dir_direct_non_sh | default([])) | intersect(groups['role_indexer'] | default([])) | list }}"
    _app_dir_direct_non_indexer: "{{ (_app_dir_direct_non_sh | default([])) | reject('in', (groups['role_indexer'] | default([]))) | list }}"

# --- Apply shared hosts/shc filters to search-head subset (same logic as deployer) ---
# Use include_tasks so _filter_result is in the same scope (include_role does not expose set_fact to caller).
- name: "Apply shared SHC/hosts filters for direct SH subset {{ app_item.name }}"
  ansible.builtin.include_tasks: ../../apps_common/tasks/apply_shc_host_filters.yml
  vars:
    _filter_base: "{{ _app_dir_direct_sh | default([]) }}"
    _filter_app_item: "{{ app_item }}"

- name: "Save direct search-head filtered set for {{ app_item.name }}"
  ansible.builtin.set_fact:
    _app_dir_sh_filtered: "{{ _filter_result | default(_app_dir_direct_sh) | default([]) }}"

- name: "Set direct filtered indexers for {{ app_item.name }} (idxc filters apply only to this; non-indexers e.g. license_manager kept)"
  ansible.builtin.set_fact:
    _app_dir_filtered_indexers: "{{ _app_dir_direct_indexers | default([]) }}"

- name: "Build direct IDXC whitelist union for {{ app_item.name }}"
  ansible.builtin.set_fact:
    _dir_idxc_w: "{{ _dir_idxc_w | default([]) + (groups['idxcluster_' ~ item] | default([])) }}"
  loop: "{{ (app_item | default({})).get('idxc_whitelist', []) }}"
  when: ((app_item | default({})).get('idxc_whitelist', []) | length) > 0

- name: "Apply direct idxc_whitelist for {{ app_item.name }} (indexers only)"
  ansible.builtin.set_fact:
    _app_dir_filtered_indexers: "{{ (_app_dir_filtered_indexers | default(_app_dir_direct_indexers)) | intersect(_dir_idxc_w | default([]) | unique) | list }}"
  when: ((app_item | default({})).get('idxc_whitelist', []) | length) > 0

- name: "Build direct IDXC blacklist union for {{ app_item.name }}"
  ansible.builtin.set_fact:
    _dir_idxc_b: "{{ _dir_idxc_b | default([]) + (groups['idxcluster_' ~ item] | default([])) }}"
  loop: "{{ (app_item | default({})).get('idxc_blacklist', []) }}"
  when: ((app_item | default({})).get('idxc_blacklist', []) | length) > 0

- name: "Apply direct idxc_blacklist for {{ app_item.name }} (indexers only)"
  ansible.builtin.set_fact:
    _app_dir_filtered_indexers: "{{ (_app_dir_filtered_indexers | default(_app_dir_direct_indexers)) | reject('in', _dir_idxc_b | default([]) | unique) | list }}"
  when: ((app_item | default({})).get('idxc_blacklist', []) | length) > 0

- name: "Set direct non-SH filtered set for {{ app_item.name }} (filtered indexers + license_manager etc.)"
  ansible.builtin.set_fact:
    _app_dir_filtered: "{{ ((_app_dir_filtered_indexers | default(_app_dir_direct_indexers)) + (_app_dir_direct_non_indexer | default([]))) | unique | list }}"

- name: "Combine direct SH and non-SH filtered sets for {{ app_item.name }}"
  ansible.builtin.set_fact:
    _app_dir_filtered: "{{ ((_app_dir_sh_filtered | default([])) + (_app_dir_filtered | default([]))) | unique | list }}"

# Apply hosts_whitelist/hosts_blacklist to the full direct set so non-SH roles (e.g. forwarders) are also restricted.
# ITSI: hosts_whitelist limits which *search heads* get the direct bundle; license_manager (and other non-SH roles) stay in scope if in base.
- name: "Apply hosts_whitelist to direct set for {{ app_item.name }} (ITSI: filter search heads only)"
  ansible.builtin.set_fact:
    _app_dir_filtered: >-
      {{
        (
          (_app_dir_filtered | default([])) | reject('in', (groups['role_search_head'] | default([]))) | list
          | union(
            (_app_dir_filtered | default([]))
            | intersect((groups['role_search_head'] | default([])))
            | intersect((app_item | default({})).get('hosts_whitelist', []) | default([]))
            | list
          )
        ) | unique | list
      }}
  when:
    - ((app_item | default({})).get('hosts_whitelist', []) | default([]) | length) > 0
    - (app_item | default({})).get('premium_app', '') == 'itsi'

- name: "Apply hosts_whitelist to full direct set for {{ app_item.name }}"
  ansible.builtin.set_fact:
    _app_dir_filtered: "{{ (_app_dir_filtered | default([])) | intersect((app_item | default({})).get('hosts_whitelist', []) | default([])) | list }}"
  when:
    - ((app_item | default({})).get('hosts_whitelist', []) | default([]) | length) > 0
    - (app_item | default({})).get('premium_app', '') != 'itsi'

- name: "Apply hosts_blacklist to full direct set for {{ app_item.name }}"
  ansible.builtin.set_fact:
    _app_dir_filtered: "{{ (_app_dir_filtered | default([])) | reject('in', (app_item | default({})).get('hosts_blacklist', []) | default([])) | list }}"
  when: ((app_item | default({})).get('hosts_blacklist', []) | default([]) | length) > 0

# Scope: host in filtered set only (install and remove both respect hosts_whitelist/shc_whitelist; do not run remove on hosts outside filtered set).
- name: "Set direct scope for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    _app_on_direct_scope: "{{ inventory_hostname in (_app_dir_filtered | default(_app_dir_base) | default([])) }}"

# Debug mode: collect scope result for this app (no install/remove). Run with -e debug_app_scope=true
- name: "Record scope debug result for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    scope_debug_results: "{{ scope_debug_results | default([]) + [{'app': app_item.name, 'state': (app_item | default({})).get('state', 'installed'), 'in_base': (inventory_hostname in (_app_dir_base | default([]))), 'in_filtered': (inventory_hostname in (_app_dir_filtered | default([]))), 'on_scope': _app_on_direct_scope, 'base_hosts': (_app_dir_base | default([])), 'filtered_hosts': (_app_dir_filtered | default([])), 'customizations': (app_item | default({})).get('customizations'), 'content_pack_apps': (app_item | default({})).get('content_pack_apps'), 'library_app': (app_item | default({})).get('library_app'), 'install_all_apps': (app_item | default({})).get('install_all_apps')}] }}"
  when: debug_app_scope | default(false) | bool

# When debug_app_scope=true we only collect scope above; skip install/remove below.
- name: "Apply direct app (install/remove) for {{ app_item.name }}"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  when: not (debug_app_scope | default(false) | bool)
  block:
    - name: "Set defaults for {{ app_item.name }}"
      tags:
        - splunk
        - splunk_apps
        - direct_deployment
      ansible.builtin.set_fact:
        app_state: "{{ app_item.state | default('installed') }}"
        app_version: "{{ app_item.version | default('latest') }}"

    - name: "Install {{ app_item.name }} (premium pack ITSI)"
      ansible.builtin.include_role:
        name: apps_itsi
      vars:
        apps_itsi_direct_install: true
      when:
        - _app_on_direct_scope | default(false)
        - app_state == 'installed'
        - (app_item | default({})).get('premium_app', '') == 'itsi'

    - name: "Install {{ app_item.name }} (ITSI content pack)"
      ansible.builtin.include_role:
        name: apps_itsi
      when:
        - _app_on_direct_scope | default(false)
        - app_state == 'installed'
        - (app_item | default({})).get('itsi_content_pack', false)

    - name: "Install {{ app_item.name }} (standard)"
      ansible.builtin.include_tasks: "install_app.yml"
      when:
        - _app_on_direct_scope | default(false)
        - app_state == 'installed'
        - ((app_item | default({})).get('premium_app', '') | length) == 0
        - not ((app_item | default({})).get('itsi_content_pack', false))

    # Version status (App / Current / Expected / Update / Force / Location) is emitted by apps_common install_from_* (same for all deployment mechanisms).

    - name: "Capture install-level update_needed for {{ app_item.name }}"
      tags:
        - splunk
        - splunk_apps
        - direct_deployment
      ansible.builtin.set_fact:
        _app_install_update_needed: "{{ update_needed | default(false) | bool }}"

    - name: "Apply customizations for {{ app_item.name }}"
      ansible.builtin.include_role:
        name: apps_common
        tasks_from: apply_customizations.yml
      vars:
        app_path: "{{ app_item.target_path | default(splunk_install_dir | default('/opt') ~ '/' ~ splunk_install_app | default('splunk') ~ '/etc/apps/' ~ app_item.name) }}"
      when:
        - _app_on_direct_scope | default(false)
        - app_state == 'installed'
        - app_item.customizations is defined

    # Same mechanism as above: apply customizations for each content pack app (reuse apps_common apply_customizations.yml)
    - name: "Apply customizations for content pack apps (direct deployment)"
      ansible.builtin.include_role:
        name: apps_common
        tasks_from: apply_customizations.yml
      vars:
        app_item: "{{ _cp_item }}"
        app_path: "{{ (splunk_install_dir | default('/opt')) ~ '/' ~ (splunk_install_app | default('splunk')) ~ '/etc/apps/' ~ _cp_item.name }}"
      loop: "{{ app_item.content_pack_apps | default([]) }}"
      loop_control:
        loop_var: _cp_item
      when:
        - _app_on_direct_scope | default(false)
        - app_state == 'installed'
        - (app_item | default({})).get('itsi_content_pack', false)
        - _cp_item.customizations is defined

    # Register run_playbook_after_restart only for direct deployment so it runs on this host (the target) after the handler
    - name: "Register post-restart playbook for {{ app_item.name }} (direct deployment)"
      tags:
        - splunk
        - splunk_apps
        - direct_deployment
      ansible.builtin.set_fact:
        post_restart_playbooks_to_run: "{{ (post_restart_playbooks_to_run | default([])) + [{'playbook': app_item.customizations.run_playbook_after_restart, 'app_path': customization_app_path, 'app_name': app_item.name, 'extra_vars': (app_item.customizations.extra_vars | default({})) | combine({'force_run_playbook_after_restart': (app_item.customizations.force_run_playbook_after_restart | default(false))}), 'app_updated_this_run': (_app_install_update_needed | default(false) | bool)}] }}"
      when:
        - _app_on_direct_scope | default(false)
        - app_state == 'installed'
        - app_item.customizations is defined
        - app_item.customizations.run_playbook_after_restart is defined
        - app_item.customizations.run_playbook_after_restart | length > 0

    # Same mechanism as above: register post-restart playbooks for each content pack app that has run_playbook_after_restart (no content-pack-specific path)
    - name: "Register post-restart playbook for content pack apps (direct deployment)"
      tags:
        - splunk
        - splunk_apps
        - direct_deployment
      ansible.builtin.set_fact:
        post_restart_playbooks_to_run: "{{ (post_restart_playbooks_to_run | default([])) + [{'playbook': _cp_item.customizations.run_playbook_after_restart, 'app_path': _cp_app_path, 'app_name': _cp_item.name, 'extra_vars': (_cp_item.customizations.extra_vars | default({})) | combine({'force_run_playbook_after_restart': (_cp_item.customizations.force_run_playbook_after_restart | default(false))}), 'app_updated_this_run': (_app_install_update_needed | default(false) | bool)}] }}"
      loop: "{{ app_item.content_pack_apps | default([]) }}"
      loop_control:
        loop_var: _cp_item
        label: "{{ _cp_item.name }}: {{ (_cp_item.customizations | default({})).run_playbook_after_restart | default('(none)') }} force={{ (_cp_item.customizations | default({})).force_run_playbook_after_restart | default(false) }}"
      vars:
        _cp_app_path: "{{ (splunk_install_dir | default('/opt')) ~ '/' ~ (splunk_install_app | default('splunk')) ~ '/etc/apps/' ~ _cp_item.name }}"
      when:
        - _app_on_direct_scope | default(false)
        - app_state == 'installed'
        - (app_item | default({})).get('itsi_content_pack', false)
        - _cp_item.customizations is defined
        - _cp_item.customizations.run_playbook_after_restart is defined
        - _cp_item.customizations.run_playbook_after_restart | length > 0

    - name: "Remove {{ app_item.name }} (ITSI content pack)"
      ansible.builtin.include_role:
        name: apps_itsi
      when:
        - _app_on_direct_scope | default(false)
        - app_state == 'absent'
        - (app_item | default({})).get('itsi_content_pack', false)

    - name: "Remove {{ app_item.name }} (premium app ITSI)"
      ansible.builtin.include_role:
        name: apps_itsi
        tasks_from: itsi_remove_direct.yml
      when:
        - _app_on_direct_scope | default(false)
        - app_state == 'absent'
        - (app_item | default({})).get('premium_app', '') == 'itsi'

    - name: "Set target path for removal of {{ app_item.name }}"
      tags:
        - splunk
        - splunk_apps
        - direct_deployment
      ansible.builtin.set_fact:
        app_name: "{{ app_item.name }}"
        app_target_path: "{{ app_item.target_path | default(splunk_install_dir | default('/opt') ~ '/' ~ splunk_install_app | default('splunk') ~ '/etc/apps/' ~ app_item.name) }}"
      when:
        - _app_on_direct_scope | default(false)
        - app_state == 'absent'
        - ((app_item | default({})).get('premium_app', '') | length) == 0
        - not ((app_item | default({})).get('itsi_content_pack', false))

    - name: "Remove {{ app_item.name }} (standard)"
      ansible.builtin.include_tasks: "remove_app.yml"
      when:
        - _app_on_direct_scope | default(false)
        - app_state == 'absent'
        - ((app_item | default({})).get('premium_app', '') | length) == 0
        - not ((app_item | default({})).get('itsi_content_pack', false))

    # Set app_path and splunk_home so "Restart splunk" handler can run; use a dedicated flag so handler is not skipped by role/default context.
    - name: "Set app_path, splunk_home and restart flag for Restart splunk handler (direct etc/apps)"
      tags:
        - splunk
        - splunk_apps
        - direct_deployment
      ansible.builtin.set_fact:
        splunk_home: "{{ splunk_install_dir | default('/opt') ~ '/' ~ splunk_install_app | default('splunk') }}"
        app_path: "{{ splunk_install_dir | default('/opt') ~ '/' ~ splunk_install_app | default('splunk') ~ '/etc/apps' }}"
        restart_splunk_direct_etc_apps: true
      when:
        - _app_on_direct_scope | default(false)
        - update_needed | default(false)
        - app_item.restart_required | default(true)
        - ((app_item | default({})).get('premium_app', '') | length) == 0

    - name: "Notify Splunk restart for {{ app_item.name }}"
      tags:
        - splunk
        - splunk_apps
        - direct_deployment
      ansible.builtin.command: /bin/true
      notify: Restart splunk
      changed_when: update_needed | default(false)
      when:
        - _app_on_direct_scope | default(false)
        - update_needed | default(false)
        - app_item.restart_required | default(true)
        - ((app_item | default({})).get('premium_app', '') | length) == 0
