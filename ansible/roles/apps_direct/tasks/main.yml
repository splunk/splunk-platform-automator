---
# Direct Deployment Apps - Runs on all hosts except manager roles
# Handles apps that should be installed directly to etc/apps
# Note: apps_common dependency handles config merging
# ITSI and content packs normalized: ITSI target_roles [search_head, indexer, license_manager], content packs target_roles [search_head]; both deployment_target auto. Same eligibility and scope (process_direct_app shared filter). DS path excluded in apps_deployment_server; license_manager gets ITSI via direct.

- name: Get current host roles
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    current_host_roles: "{{ group_names | select('match', '^role_.*') | map('regex_replace', '^role_', '') | list }}"

- name: Initialize direct apps list
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    direct_apps: []

# Content packs inherit filter vars from ITSI in process_direct_app; we need the ITSI app config(s) for that.
- name: "Build list of ITSI app configs (for content pack same target as ITSI)"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    _itsi_apps_list: "{{ _itsi_apps_list | default([]) + [item] }}"
  loop: "{{ splunk_app_deployment.apps | default([]) }}"
  when: (item | default({})).get('premium_app', '') == 'itsi'
  loop_control:
    label: "{{ (item | default({})).get('name', '?') }}"

# ITSI/content pack normalized to target_roles and deployment_target auto; same add rule as normal apps. Scope decided in process_direct_app via shared filter.
- name: Check each app for direct deployment eligibility
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    direct_apps: "{{ direct_apps + [item] }}"
  loop: "{{ splunk_app_deployment.apps | default([]) }}"
  vars:
    _itsi_cp_roles: ['search_head', 'indexer', 'license_manager']
    _cp_roles: ['search_head']
    _norm: "{{ (item | default({})).get('premium_app') == 'itsi' or (item | default({})).get('itsi_content_pack') | default(false) }}"
    _roles: "{{ (item | default({})).get('itsi_content_pack') | default(false) | ternary(_cp_roles, _itsi_cp_roles) }}"
    # Content packs inherit SHC filter from ITSI; use ITSI's shc_whitelist when present for the standalone-SH exclusion below.
    _effective_shc_whitelist: "{{ (item | default({})).get('itsi_content_pack') and ((_itsi_apps_list | default([]) | first | default({})).get('shc_whitelist', []) | default([])) or ((item | default({})).get('shc_whitelist', []) | default([])) }}"
    # Use 'direct' for ITSI/CP eligibility so they are added to direct_apps even when a deployment server exists (deployer does not push ITSI to these hosts).
    _app_item: "{{ _norm | ternary((item | default({}) | combine({'target_roles': _roles, 'deployment_target': 'direct'})), item) }}"
  when:
    - (_app_item | default({})).get('target_roles') is defined
    - current_host_roles | intersect((_app_item | default({})).get('target_roles', [])) | length > 0
    - >-
      ((_app_item | default({})).get('deployment_target', 'auto') == 'direct')
      or (
        (_app_item | default({})).get('deployment_target', 'auto') != 'direct'
        and (groups['role_deployment_server'] | default([]) | length == 0)
        and current_host_roles | intersect(['deployment_server', 'cluster_manager', 'deployer']) | length == 0
        and current_host_roles | intersect(['universal_forwarder', 'heavy_forwarder']) | length == 0
        and (
          (current_host_roles | intersect(['indexer']) | length > 0 and group_names | select('match', '^idxcluster_') | list | length == 0)
          or
          (current_host_roles | intersect(['search_head']) | length > 0 and group_names | select('match', '^shcluster_') | list | length == 0)
          or
          (_norm and current_host_roles | intersect(['license_manager']) | length > 0)
        )
      )
    # SHC members get ITSI via deployer, not direct.
    - (current_host_roles | intersect(['search_head']) | length == 0) or (group_names | select('match', '^shcluster_') | list | length == 0)
    # ITSI/content pack with shc_whitelist: standalone SH is not targeted (only SHC is), so do not add to direct_apps for standalone SH.
    - (not _norm) or (_effective_shc_whitelist | default([]) | length == 0) or (current_host_roles | intersect(['search_head']) | length == 0) or (group_names | select('match', '^shcluster_') | list | length > 0)
    # ITSI/content pack: indexer cluster members get app via CM (manager-apps), not direct; exclude from direct_apps so they do not appear in direct scope.
    # Standalone indexer (no idxcluster_ group) still gets ITSI via direct; only clustered indexers are excluded.
    - (not _norm) or (current_host_roles | intersect(['indexer']) | length == 0) or (group_names | select('match', '^idxcluster_') | list | length == 0)

- name: Debug direct deployment apps
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.debug:
    msg:
      - "========================================="
      - "DIRECT DEPLOYMENT: {{ inventory_hostname }}"
      - "========================================="
      - "Host roles: {{ current_host_roles | join(', ') }}"
      - "Total apps for direct deployment: {{ direct_apps | length }}"
      - "Apps: {{ direct_apps | map(attribute='name') | list | join(', ') if direct_apps | length > 0 else '(none)' }}"
      - "========================================="
    verbosity: 0

# Ensure ITSI is installed before content packs; remove content packs before ITSI.
# Build install/absent lists via loop so items without 'state' key use .get('state','installed').
- name: "Build direct install list (state != absent)"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    _dir_inst: "{{ _dir_inst | default([]) + [item] }}"
  loop: "{{ direct_apps }}"
  when:
    - direct_apps | length > 0
    - (item | default({})).get('state', 'installed') != 'absent'
  loop_control:
    label: "{{ (item | default({})).get('name', '?') }}"

- name: "Build direct absent list (state == absent)"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    _dir_abs: "{{ _dir_abs | default([]) + [item] }}"
  loop: "{{ direct_apps }}"
  when:
    - direct_apps | length > 0
    - (item | default({})).get('state', 'installed') == 'absent'
  loop_control:
    label: "{{ (item | default({})).get('name', '?') }}"

# Install order: ITSI then content packs then rest; remove order: content packs then ITSI then rest. Rejectattr uses equalto so items without the key are kept.
- name: "Sort direct apps (install/remove order)"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    direct_apps: "{{ _dir_sorted }}"
  vars:
    _dir_inst_itsi: "{{ _dir_inst | default([]) | selectattr('premium_app', 'equalto', 'itsi') | list }}"
    _dir_inst_cp: "{{ _dir_inst | default([]) | rejectattr('premium_app', 'equalto', 'itsi') | selectattr('itsi_content_pack', 'defined') | selectattr('itsi_content_pack') | list }}"
    _dir_inst_other: "{{ _dir_inst | default([]) | rejectattr('premium_app', 'equalto', 'itsi') | rejectattr('itsi_content_pack', 'equalto', true) | list }}"
    _dir_abs_cp: "{{ _dir_abs | default([]) | selectattr('itsi_content_pack', 'defined') | selectattr('itsi_content_pack') | list }}"
    _dir_abs_itsi: "{{ _dir_abs | default([]) | selectattr('premium_app', 'equalto', 'itsi') | list }}"
    _dir_abs_other: "{{ _dir_abs | default([]) | rejectattr('premium_app', 'equalto', 'itsi') | rejectattr('itsi_content_pack', 'equalto', true) | list }}"
    _dir_sorted: "{{ (_dir_inst_itsi | default([]) | list) + (_dir_inst_cp | default([]) | list) + (_dir_inst_other | default([]) | list) + (_dir_abs_cp | default([]) | list) + (_dir_abs_itsi | default([]) | list) + (_dir_abs_other | default([]) | list) }}"
  when:
    - direct_apps | length > 0
    - _dir_sorted | length > 0

# When a content pack is in direct_apps but ITSI is not (e.g. eligibility excluded ITSI for this host), add ITSI so removal runs on this host too (e.g. single SH with hosts_whitelist: ['sh']).
- name: "Add ITSI to direct_apps for standalone SH when content pack present (so ITSI removal runs)"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    direct_apps: "{{ _dir_sorted_with_itsi }}"
  when:
    - direct_apps | length > 0
    - (direct_apps | selectattr('itsi_content_pack', 'defined') | selectattr('itsi_content_pack') | list | length) > 0
    - (direct_apps | selectattr('premium_app', 'defined') | selectattr('premium_app', 'equalto', 'itsi') | list | length) == 0
    - inventory_hostname in (groups['role_search_head'] | default([]))
    - (group_names | select('match', '^shcluster_') | list | length) == 0
    - (_itsi_apps_list | default([]) | length) > 0
  vars:
    _dir_itsi_entry: "{{ (_itsi_apps_list | default([]) | first) }}"
    _dir_rest: "{{ direct_apps | rejectattr('itsi_content_pack', 'equalto', true) | rejectattr('premium_app', 'equalto', 'itsi') | list }}"
    _dir_cp: "{{ direct_apps | selectattr('itsi_content_pack', 'defined') | selectattr('itsi_content_pack') | list }}"
    _dir_sorted_with_itsi: "{{ _dir_rest + _dir_cp + [_dir_itsi_entry] }}"

# When debug_app_scope=true we only compute scope and collect results; no install/remove. Use: -e debug_app_scope=true
- name: Initialize scope debug results (debug mode)
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.set_fact:
    scope_debug_results: []
  when: debug_app_scope | default(false) | bool

- name: Process direct deployment apps
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  block:
    - name: Process each direct deployment app
      ansible.builtin.include_tasks: "process_direct_app.yml"
      loop: "{{ direct_apps }}"
      loop_control:
        loop_var: _loop_app_item
        label: "{{ _loop_app_item.name }}"
  when: direct_apps | length > 0

- name: Show scope debug summary for host (debug mode)
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.debug:
    msg:
      - "=== SCOPE DEBUG {{ inventory_hostname }} ==="
      - "{{ scope_debug_results | default([]) }}"
  when:
    - debug_app_scope | default(false) | bool
    - scope_debug_results is defined

- name: Direct deployment apps complete
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
  ansible.builtin.debug:
    msg: "Direct deployment app processing complete on {{ inventory_hostname }}"
