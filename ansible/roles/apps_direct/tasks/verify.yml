---
# Verify Direct Deployment Apps
# Checks if apps are deployed directly to etc/apps on relevant hosts

- name: Get current host roles
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.set_fact:
    current_host_roles: "{{ (group_names | default([])) | select('match', '^role_.*') | map('regex_replace', '^role_', '') | list }}"

- name: Set direct host cluster membership (SHC/IDXC from inventory)
  ansible.builtin.include_tasks: set_direct_cluster_membership.yml
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify

- name: Detect deployment client (btool when deploymentclient_check)
  ansible.builtin.include_tasks: detect_deployment_client.yml
  when:
    - (groups['role_deployment_server'] | default([]) | length) > 0
    - splunk_app_deployment is not defined or ((splunk_app_deployment.deploymentclient_check | default(true)) | bool)
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify

- name: Assume deployment client without btool (deploymentclient_check false)
  ansible.builtin.include_tasks: assume_deployment_client_heuristic.yml
  when:
    - (groups['role_deployment_server'] | default([]) | length) > 0
    - splunk_app_deployment is defined
    - not ((splunk_app_deployment.deploymentclient_check | default(true)) | bool)
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify

# Content packs inherit SHC filter from ITSI; align with main.yml eligibility loop.
- name: "Build list of ITSI app configs (for content pack same target as ITSI)"
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.set_fact:
    _itsi_apps_list: "{{ _itsi_apps_list | default([]) + [item] }}"
  loop: "{{ splunk_app_deployment.apps | default([]) }}"
  when: (item | default({})).get('premium_app', '') == 'itsi'
  loop_control:
    label: "{{ (item | default({})).get('name', '?') }}"

- name: Initialize verification results
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.set_fact:
    direct_verification_results: []
    direct_apps_expected: []
    direct_apps_found: []
    direct_mismatches: []

# ITSI/content pack normalized same as main.yml; expected list uses catalog item, eligibility uses _app_item.
- name: Filter apps for direct deployment on this host
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.set_fact:
    direct_apps_expected: "{{ direct_apps_expected + [item] }}"
  loop: "{{ splunk_app_deployment.apps | default([]) }}"
  vars:
    _itsi_cp_roles: ['search_head', 'indexer', 'license_manager']
    _cp_roles: ['search_head']
    _norm: "{{ (item | default({})).get('premium_app') == 'itsi' or (item | default({})).get('itsi_content_pack') | default(false) }}"
    _roles: "{{ (item | default({})).get('itsi_content_pack') | default(false) | ternary(_cp_roles, _itsi_cp_roles) }}"
    _effective_shc_whitelist: "{{ (item | default({})).get('itsi_content_pack') and ((_itsi_apps_list | default([]) | first | default({})).get('shc_whitelist', []) | default([])) or ((item | default({})).get('shc_whitelist', []) | default([])) }}"
    # Same as process_direct_app: ITSI hosts_whitelist limits search heads only; CP inherits ITSI list.
    _effective_hosts_whitelist_cp_it: "{{ ((item | default({})).get('itsi_content_pack') | default(false)) | ternary(((_itsi_apps_list | default([]) | first | default({})).get('hosts_whitelist', []) | default([])), ((item | default({})).get('hosts_whitelist', []) | default([]))) }}"
    _app_item: "{{ _norm | ternary((item | default({}) | combine({'target_roles': _roles, 'deployment_target': 'direct'})), item) }}"
    _deployment_target_ok: >-
      {{
        (
          (((_app_item | default({})).get('deployment_target', 'auto') == 'direct')
          or (
            (_app_item | default({})).get('deployment_target', 'auto') != 'direct'
            and current_host_roles | intersect(['cluster_manager', 'deployer']) | length == 0
            and not (
              (
                (_direct_host_idxc_member | default(false) | bool)
                and (['indexer'] | intersect((_app_item | default({})).get('target_roles', []) | default([])) | length > 0)
                and (current_host_roles | intersect(['indexer']) | length > 0)
              )
              or (
                (_direct_host_shc_member | default(false) | bool)
                and (['search_head'] | intersect((_app_item | default({})).get('target_roles', []) | default([])) | length > 0)
                and (current_host_roles | intersect(['search_head']) | length > 0)
              )
              or (_splunk_is_deployment_client | default(false) | bool)
            )
          ))
          | default(false)
          | bool
        )
      }}
    _eligible_for_direct: >-
      {{
        (
          (_app_item | default({})).get('target_roles') is defined
          and (current_host_roles | intersect((_app_item | default({})).get('target_roles', [])) | length > 0)
          and (_deployment_target_ok | bool)
          and not (
            (_direct_host_shc_member | default(false) | bool)
            and (current_host_roles | intersect(['search_head']) | length > 0)
            and (['search_head'] | intersect((_app_item | default({})).get('target_roles', []) | default([])) | length > 0)
          )
          and not (
            (_direct_host_idxc_member | default(false) | bool)
            and (current_host_roles | intersect(['indexer']) | length > 0)
            and (['indexer'] | intersect((_app_item | default({})).get('target_roles', []) | default([])) | length > 0)
          )
          and (
            (not _norm)
            or (_effective_shc_whitelist | default([]) | length == 0)
            or (current_host_roles | intersect(['search_head']) | length == 0)
            or ((group_names | default([])) | select('match', '^shcluster_') | list | length > 0)
          )
          and (
            (not _norm)
            or (current_host_roles | intersect(['indexer']) | length == 0)
            or ((group_names | default([])) | select('match', '^idxcluster_') | list | length == 0)
          )
          and (
            (
              (not (_norm | bool))
              and (
                ((_app_item | default({})).get('hosts_whitelist', []) | default([]) | length == 0)
                or (inventory_hostname in ((_app_item | default({})).get('hosts_whitelist', []) | default([])))
              )
            )
            or (
              (_norm | bool)
              and (
                (_effective_hosts_whitelist_cp_it | default([]) | length == 0)
                or (current_host_roles | intersect(['search_head']) | length == 0)
                or (inventory_hostname in (_effective_hosts_whitelist_cp_it | default([])))
              )
            )
          )
        ) | bool
      }}
  when: _eligible_for_direct | bool
  loop_control:
    label: "{{ (item | default({})).get('name', '?') }} — {{ 'eligible' if (_eligible_for_direct | bool) else 'not eligible' }}"

- name: Normalize direct_apps_expected for verify filters (optional keys)
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.set_fact:
    _direct_apps_expected_norm: "{{ _direct_apps_expected_norm | default([]) + [_norm_entry | combine({'_is_single_app_cp': _is_single_app_cp})] }}"
  loop: "{{ direct_apps_expected }}"
  loop_control:
    label: "{{ item.name | default('?') }}"
  vars:
    _verify_app_defaults:
      itsi_content_pack: false
      premium_app: ""
      install_all_apps: false
    _norm_entry: "{{ _verify_app_defaults | combine(item) }}"
    _is_single_app_cp: >-
      {{
        (_norm_entry.itsi_content_pack | default(false) | bool)
        and not (_norm_entry.install_all_apps | default(false) | bool)
        and ((_norm_entry.content_pack_apps | default([]) | length) == 0)
      }}
  when: direct_apps_expected | length > 0

- name: Apply normalized direct_apps_expected for verify
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.set_fact:
    direct_apps_expected: "{{ _direct_apps_expected_norm | default([]) }}"
  when: direct_apps_expected | length > 0

- name: Check apps directory exists
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.stat:
    path: "{{ splunk_home }}/etc/apps"
  register: apps_dir
  when: direct_apps_expected | length > 0
  become: true

- name: List actual apps in etc/apps
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.find:
    paths: "{{ splunk_home }}/etc/apps"
    file_type: directory
    recurse: no
  register: actual_apps
  when:
    - direct_apps_expected | length > 0
    - apps_dir.stat.exists
  become: true

- name: Extract app names from filesystem
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.set_fact:
    direct_apps_found: "{{ actual_apps.files | map(attribute='path') | map('basename') | list }}"
  when:
    - direct_apps_expected | length > 0
    - apps_dir.stat.exists
    - actual_apps.files is defined

- name: Verify each expected standard, ITSI premium, or single-app content pack
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.include_tasks: verify_single_app.yml
  loop: >-
    {{
      (direct_apps_expected | rejectattr('itsi_content_pack', 'equalto', true) | list)
      + (direct_apps_expected | selectattr('_is_single_app_cp', 'defined') | selectattr('_is_single_app_cp') | list)
    }}
  loop_control:
    loop_var: verify_app_item
    label: "{{ verify_app_item.name }}"
  vars:
    verify_base_path: "{{ splunk_home }}/etc/apps"
    verify_app_fs_dir: >-
      {{ 'itsi' if (verify_app_item.premium_app | default('')) == 'itsi'
      else verify_app_item.name }}
    verify_app_full_path: "{{ verify_app_item.target_path | default(verify_base_path ~ '/' ~ verify_app_fs_dir) }}"
  when: direct_apps_expected | length > 0

- name: Verify each expected multi-app ITSI content pack
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.include_tasks: verify_content_pack_app_dirs.yml
  loop: "{{ direct_apps_expected | selectattr('itsi_content_pack', 'defined') | selectattr('itsi_content_pack') | rejectattr('_is_single_app_cp', 'equalto', true) | list }}"
  loop_control:
    loop_var: verify_app_item
    label: "{{ verify_app_item.name }}"
  vars:
    verify_base_path: "{{ splunk_home }}/etc/apps"
  when: direct_apps_expected | length > 0

- name: Build issues list for display
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.set_fact:
    direct_issues_display: "{{ direct_issues_display | default([]) + ['  - ' + item.app + ': ' + item.issue] }}"
  loop: "{{ direct_mismatches }}"
  when:
    - direct_apps_expected | length > 0
    - direct_mismatches | length > 0

- name: Display verification results
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.debug:
    msg: "{{ ['=========================================', 'DIRECT DEPLOYMENT VERIFICATION: ' + inventory_hostname, '=========================================', 'Host roles: ' + (current_host_roles | join(', ')), 'Expected apps: ' + (direct_apps_expected | map(attribute='name') | list | join(', ') if direct_apps_expected | length > 0 else '(none)'), 'Found apps (partial): ' + (direct_apps_found[:5] | join(', ') if direct_apps_found | length > 0 else '(none)') + ('...' if direct_apps_found | length > 5 else ''), 'Mismatches: ' + (direct_mismatches | length | string)] + (['Issues found:'] + direct_issues_display if direct_mismatches | length > 0 else ['  ✓ All apps deployed correctly']) + ['========================================='] }}"
  when: direct_apps_expected | length > 0

- name: Skip verification on this host
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.debug:
    msg: "Skipping direct deployment verification on {{ inventory_hostname }} (no apps expected)"
  when: direct_apps_expected | length == 0

- name: Fail if mismatches found and fail_on_mismatch is true
  tags:
    - splunk
    - splunk_apps
    - direct_deployment
    - verify
  ansible.builtin.fail:
    msg: "Direct deployment app verification failed on {{ inventory_hostname }}: {{ direct_mismatches | length }} mismatch(es) found"
  when:
    - fail_on_mismatch | default(false) | bool
    - direct_mismatches | length > 0
