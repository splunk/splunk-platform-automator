---
# Handlers are run in the order they are listed, not in the order that they are notified
# See: https://docs.ansible.com/ansible/latest/reference_appendices/glossary.html#Notify

- name: Wait for SHC service ready and call push bundle
  tags:
    - splunk
    - splunk_common
    - search_head
    - shcluster
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/run_splunk_cli.yml"
  vars:
    spa_splunk_cli_args:
      - show
      - shcluster-status
    spa_splunk_cli_mode: until_shc_ready
    spa_splunk_cli_retries: 15
    spa_splunk_cli_delay: 10
    spa_splunk_cli_delegate_to: "{{ splunk_shc_host_list|first }}"
    spa_splunk_cli_register_as: shcluster_ready
    spa_splunk_cli_notify: Push shcluster bundle

# SHC captain may return 503 (e.g. kvstore-upgrade in progress) if not ready; retry with delay
- name: Push shcluster bundle
  tags:
    - splunk
    - splunk_common
    - search_head
    - shcluster
    - deployer
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/run_splunk_cli.yml"
  vars:
    spa_splunk_cli_args:
      - apply
      - shcluster-bundle
      - -target
      - "https://{{ splunk_shc_host_list | first }}:8089"
      - --answer-yes
    spa_splunk_cli_mode: until_rc
    spa_splunk_cli_retries: 120
    spa_splunk_cli_delay: 15
    spa_splunk_cli_delegate_to: "{{ splunk_shc_deployer }}"
    spa_splunk_cli_register_as: shcluster_bundle_result

- name: Initiate SHC rolling restart
  tags:
    - splunk
    - splunk_common
    - search_head
    - shcluster
    - deployer
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/run_splunk_cli.yml"
  vars:
    spa_splunk_cli_args:
      - rolling-restart
      - shcluster-members
      - -searchable
      - "false"
    spa_splunk_cli_delegate_to: "{{ splunk_shc_host_list | first }}"
  when: splunk_shc_host_list is defined and (splunk_shc_host_list | length) > 0

- name: Apply indexer cluster bundle
  tags:
    - splunk
    - splunk_common
    - indexer
    - idxcluster
    - cluster_manager
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/run_splunk_cli.yml"
  vars:
    spa_splunk_cli_args:
      - apply
      - cluster-bundle
      - --answer-yes
    spa_splunk_cli_delegate_to: "{{ splunk_idxc_cm }}"

# Deploy-server REST reload can time out when splunkd is busy (CLI rc 22); retry with delay like shcluster-bundle.
- name: Reload deploy-server
  tags:
    - splunk
    - splunk_common
    - deployment_server
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/run_splunk_cli.yml"
  vars:
    spa_splunk_cli_args:
      - reload
      - deploy-server
    spa_splunk_cli_mode: until_rc
    spa_splunk_cli_retries: "{{ splunk_reload_deploy_server_retries | default(8) | int }}"
    spa_splunk_cli_delay: "{{ splunk_reload_deploy_server_delay | default(20) | int }}"
    spa_splunk_cli_delegate_to: "{{ splunk_deployment_server | first }}"
    spa_splunk_cli_register_as: splunk_reload_deploy_server_result

- name: Restart splunk
  tags:
    - splunk
    - splunk_common
    - splunk_software
    - direct_deployment
  ansible.builtin.service:
    name: "{{ splunk_service_name }}"
    state: restarted
  become: true
  become_user: root
  delegate_to: "{{ inventory_hostname }}"
  when: restart_splunk_direct_etc_apps | default(false) | bool or (app_path is defined and splunk_home is defined and app_path == splunk_home + '/etc/apps')
