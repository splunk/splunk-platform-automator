---
# Handlers are run in the order they are listed, not in the order that they are notified
# See: https://docs.ansible.com/ansible/latest/reference_appendices/glossary.html#Notify

- name: Wait for SHC service ready and call push bundle
  tags:
    - splunk
    - splunk_common
    - search_head
    - shcluster
  ansible.builtin.command: "{{ splunk_home }}/bin/splunk show shcluster-status -auth admin:{{ splunk_admin_password }}"
  become: true
  become_user: "{{ splunk_user }}"
  register: shcluster_ready
  until: "shcluster_ready.stdout.find('service_ready_flag : 1') != -1 and shcluster_ready.stdout.find('status : Down') != 0"
  retries: 15
  delay: 10
  delegate_to: "{{ splunk_shc_host_list|first }}"
  notify: Push shcluster bundle

# SHC captain may return 503 (e.g. kvstore-upgrade in progress) if not ready; retry with delay
- name: Push shcluster bundle
  tags:
    - splunk
    - splunk_common
    - search_head
    - shcluster
    - deployer
  ansible.builtin.command: "{{ splunk_home }}/bin/splunk apply shcluster-bundle -target https://{{ splunk_shc_host_list | first }}:8089 -auth admin:{{ splunk_admin_password }} --answer-yes"
  become: true
  become_user: "{{ splunk_user }}"
  delegate_to: "{{ splunk_shc_deployer }}"
  register: shcluster_bundle_result
  until: shcluster_bundle_result.rc == 0
  retries: 120
  delay: 15

- name: Initiate SHC rolling restart
  tags:
    - splunk
    - splunk_common
    - search_head
    - shcluster
    - deployer
  ansible.builtin.command: "{{ splunk_home }}/bin/splunk rolling-restart shcluster-members -searchable false -auth admin:{{ splunk_admin_password }}"
  become: true
  become_user: "{{ splunk_user }}"
  delegate_to: "{{ splunk_shc_host_list | first }}"
  when: splunk_shc_host_list is defined and (splunk_shc_host_list | length) > 0

- name: Apply indexer cluster bundle
  tags:
    - splunk
    - splunk_common
    - indexer
    - idxcluster
    - cluster_manager
  ansible.builtin.command: "{{ splunk_home }}/bin/splunk apply cluster-bundle -auth admin:{{ splunk_admin_password }} --answer-yes"
  become: true
  become_user: "{{ splunk_user }}"
  delegate_to: "{{ splunk_idxc_cm }}"

# Deploy-server REST reload can time out when splunkd is busy (CLI rc 22); retry with delay like shcluster-bundle.
- name: Reload deploy-server
  tags:
    - splunk
    - splunk_common
    - deployment_server
  ansible.builtin.command: "{{ splunk_home }}/bin/splunk reload deploy-server -auth admin:{{ splunk_admin_password }}"
  become: true
  become_user: "{{ splunk_user }}"
  delegate_to: "{{ splunk_deployment_server | first }}"
  register: splunk_reload_deploy_server_result
  until: splunk_reload_deploy_server_result.rc == 0
  retries: "{{ splunk_reload_deploy_server_retries | default(8) | int }}"
  delay: "{{ splunk_reload_deploy_server_delay | default(20) | int }}"

- name: Restart splunk
  tags:
    - splunk
    - splunk_common
    - splunk_software
    - direct_deployment
  ansible.builtin.service:
    name: "{{ splunk_service_name }}"
    state: restarted
  become: true
  become_user: root
  delegate_to: "{{ inventory_hostname }}"
  when: restart_splunk_direct_etc_apps | default(false) | bool or (app_path is defined and splunk_home is defined and app_path == splunk_home + '/etc/apps')
