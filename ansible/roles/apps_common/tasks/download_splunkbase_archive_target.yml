---
# Download Splunkbase app archive on target. Runs resolve first (get app info, set path) then auth and get_url.
# Expects: splunkbase_app_id, splunkbase_cache_dir, splunkbase_dest_slug. Optional: splunkbase_version, splunkbase_fail_msg_app_name.

- name: "Resolve Splunkbase version (target)"
  ansible.builtin.include_tasks: resolve_splunkbase_version_target.yml

- name: "Create app cache directory (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.file:
    path: "{{ splunkbase_cache_dir }}"
    state: directory
    mode: '0755'

- name: "Authenticate with Splunkbase (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.uri:
    url: "https://splunkbase.splunk.com/api/account:login"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ splunk_app_deployment.splunkbase_username }}"
      password: "{{ splunk_app_deployment.splunkbase_password }}"
    return_content: true
    status_code: [200]
  register: splunkbase_auth

- name: "Set Splunkbase auth token (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    splunkbase_token: "{{ splunkbase_auth.content | regex_search('<id>([^<]+)</id>', '\\1') | first }}"

- name: "Download app from Splunkbase (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.get_url:
    url: "{{ splunkbase_release_path }}"
    dest: "{{ splunkbase_archive_path }}"
    headers:
      X-Auth-Token: "{{ splunkbase_token }}"
    mode: '0644'
    timeout: "{{ splunk_app_deployment.download_timeout | default(120) }}"
  register: splunkbase_download_result
  until: splunkbase_download_result is succeeded
  retries: "{{ splunk_app_deployment.retry_count | default(3) }}"
  delay: 10

- name: "Set archive path from download result (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    splunkbase_archive_path: "{{ splunkbase_download_result.dest }}"
