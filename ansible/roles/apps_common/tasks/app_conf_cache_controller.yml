---
# App conf cache (controller). List archive, extract app.conf paths, read [launcher] version.
# Expects: app_conf_archive_path, app_conf_cache_dir, app_conf_cache_subdir, app_conf_resolved_version.

- name: "Ensure app conf cache dir exists (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.file:
    path: "{{ app_conf_cache_dir }}/{{ app_conf_cache_subdir }}/{{ app_conf_resolved_version }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  run_once: true
  become: false

- name: "List app archive for app.conf paths (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.shell:
    cmd: "tar tzf '{{ app_conf_archive_path }}' | grep -E '/default/app\\.conf$'"
  register: app_conf_list_tar
  changed_when: false
  delegate_to: localhost
  run_once: true
  become: false

- name: "Set app conf paths from archive listing (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    app_conf_paths: "{{ (app_conf_list_tar.stdout_lines | default([])) | map('trim') | select() | list }}"
  delegate_to: localhost
  run_once: true
  become: false
  when: app_conf_list_tar is defined and (app_conf_list_tar.stdout_lines | default([]) | length > 0)

- name: "Set app names from app.conf paths (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    app_conf_app_names: "{{ (app_conf_paths | default([])) | map('regex_replace', '^([^/]+)/.*', '\\1') | unique | list }}"
  delegate_to: localhost
  run_once: true
  become: false
  when: app_conf_paths is defined and (app_conf_paths | length > 0)

- name: "Extract app conf files from archive to cache (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.shell:
    cmd: "tar -xzf '{{ app_conf_archive_path }}' -C '{{ app_conf_cache_dir }}/{{ app_conf_cache_subdir }}/{{ app_conf_resolved_version }}' {{ app_conf_paths | join(' ') }}"
  args:
    creates: "{{ app_conf_cache_dir }}/{{ app_conf_cache_subdir }}/{{ app_conf_resolved_version }}/{{ (app_conf_paths | default([]) | first) | default('') }}"
  delegate_to: localhost
  run_once: true
  become: false
  when: app_conf_paths is defined and (app_conf_paths | length > 0)

- name: "Get version from [launcher] or [id] or first version= in cached app.conf (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.shell:
    cmd: |
      f="{{ app_conf_cache_dir }}/{{ app_conf_cache_subdir }}/{{ app_conf_resolved_version }}/{{ item }}/default/app.conf"
      v=$(sed -n '/\[launcher\]/,/^\[/p' "$f" | grep -E '^\s*version\s*=' | head -1 | sed -E 's/^[^=]*=\s*//')
      if [ -z "$v" ]; then
        v=$(sed -n '/\[id\]/,/^\[/p' "$f" | grep -E '^\s*version\s*=' | head -1 | sed -E 's/^[^=]*=\s*//')
      fi
      if [ -z "$v" ]; then
        v=$(grep -E '^\s*version\s*=' "$f" | head -1 | sed -E 's/^[^=]*=\s*//')
      fi
      printf '%s' "$v"
  loop: "{{ app_conf_app_names | default([]) }}"
  register: app_conf_cached_versions
  changed_when: false
  delegate_to: localhost
  run_once: true
  become: false
  when: app_conf_app_names is defined and (app_conf_app_names | length > 0)

- name: "Build app conf expected versions dict (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    app_conf_expected_versions: "{{ app_conf_expected_versions | default({}) | combine({ item.item: (item.stdout | default('') | trim) }) }}"
  loop: "{{ app_conf_cached_versions.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}: {{ item.stdout | default('') | trim }}"
  delegate_to: localhost
  run_once: true
  become: false
  when:
    - app_conf_cached_versions is defined
    - app_conf_cached_versions.results is defined
    - (app_conf_cached_versions.results | length > 0)

- name: "Propagate app conf expected versions to all hosts (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    app_conf_expected_versions: "{{ hostvars['localhost']['app_conf_expected_versions'] | default({}) }}"
  when:
    - hostvars['localhost'] is defined
    - (hostvars['localhost']['app_conf_expected_versions'] | default({}) | length > 0)
