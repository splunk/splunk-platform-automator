---
# Read-only version check for Splunkbase apps.
# Resolves expected version via Splunkbase API and compares to installed version.
# No download, no extraction, no write operations.
# Required vars: app_name, app_item, app_version, target_path, app_cache_dir, splunk_home.
# Sets: resolved_version, current_version, update_needed.

- name: "Set Splunkbase vars for version check"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
    - verify
  ansible.builtin.set_fact:
    splunkbase_app_id: "{{ app_item.app_id }}"
    splunkbase_version: "{{ app_version }}"
    splunkbase_cache_dir: "{{ app_cache_dir }}"
    splunkbase_dest_slug: "{{ app_name }}"
    splunkbase_fail_msg_app_name: "{{ app_name }}"

- name: "Resolve Splunkbase version for {{ app_name }} (verify)"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
    - verify
  ansible.builtin.include_tasks: resolve_splunkbase_version.yml

- name: "Set resolved_version for version check"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
    - verify
  ansible.builtin.set_fact:
    resolved_version: "{{ splunkbase_resolved_version if (splunk_app_deployment.target_download | default(false)) else (((_splunkbase_resolve_result | default({})).ansible_facts | default({}))._splunkbase_resolved_version | default(splunkbase_resolved_version)) }}"

- name: "Read installed version for {{ app_name }} (verify)"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
    - verify
  become: true
  block:
    - name: "Check if {{ app_name }} app.conf exists (verify)"
      ansible.builtin.stat:
        path: "{{ target_path }}/default/app.conf"
      register: existing_app

    - name: "Read target app.conf version ([launcher]/[id]) for {{ app_name }} (verify)"
      ansible.builtin.include_tasks: read_app_conf_version_launcher_id.yml
      vars:
        read_app_conf_file: "{{ target_path }}/default/app.conf"
      when: existing_app.stat.exists

- name: "Set current_version from parsed target app.conf (verify)"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
    - verify
  ansible.builtin.set_fact:
    current_version: "{{ _read_app_conf_launcher_id_cmd.stdout | default('') | trim }}"
  when: existing_app.stat.exists

- name: "Set current_version when app not installed (verify)"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
    - verify
  ansible.builtin.set_fact:
    current_version: ""
  when: not existing_app.stat.exists

- name: "Determine if update needed for {{ app_name }} (verify)"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
    - verify
  ansible.builtin.set_fact:
    update_needed: "{{ (not existing_app.stat.exists) or ((current_version | default('')) != (resolved_version | default(''))) }}"

- name: "Debug version status for {{ app_name }} (verify)"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
    - verify
  ansible.builtin.include_tasks: deployment_version_status_debug.yml
  vars:
    dvs_task_label: "{{ deployment_version_task_label | default('Verification') }}"
    dvs_app_name: "{{ app_name }}"
    dvs_current: "{{ current_version | default('') }}"
    dvs_expected: "{{ (resolved_version ~ ' (latest)') if ((app_version | default('latest') | string | lower | trim) == 'latest') else resolved_version }}"
    dvs_update_needed: "{{ update_needed }}"
    dvs_force: false
    dvs_location: "{{ deployment_version_location | default('etc/apps/') }}"
