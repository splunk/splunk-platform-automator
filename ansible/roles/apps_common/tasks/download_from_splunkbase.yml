---
# Download one archive from Splunkbase by app_id to a target location (controller or target).
# Caller must set: splunkbase_app_id, splunkbase_cache_dir, splunkbase_dest_slug (e.g. 'itsi' -> itsi_VERSION.tgz).
# Optional: splunkbase_version (default 'latest'), splunkbase_fail_msg_app_name.
# After include: splunkbase_resolved_version, splunkbase_archive_path are set (on localhost when controller; propagate in caller if needed).

- name: "Download app from Splunkbase (controller)"
  ansible.builtin.include_tasks: download_from_splunkbase_controller.yml
  when: not (splunk_app_deployment.target_download | default(false))

- name: "Download app from Splunkbase (target)"
  ansible.builtin.include_tasks: download_from_splunkbase_target.yml
  when: splunk_app_deployment.target_download | default(false)
