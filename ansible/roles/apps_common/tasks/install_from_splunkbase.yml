---
# Install app from Splunkbase to target directory.
# Uses unified download (resolve_splunkbase_version + download_splunkbase_archive when update needed).
# Required vars: app_name, app_item, app_version, target_path, app_cache_dir, splunk_home.

- name: "Set Splunkbase download vars for install"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.set_fact:
    splunkbase_app_id: "{{ app_item.app_id }}"
    splunkbase_version: "{{ app_version }}"
    splunkbase_cache_dir: "{{ app_cache_dir }}"
    splunkbase_dest_slug: "{{ app_name }}"
    splunkbase_fail_msg_app_name: "{{ app_name }}"

- name: "Resolve Splunkbase version for {{ app_name }}"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.include_tasks: resolve_splunkbase_version.yml

- name: "Set resolved_version for install logic"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.set_fact:
    resolved_version: "{{ splunkbase_resolved_version if (splunk_app_deployment.target_download | default(false)) else (((_splunkbase_resolve_result | default({})).ansible_facts | default({}))._splunkbase_resolved_version | default(splunkbase_resolved_version)) }}"

- name: "Set force_update flag for {{ app_name }}"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.set_fact:
    _app_force_update: "{{ app_item.force_update | default(false) | bool }}"

- name: "Set update_mode for {{ app_name }}"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.set_fact:
    _app_update_mode: "{{ app_item.update_mode | default(splunk_app_deployment.update_mode | default(splunk_app_deployment_defaults.update_mode | default('merge'))) }}"

- name: "Check if {{ app_name }} already exists"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.stat:
    path: "{{ target_path }}/default/app.conf"
  register: existing_app

- name: "Read target app.conf version ([launcher]/[id]) for {{ app_name }}"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.include_tasks: read_app_conf_version_launcher_id.yml
  vars:
    read_app_conf_file: "{{ target_path }}/default/app.conf"
  when: existing_app.stat.exists

- name: "Set current_version from parsed target app.conf"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.set_fact:
    current_version: "{{ _read_app_conf_launcher_id_cmd.stdout | default('') | trim }}"
  when: existing_app.stat.exists

- name: "Set current_version when app not installed (empty, same as ITSI display)"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.set_fact:
    current_version: ""
  when: not existing_app.stat.exists

- name: "Determine if update needed for {{ app_name }}"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.set_fact:
    update_needed: "{{ (_app_force_update | bool) or (not existing_app.stat.exists) or ((current_version | default('')) != (resolved_version | default(''))) }}"

- name: "Debug update status for {{ app_name }}"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.include_tasks: deployment_version_status_debug.yml
  vars:
    dvs_task_label: "{{ deployment_version_task_label | default('Splunk app') }}"
    dvs_app_name: "{{ app_name }}"
    dvs_current: "{{ current_version | default('') }}"
    dvs_expected: "{{ (resolved_version ~ ' (latest)') if ((app_version | default('latest') | string | lower | trim) == 'latest') else resolved_version }}"
    dvs_update_needed: "{{ update_needed }}"
    dvs_force: "{{ app_item.force_update | default(false) }}"
    dvs_location: "{{ deployment_version_location | default('etc/apps/') }}"

- name: "Download {{ app_name }} from Splunkbase when update needed"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.include_tasks: download_splunkbase_archive.yml
  when: update_needed | bool

- name: "Set archive path for install step"
  tags:
    - splunk
    - splunk_apps
    - splunkbase
  ansible.builtin.set_fact:
    app_download_archive_path: "{{ splunkbase_archive_path if (splunk_app_deployment.target_download | default(false)) else (((_splunkbase_download_result | default({})).ansible_facts | default({}))._splunkbase_archive_path | default('')) }}"
  when: update_needed | bool

- name: "Download and install {{ app_name }}"
  when: update_needed | bool
  block:
    - name: "Set flag to remove controller archive after install when cache_downloads=false"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.set_fact:
        _remove_controller_archive_after_install: "{{ not (splunk_app_deployment.target_download | default(false)) and not (splunk_app_deployment.cache_downloads | default(true)) }}"

    - name: "Set controller archive path on localhost for post-install removal (cache_downloads=false)"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.set_fact:
        _controller_archive_path_to_remove: "{{ (hostvars['localhost'] | default({})).get('splunkbase_archive_path', '') }}"
      delegate_to: localhost
      run_once: true
      when: _remove_controller_archive_after_install | default(false) | bool

    - name: "Backup existing {{ app_name }}"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.archive:
        path: "{{ target_path }}"
        dest: "{{ splunk_app_deployment.backup_location | default('/tmp/splunk_app_backups') }}/{{ app_name }}_{{ ansible_date_time.date }}.tgz"
      when:
        - existing_app.stat.exists
        - splunk_app_deployment.backup_apps_before_update | default(false)

    - name: "Remove old {{ app_name }} (clean mode)"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.file:
        path: "{{ target_path }}"
        state: absent
      when:
        - existing_app.stat.exists
        - _app_update_mode == 'clean'

    # --- Clean mode: extract directly to target ---
    - name: "Extract {{ app_name }} to target (clean)"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.unarchive:
        src: "{{ app_download_archive_path }}"
        dest: "{{ target_path | dirname }}"
        remote_src: "{{ splunk_app_deployment.target_download | default(false) }}"
        list_files: true
        owner: "{{ splunk_user | default('splunk') }}"
        group: "{{ splunk_group | default('splunk') }}"
      register: extract_result
      when: _app_update_mode == 'clean'

    # --- Merge mode: extract to temp, rsync overlay into target ---
    - name: "Create temp extraction directory for {{ app_name }} (merge)"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.tempfile:
        state: directory
        prefix: "splunk_app_merge_"
      register: _merge_tmp_dir
      when: _app_update_mode == 'merge'

    - name: "Extract {{ app_name }} to temp directory (merge)"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.unarchive:
        src: "{{ app_download_archive_path }}"
        dest: "{{ _merge_tmp_dir.path }}"
        remote_src: "{{ splunk_app_deployment.target_download | default(false) }}"
        list_files: true
      register: extract_result
      when: _app_update_mode == 'merge'

    - name: "Fail when app archive top-level folder does not match app name (wrong app_id?)"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.fail:
        msg: >-
          App archive top-level folder '{{ extract_result.files[0] | split('/') | first }}' does not match app name '{{ app_name }}'.
          Check app_id ({{ app_item.app_id }}) in splunk_app_deployment.apps - you may have specified the wrong Splunkbase app.
      when:
        - extract_result.files is defined
        - extract_result.files | length > 0
        - (extract_result.files[0] | split('/') | first) != (app_name | trim)

    - name: "Rename extracted directory to target_path when using custom target_path (e.g. same app, different serverclass)"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.command: "mv '{{ (target_path | dirname) ~ '/' ~ (extract_result.files[0] | split('/') | first) }}' '{{ target_path }}'"
      when:
        - _app_update_mode == 'clean'
        - extract_result.files is defined
        - extract_result.files | length > 0
        - (extract_result.files[0] | split('/') | first) == (app_name | trim)
        - (extract_result.files[0] | split('/') | first) != (target_path | basename)

    - name: "Ensure target directory exists before merge"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.file:
        path: "{{ target_path }}"
        state: directory
        mode: "0755"
      when: _app_update_mode == 'merge'

    - name: "Overlay extracted files into {{ app_name }} (merge)"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.posix.synchronize:
        src: "{{ _merge_tmp_dir.path }}/{{ extract_result.files[0] | split('/') | first }}/"
        dest: "{{ target_path }}/"
        delete: false
        recursive: true
        archive: false
        checksum: true
        rsync_opts:
          - "--no-owner"
          - "--no-group"
      delegate_to: "{{ inventory_hostname }}"
      when: _app_update_mode == 'merge'

    - name: "Clean up temp extraction directory (merge)"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.file:
        path: "{{ _merge_tmp_dir.path }}"
        state: absent
      when:
        - _app_update_mode == 'merge'
        - _merge_tmp_dir.path is defined

    - name: "Set permissions on {{ app_name }}"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.file:
        path: "{{ target_path }}"
        state: directory
        owner: "{{ splunk_user | default('splunk') }}"
        group: "{{ splunk_group | default('splunk') }}"
        recurse: yes

    - name: "Remove downloaded archive after extraction (controller, cache_downloads=false)"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.file:
        path: "{{ (hostvars['localhost'] | default({})).get('_controller_archive_path_to_remove', '') or app_download_archive_path }}"
        state: absent
      delegate_to: localhost
      run_once: true
      become: false
      when: _remove_controller_archive_after_install | default(false) | bool

    - name: "Remove downloaded archive after extraction (target, cache_downloads=false)"
      tags:
        - splunk
        - splunk_apps
        - splunkbase
      ansible.builtin.file:
        path: "{{ app_download_archive_path }}"
        state: absent
      when:
        - splunk_app_deployment.target_download | default(false) | bool
        - not (splunk_app_deployment.cache_downloads | default(true))
