---
# Resolve Splunkbase app version and release path (API only, no download).
# Caller must set: splunkbase_app_id, splunkbase_cache_dir, splunkbase_dest_slug.
# Optional: splunkbase_version (default 'latest'), splunkbase_fail_msg_app_name.
# After include: splunkbase_resolved_version, splunkbase_release_path, splunkbase_archive_path (dest path) are set.

- name: "Resolve Splunkbase version (controller)"
  ansible.builtin.include_tasks: resolve_splunkbase_version_controller.yml
  when: not (splunk_app_deployment.target_download | default(false))

- name: "Resolve Splunkbase version (target)"
  ansible.builtin.include_tasks: resolve_splunkbase_version_target.yml
  when: splunk_app_deployment.target_download | default(false)
