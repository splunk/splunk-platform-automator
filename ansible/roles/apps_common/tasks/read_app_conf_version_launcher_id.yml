---
# Read version from default/app.conf — ITSI-style order, extended for [package]/[install]/build.
# Uses [[:space:]] (not \s) for BSD grep on macOS controllers.
#
# Required var: read_app_conf_file — path to default/app.conf
#
# Publishes register: _read_app_conf_launcher_id_cmd (stdout = version or literal 'undef').
# With delegate_to: localhost on a parent block, that register is still on the *inventory* host
# (delegating host), unlike set_fact+delegate_facts which is brittle. Callers must copy
# stdout immediately; a second include overwrites the register.

- name: "Read [launcher]/[id]/… version from app.conf (ITSI-compatible)"
  ansible.builtin.shell:
    cmd: |
      f="{{ read_app_conf_file }}"
      if [ ! -f "$f" ]; then
        printf '%s' 'undef'
        exit 0
      fi
      _bom=$(LC_ALL=C head -c 3 "$f" 2>/dev/null | od -An -tx1 2>/dev/null | tr -d ' \n')
      if [ "$_bom" = "efbbbf" ]; then
        _tmp=$(mktemp 2>/dev/null || echo "/tmp/app_conf_nobom.$$")
        tail -c +4 "$f" > "$_tmp"
        f="$_tmp"
      fi
      v=$(sed -n '/\[launcher\]/,/^\[/p' "$f" | grep -E '^[[:space:]]*version[[:space:]]*=' | head -1 | sed -E 's/^[^=]*=[[:space:]]*//')
      if [ -z "$v" ]; then
        v=$(sed -n '/\[id\]/,/^\[/p' "$f" | grep -E '^[[:space:]]*version[[:space:]]*=' | head -1 | sed -E 's/^[^=]*=[[:space:]]*//')
      fi
      if [ -z "$v" ]; then
        v=$(grep -E '^[[:space:]]*version[[:space:]]*=' "$f" | head -1 | sed -E 's/^[^=]*=[[:space:]]*//')
      fi
      if [ -z "$v" ]; then
        v=$(sed -n '/\[package\]/,/^\[/p' "$f" | grep -iE '^[[:space:]]*version[[:space:]]*=' | head -1 | sed -E 's/^[^=]*=[[:space:]]*//')
      fi
      if [ -z "$v" ]; then
        v=$(sed -n '/\[install\]/,/^\[/p' "$f" | grep -iE '^[[:space:]]*version[[:space:]]*=' | head -1 | sed -E 's/^[^=]*=[[:space:]]*//')
      fi
      if [ -z "$v" ]; then
        v=$(sed -n '/^\[install\]/,/^\[/p' "$f" | grep -iE '^[[:space:]]*build[[:space:]]*=' | head -1 | sed -E 's/^[^=]*=[[:space:]]*//')
      fi
      v=$(printf '%s' "$v" | tr -d '\r')
      if [ -z "$v" ]; then
        printf '%s' 'undef'
      else
        printf '%s' "$v"
      fi
  register: _read_app_conf_launcher_id_cmd
  changed_when: false
  failed_when: false
