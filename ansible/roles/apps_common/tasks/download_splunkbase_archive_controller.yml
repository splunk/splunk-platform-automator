---
# Download Splunkbase app archive on controller. Runs resolve first (get app info, set path).
# Reuses an existing version-stamped archive; otherwise auth and get_url.
# Expects: splunkbase_app_id, splunkbase_cache_dir, splunkbase_dest_slug. Optional: splunkbase_version, splunkbase_fail_msg_app_name.

- name: "Resolve Splunkbase version (controller)"
  ansible.builtin.include_tasks: resolve_splunkbase_version_controller.yml

- name: "Stat Splunkbase archive (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.stat:
    path: "{{ splunkbase_archive_path }}"
  register: _splunkbase_controller_archive_stat
  delegate_to: localhost
  become: false
  run_once: true

- name: "Create app cache directory (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.file:
    path: "{{ splunkbase_cache_dir }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  run_once: true
  when: not _splunkbase_controller_archive_stat.stat.exists

- name: "Authenticate with Splunkbase (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.uri:
    url: "https://splunkbase.splunk.com/api/account:login"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ splunk_app_deployment.splunkbase_username }}"
      password: "{{ splunk_app_deployment.splunkbase_password }}"
    return_content: true
    status_code: [200]
  register: splunkbase_auth
  delegate_to: localhost
  become: false
  run_once: true
  when: not _splunkbase_controller_archive_stat.stat.exists

- name: "Set Splunkbase auth token (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    splunkbase_token: "{{ splunkbase_auth.content | regex_search('<id>([^<]+)</id>', '\\1') | first }}"
  delegate_to: localhost
  run_once: true
  when: not _splunkbase_controller_archive_stat.stat.exists

- name: "Download app from Splunkbase (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.get_url:
    url: "{{ splunkbase_release_path }}"
    dest: "{{ splunkbase_archive_path }}"
    headers:
      X-Auth-Token: "{{ splunkbase_token }}"
    mode: '0644'
    timeout: "{{ splunk_app_deployment.download_timeout | default(120) }}"
  register: splunkbase_download_result
  until: splunkbase_download_result is succeeded
  retries: "{{ splunk_app_deployment.retry_count | default(3) }}"
  delay: 10
  delegate_to: localhost
  become: false
  run_once: true
  when: not _splunkbase_controller_archive_stat.stat.exists

- name: "Set archive path from download result (controller)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    splunkbase_archive_path: "{{ splunkbase_download_result.dest }}"
  delegate_to: localhost
  run_once: true
  when: splunkbase_download_result.dest is defined
