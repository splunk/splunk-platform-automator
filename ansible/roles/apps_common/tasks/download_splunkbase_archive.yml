---
# Download Splunkbase app archive: resolve version then auth + get_url. Entry point for "get archive from Splunkbase" (controller or target).
# Caller must set: splunkbase_app_id, splunkbase_cache_dir, splunkbase_dest_slug. Optional: splunkbase_version, splunkbase_fail_msg_app_name.
# After include: splunkbase_resolved_version, splunkbase_archive_path are set (on localhost when controller; propagate in caller if needed).

- name: "Download Splunkbase archive (controller)"
  ansible.builtin.include_tasks: download_splunkbase_archive_controller.yml
  when: not (splunk_app_deployment.target_download | default(false))

- name: "Capture archive path on localhost for propagation (controller)"
  ansible.builtin.set_fact:
    _splunkbase_archive_path: "{{ splunkbase_archive_path }}"
  register: _splunkbase_download_result
  delegate_to: localhost
  run_once: true
  when: not (splunk_app_deployment.target_download | default(false))

- name: "Download Splunkbase archive (target)"
  ansible.builtin.include_tasks: download_splunkbase_archive_target.yml
  when: splunk_app_deployment.target_download | default(false)
