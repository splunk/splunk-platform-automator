---
# App conf cache (target). Optional: app_conf_app_names_needed (list to restrict to).
# Expects: app_conf_archive_path, app_conf_cache_dir, app_conf_cache_subdir, app_conf_resolved_version.

- name: "Ensure app conf cache dir exists (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.file:
    path: "{{ app_conf_cache_dir }}/{{ app_conf_cache_subdir }}/{{ app_conf_resolved_version }}"
    state: directory
    mode: '0755'

- name: "List app archive for app.conf paths (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.shell:
    cmd: "tar tzf '{{ app_conf_archive_path }}' | grep -E '/default/app\\.conf$'"
  register: app_conf_list_tar
  changed_when: false

- name: "Set app conf paths from archive listing (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    app_conf_paths: "{{ (app_conf_list_tar.stdout_lines | default([])) | map('trim') | select() | list }}"
  when: app_conf_list_tar is defined and (app_conf_list_tar.stdout_lines | default([]) | length > 0)

- name: "Set app names from app.conf paths (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    app_conf_app_names: "{{ (app_conf_paths | default([])) | map('regex_replace', '^([^/]+)/.*', '\\1') | unique | list }}"
  when: app_conf_paths is defined and (app_conf_paths | length > 0)

# When caller set app_conf_app_names_needed, restrict to those apps; else use full list
- name: "Initialize app conf paths filtered (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    app_conf_paths_filtered: []
  when: app_conf_app_names_needed is defined

- name: "Set app conf paths needed for this host (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    app_conf_paths_filtered: "{{ app_conf_paths_filtered | default([]) + [item] }}"
  loop: "{{ app_conf_paths | default([]) }}"
  loop_control:
    label: "{{ (item.split('/') | first) }}"
  when:
    - app_conf_paths is defined
    - app_conf_app_names_needed is defined
    - (item.split('/') | first) in app_conf_app_names_needed

- name: "Extract app conf files from archive to cache (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.shell:
    cmd: "tar -xzf '{{ app_conf_archive_path }}' -C '{{ app_conf_cache_dir }}/{{ app_conf_cache_subdir }}/{{ app_conf_resolved_version }}' {{ (app_conf_paths_filtered | default(app_conf_paths)) | default([]) | join(' ') }}"
  args:
    creates: "{{ app_conf_cache_dir }}/{{ app_conf_cache_subdir }}/{{ app_conf_resolved_version }}/{{ ((app_conf_paths_filtered | default(app_conf_paths)) | default([]) | first) or 'default' }}"
  when: (app_conf_paths_filtered | default(app_conf_paths) | default([]) | length) > 0

- name: "Get version from [launcher] or [id] or first version= in cached app.conf (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.shell:
    cmd: |
      f="{{ app_conf_cache_dir }}/{{ app_conf_cache_subdir }}/{{ app_conf_resolved_version }}/{{ item }}/default/app.conf"
      v=$(sed -n '/\[launcher\]/,/^\[/p' "$f" | grep -E '^\s*version\s*=' | head -1 | sed -E 's/^[^=]*=\s*//')
      if [ -z "$v" ]; then
        v=$(sed -n '/\[id\]/,/^\[/p' "$f" | grep -E '^\s*version\s*=' | head -1 | sed -E 's/^[^=]*=\s*//')
      fi
      if [ -z "$v" ]; then
        v=$(grep -E '^\s*version\s*=' "$f" | head -1 | sed -E 's/^[^=]*=\s*//')
      fi
      echo -n "$v"
  loop: "{{ app_conf_app_names_needed | default(app_conf_app_names) | default([]) }}"
  register: app_conf_cached_versions
  changed_when: false
  when: (app_conf_app_names_needed | default(app_conf_app_names) | default([]) | length) > 0

- name: "Build app conf expected versions dict (target)"
  tags:
    - splunk
    - splunk_apps
  ansible.builtin.set_fact:
    app_conf_expected_versions: "{{ app_conf_expected_versions | default({}) | combine({ item.item: (item.stdout | default('') | trim) }) }}"
  loop: "{{ app_conf_cached_versions.results | default([]) }}"
  when:
    - app_conf_cached_versions is defined
    - app_conf_cached_versions.results is defined
    - (app_conf_cached_versions.results | length > 0)
