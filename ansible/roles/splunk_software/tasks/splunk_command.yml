---

- name: "run Splunk command: 'splunk {{ splunk_command }}'"
  tags:
    - splunk
    - splunk_software
    - splunk_command
  ansible.builtin.include_role:
    name: splunk_common
    tasks_from: run_splunk_cli.yml
  vars:
    spa_splunk_cli_auth_user: "{{ splunk_admin_user | default('admin') }}"
    spa_splunk_cli_register_as: splunk_command_output
    spa_splunk_cli_args: "{{ (splunk_command | default('help')).split() + ['--answer-yes', '--no-prompt'] }}"

- name: Output from command
  tags:
    - splunk
    - splunk_software
    - splunk_command
  ansible.builtin.debug:
    var: splunk_command_output.stdout_lines
  when: splunk_command_output_show|default(true)|bool
