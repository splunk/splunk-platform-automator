---
- name: "Disable startwebserver in web.conf"
  tags:
    - splunk
    - splunk_webserver
  community.general.ini_file:
    path: "{{ splunk_home }}/etc/system/local/web.conf"
    section: settings
    option: "startwebserver"
    value: 0
    owner: "{{splunk_user}}"
    group: "{{splunk_group}}"
    mode: "0600"
  register: startwebserver

- name: Restart splunkweb
  tags:
    - splunk
    - splunk_webserver
  ansible.builtin.include_role:
    name: splunk_common
    tasks_from: run_splunk_cli.yml
  vars:
    spa_splunk_cli_args:
      - restart
      - splunkweb
  when: startwebserver.changed
