---
# Verify Cluster Manager Apps
# Checks if apps are deployed to manager-apps directory correctly

- name: Initialize verification results
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.set_fact:
    cm_verification_results: []
    cm_apps_expected: []
    cm_apps_found: []
    cm_mismatches: []
    _verify_allowed_fs_names: []
    _itsi_verify_allowed_fs_names: []

- name: Filter apps for cluster manager distribution
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.set_fact:
    cm_apps_expected: "{{ cm_apps_expected + [item] }}"
  loop: "{{ splunk_app_deployment.apps | default([]) }}"
  vars:
    _eligible_for_cm_verify: >-
      {{
        (
          item.deployment_target | default('auto') != 'direct'
          and (
            ((item.premium_app | default('')) == 'itsi')
            or (
              item.target_roles is defined
              and (
                (item.target_roles | intersect(['indexer']) | length > 0)
                or (item.target_roles | intersect(['cluster_manager']) | length > 0)
              )
            )
          )
        ) | bool
      }}
  when: _eligible_for_cm_verify | bool
  loop_control:
    label: "{{ item.name | default('?') }} — {{ 'eligible' if (_eligible_for_cm_verify | bool) else 'not eligible' }}"

- name: Normalize cm_apps_expected for verify filters (optional keys)
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.set_fact:
    cm_apps_expected_norm: "{{ cm_apps_expected_norm | default([]) + [{'premium_app': '', 'itsi_content_pack': false} | combine(item)] }}"
  loop: "{{ cm_apps_expected }}"
  loop_control:
    label: "{{ item.name | default('?') }}"
  when: cm_apps_expected | length > 0

- name: Apply normalized cm_apps_expected for verify
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.set_fact:
    cm_apps_expected: "{{ cm_apps_expected_norm | default([]) }}"
  when: cm_apps_expected | length > 0

- name: Check manager-apps directory exists
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.stat:
    path: "{{ splunk_home }}/etc/manager-apps"
  register: manager_apps_dir
  become: true

- name: List actual apps in manager-apps
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.find:
    paths: "{{ splunk_home }}/etc/manager-apps"
    file_type: directory
    recurse: no
  register: actual_apps
  when: manager_apps_dir.stat.exists
  become: true

- name: Extract app names from filesystem
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.set_fact:
    cm_apps_found: "{{ actual_apps.files | map(attribute='path') | map('basename') | list }}"
  when: manager_apps_dir.stat.exists and actual_apps.files is defined

- name: Verify each expected standard app
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.include_tasks: verify_single_app.yml
  loop: "{{ cm_apps_expected | rejectattr('premium_app', 'equalto', 'itsi') | list }}"
  loop_control:
    loop_var: verify_app_item
    label: "{{ verify_app_item.name }}"
  vars:
    verify_base_path: "{{ splunk_home }}/etc/manager-apps"
    verify_app_full_path: "{{ verify_app_item.target_path | default(verify_base_path ~ '/' ~ verify_app_item.name) }}"

- name: Verify each expected ITSI premium app
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.include_role:
    name: apps_itsi
    tasks_from: verify_premium_app.yml
  loop: "{{ cm_apps_expected | selectattr('premium_app', 'equalto', 'itsi') | list }}"
  loop_control:
    loop_var: verify_app_item
    label: "{{ verify_app_item.name }}"
  vars:
    verify_base_path: "{{ splunk_home }}/etc/manager-apps"
    verify_mismatches_var: cm_mismatches

- name: Add standard cluster manager app names to allowed verify list
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.set_fact:
    _verify_allowed_fs_names: >-
      {{ (_verify_allowed_fs_names | default([]) + (cm_apps_expected
         | rejectattr('premium_app', 'equalto', 'itsi')
         | map(attribute='name') | list)) | unique | list }}

- name: Add ITSI cluster manager on-disk dirs to allowed verify list
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.set_fact:
    _verify_allowed_fs_names: >-
      {{ (_verify_allowed_fs_names | default([]) + (_itsi_verify_allowed_fs_names | default([]))) | unique | list }}
  when:
    - (cm_apps_expected | selectattr('premium_app', 'equalto', 'itsi') | list | length) > 0

- name: Check for unexpected apps
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.set_fact:
    cm_mismatches: "{{ cm_mismatches + [{'app': item, 'issue': 'UNEXPECTED: App exists but not in config', 'severity': 'warning'}] }}"
  loop: "{{ cm_apps_found }}"
  when:
    - cm_apps_found | length > 0
    - item not in (_verify_allowed_fs_names | default([]))
    - not (item is match('^_.*'))
    - not (item is match('^' + splunk_app_prefix + '_.*'))

- name: Build issues list for display
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.set_fact:
    cm_issues_display: "{{ cm_issues_display | default([]) + ['  - ' + item.app + ': ' + item.issue] }}"
  loop: "{{ cm_mismatches }}"
  when: cm_mismatches | length > 0

- name: Display verification results
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.debug:
    msg: "{{ ['=========================================', 'CLUSTER MANAGER VERIFICATION: ' + inventory_hostname, '=========================================', 'Expected apps: ' + (cm_apps_expected | map(attribute='name') | list | join(', ') if cm_apps_expected | length > 0 else '(none)'), 'Found apps: ' + (cm_apps_found | join(', ') if cm_apps_found | length > 0 else '(none)'), 'Mismatches: ' + (cm_mismatches | length | string)] + (['Issues found:'] + cm_issues_display if cm_mismatches | length > 0 else ['  ✓ All apps deployed correctly']) + ['========================================='] }}"

- name: Fail if mismatches found and fail_on_mismatch is true
  tags:
    - splunk
    - splunk_apps
    - cluster_manager
    - verify
  ansible.builtin.fail:
    msg: "Cluster manager app verification failed: {{ cm_mismatches | length }} mismatch(es) found"
  when:
    - fail_on_mismatch | default(false) | bool
    - cm_mismatches | length > 0
