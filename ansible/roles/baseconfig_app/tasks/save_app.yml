---
# This playbook saves a copy of the app on the ansible host under
# $SPA_ENV_DIR/saved_base_config_apps (see spa_saved_baseconfig_apps_dir).

- name: Create hostname and app dir on ansible host
  tags:
    - splunk
    - splunk_baseconfig
    - save_baseconfig
    - save_baseconfig_apps
  ansible.builtin.file:
    path: "{{ spa_saved_baseconfig_apps_dir }}/{{ inventory_hostname }}/{{ app_path }}/{{ app_dest_name }}"
    state: directory
  become: false
  delegate_to: localhost

- name: Save app content to ansible host
  tags:
    - splunk
    - splunk_baseconfig
    - save_baseconfig
    - save_baseconfig_apps
  synchronize:
    src: "{{ app_path }}/{{ app_dest_name }}"
    dest: "{{ spa_saved_baseconfig_apps_dir }}/{{ inventory_hostname }}/{{ app_path }}/"
    rsync_path: "sudo -u {{splunk_user}} rsync"
    mode: pull
  become: false
