---
# spa-run:
#   schema: 1
#   summary: Run a Splunk CLI command on selected hosts.
#   description: Runs the requested Splunk command through the configured inventory.
#   category: operations
#   risk: mutating
#   requires_provisioned: true
#   requires:
#     - At least one host via --hosts
#   inputs:
#     - name: splunk_command
#       kind: extra-var
#       required: true
#       description: Command passed to the Splunk CLI.
#   examples:
#     - spa run splunk_cli --hosts idx1 -- -e "splunk_command='status'"

- name: Run Splunk command
  hosts:
    - role_cluster_manager
    - role_deployer
    - role_deployment_server
    - role_heavy_forwarder
    - role_indexer
    - role_license_manager
    - role_monitoring_console
    - role_search_head
    - role_universal_forwarder
  become: true
  become_user: root

  tasks:
    - name: Call splunk_command from role splunk_common
      ansible.builtin.include_role:
        name: splunk_software
        tasks_from: splunk_command
