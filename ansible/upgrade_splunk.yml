---
# spa-run:
#   schema: 1
#   summary: Upgrade Splunk on targeted hosts.
#   description: Upgrades Splunk Enterprise packages on the selected hosts.
#   category: upgrade
#   risk: mutating
#   examples:
#     - spa run upgrade_splunk --hosts indexer
# This playbook upgrades the splunk software

- name: Upgrade splunk software
  hosts:
    - role_cluster_manager
    - role_deployer
    - role_deployment_server
    - role_heavy_forwarder
    - role_indexer
    - role_license_manager
    - role_monitoring_console
    - role_search_head
    - role_universal_forwarder
  become: true
  become_user: root

  tasks:
    - name: Call upgrade splunk from role splunk_software
      ansible.builtin.include_role:
        name: splunk_software
        tasks_from: upgrade_software
